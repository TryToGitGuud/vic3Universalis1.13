 gw_congress.1.t:0 "Cemiyet Kongresi Toplandı"
 gw_congress.1.d:0 "Milletler Cemiyetini toplantıya çağırdık. Önde gelen üye devletlerin delegeleri önergemizi değerlendirmek üzere toplanıyor. Oyları, her gücün taşıdığı prestije göre ağırlıklandırılacaktır."
