 gw_hist.3001.t:0 "Galiplerin Masası"
 gw_hist.3001.d:0 "Toplar sessiz, fakat heyetler değil. Zafer; haritalar, dilekçeler, borçlar ve hiçbir geçit töreninin cevaplayamayacağı bir soru getirdi: zaferden sağ çıkabilecek bir barış nasıl olabilir?"
 gw_hist.3001.f:0 "Her uzlaşma bitkin insanlarla dolu bir oda olarak başlar."
 gw_hist.3001.a:0 "Barışı dikkatle şekillendirin."
 gw_hist_3001_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Son Konferans Ruhu#! kazanır"

 gw_hist.3002.t:0 "Yenilen Heyet"
 gw_hist.3002.d:0 "Heyet bandolar ve sancaklar olmadan geliyor. İmzalamaları, açıklamaları ve ülkelerinin acıyla okuyacağı bir barışı eve götürmeleri bekleniyor."
 gw_hist.3002.f:0 "Yenilginin çok yazarı, az gönüllüsü vardır."
 gw_hist.3002.a:0 "Şartları kabul edin ve yeniden inşa edin."
 gw_hist.3002.b:0 "Talepleri başka bir güne saklayın."
 gw_hist_3002_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Tarafsızlık Baskısı#! kazanır"
 gw_hist_3002_b_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Gizli Savaş Vaatleri#! kazanır"

 gw_hist.3003.t:0 "Tarafsız Gözlemciler"
 gw_hist.3003.d:0 "Tarafsız elçiler uzlaşmayı meslekî bir sükûnetle inceliyor. Ders, barışın basit olduğu değil; bir sonraki savaşın bugün yazılan maddelerde başlayabileceğidir."
 gw_hist.3003.f:0 "Kenarda durmak da hâlâ not almaktır."
 gw_hist.3003.a:0 "İstikrarlı bir uzlaşmayı destekleyin."
 gw_hist.3003.b:0 "Galiplere karşı bağımsızlığımızı koruyun."
 gw_hist_3003_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Tarafsızlık Teminatı#! kazanır"
 gw_hist_3003_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Tarafsızlık Baskısı#! kazanır"

 gw_hist.3004.t:0 "Tartışılan Uzlaşma"
 gw_hist.3004.d:0 "Hiç kimse temiz bir zafer iddia edemez. Barış aleni olarak eski düzeni koruyor, fakat her bakanlık eski varsayımların yaralandığını biliyor."
 gw_hist.3004.f:0 "Bir berabere bile yüzyılı değiştirebilir."
 gw_hist.3004.a:0 "Uzlaşmayı savunun."
 gw_hist.3004.b:0 "Şartları açıkça sorgulayın."
 gw_hist_3004_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Son Konferans Ruhu#! kazanır"
 gw_hist_3004_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Tarafsızlık Baskısı#! kazanır"

