 # --- World Tension Atmosphere Events ---
 gw_crisis.4001.t:0 "Pazarlar Telgrafları Okuyor"
 gw_crisis.4001.d:0 "Borsa salonları yabancı haberleri muhasebe defterleri kadar dikkatle okumaya başladı. Bir başkentten gelen söylenti başka bir başkentte fiyatları oynatıyor; bankacılar gemilerin yelken açıp açmaması gerektiğini soruyor, nazırlar ise teskinin paniğe oranla daha ucuza gelip gelmeyeceğini."
 gw_crisis.4001.f:0 "Kredi, top sesini ateşlenmeden önce duyar."
 gw_crisis.4001.a:0 "Borsaları teskin edin."
 gw_crisis.4001.b:0 "Bırakın yatırımcılar tehlikeyi fiyatlasın."
 gw_crisis_4001_a_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Son Konferans Ruhu#! kazanır\n- Bir Büyük Savaş blokuna liderlik ediyorsak, #V Dünya Gerginliği 1 azalır#!"
 gw_crisis_4001_b_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Piyasa Savaş Endişesi#! kazanır"

 gw_crisis.4002.t:0 "Gazeteler Düşmanını Buluyor"
 gw_crisis.4002.d:0 "Bir zamanlar ticaret rakamları basan editörler şimdi haritalar, kayıp tahminleri ve eski hakaretleri taze mürekkeple basıyor. Her başlık dünyayı daha basit, daha küçük ve daha tehlikeli hale getiriyor."
 gw_crisis.4002.f:0 "Bir millete kimden korkacağı öğretilebilir."
 gw_crisis.4002.a:0 "Basın halkın kararlılığını berkitsin."
 gw_crisis.4002.b:0 "Editörleri histeriye karşı uyarın."
 gw_crisis_4002_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Savaş Basın Seferberliği#! kazanır"
 gw_crisis_4002_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Gizli Diplomasi#! kazanır\n- Bir Büyük Savaş blokuna liderlik ediyorsak, #V Dünya Gerginliği 1 azalır#!"

 gw_crisis.4003.t:0 "Demiryolu Tarifeleri"
 gw_crisis.4003.d:0 "Genelkurmay artık önce ordulardan değil; istasyonlardan, köprülerden, kömür depolarından ve imkânsız dakikalardan söz ediyor. Sivil tarifeler seferberlik planlarına karşı sessizce ölçülmektedir."
 gw_crisis.4003.f:0 "Harita bir vaattir; tarife bir tehdittir."
 gw_crisis.4003.a:0 "Askerî takvimleri hazırlayın."
 gw_crisis.4003.b:0 "Trenleri biraz daha sivil tutun."
 gw_crisis_4003_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Seferberlik Tarifeleri#! kazanır"
 gw_crisis_4003_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Son Konferans Ruhu#! kazanır\n- Bir Büyük Savaş blokuna liderlik ediyorsak, #V Dünya Gerginliği 1 azalır#!"

 gw_crisis.4004.t:0 "Sefarethanelerde Lambalar Geç Saate Kadar Yanıyor"
 gw_crisis.4004.d:0 "Diplomatik mahallenin ışıkları gece yarısından sonra da yanıyor. Sefirler bir cümlenin hâlâ bir seferberlik emrini engelleyip engelleyemeyeceğini sorarken, ulaklar mühürlü zarflarla ıslak sokaklardan geçiyor."
 gw_crisis.4004.f:0 "Barış kimi zaman bir telgraf uzağında, kimi zaman çoktan yitirilmiştir."
 gw_crisis.4004.a:0 "Gizli kanalları açık tutun."
 gw_crisis.4004.b:0 "Halkı tehlikeden haberdar edin."
 gw_crisis_4004_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Gizli Diplomasi#! kazanır\n- Bir Büyük Savaş blokuna liderlik ediyorsak, #V Dünya Gerginliği 1 azalır#!"
 gw_crisis_4004_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Halkın Savaş Endişesi#! kazanır"

 gw_crisis.4005.t:0 "Savaş Endişesi"
 gw_crisis.4005.d:0 "Dükkânlar undan, gazeteler öğleye dek tükeniyor; muhalefet sıraları kabinenin ne bildiğini öğrenmek istiyor. Sokaklarda her üniforma bir alâmet gibi duruyor."
 gw_crisis.4005.f:0 "Halk, fırtınadan önce yağmurun kokusunu öğrendi."
 gw_crisis.4005.a:0 "Tehlikeyi kabullenip ülkeyi hazırlayın."
 gw_crisis.4005.b:0 "Korku yönetmeden sokakları yatıştırın."
 gw_crisis_4005_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Halkın Savaş Endişesi#! kazanır"
 gw_crisis_4005_b_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Son Konferans Ruhu#! kazanır\n- Bir Büyük Savaş blokuna liderlik ediyorsak, #V Dünya Gerginliği 1 azalır#!"

 gw_crisis.4006.t:0 "Son Bir Konferans Önerisi"
 gw_crisis.4006.d:0 "Tarafsız bir başkent odalar, tercümanlar ve son bir masa teklif ediyor. Davet kibar; ima öyle değil. Güçler oturmayı reddederse, dünya kendi sonucunu çıkaracaktır."
 gw_crisis.4006.f:0 "Barış ile seferberlik arasında merasimden başkasının kalmadığı anlar vardır."
 gw_crisis.4006.a:0 "Heyet gönderin."
 gw_crisis.4006.b:0 "Tartışılacak bir şey kalmadı."
 gw_crisis_4006_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Son Konferans Ruhu#! kazanır\n- Bir Büyük Savaş blokuna liderlik ediyorsak, #V Dünya Gerginliği 2 azalır#!"
 gw_crisis_4006_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Kısmî Seferberlik Planı#! kazanır"

 gw_crisis.4007.t:0 "Sınır Hadiseleri"
 gw_crisis.4007.d:0 "Sınırdan gelen raporlar en tehlikeli olan dışında her ayrıntıda birbirinden ayrılıyor: ateş açıldı. Devriye kumandanları kafa karışıklığını, gazeteler düşmanları suçluyor; generaller bir sonraki hatadan önce yetki istiyor."
 gw_crisis.4007.f:0 "Dünyanın hadise beklediği bir anda, hiçbir sınır hadisesi küçük değildir."
 gw_crisis.4007.a:0 "Sertliğe hazırlıkla cevap verin."
 gw_crisis.4007.b:0 "Subayları cezalandırın ve dosyayı kapatın."
 gw_crisis_4007_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Seferberlik Tarifeleri#! kazanır"
 gw_crisis_4007_b_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Gizli Diplomasi#! kazanır\n- Bir Büyük Savaş blokuna liderlik ediyorsak, #V Dünya Gerginliği 1 azalır#!"

 gw_crisis.4008.t:0 "Seferberlikten Önceki Sessizlik"
 gw_crisis.4008.d:0 "Başkentler tuhaf bir biçimde sessizleşiyor. Emirler henüz aleni değil, fakat ofisler geç boşalıyor, telgraf memurları kimseyle göz göze gelmiyor ve demiryolu adamları gelmemesini umdukları zarfları bekliyor."
 gw_crisis.4008.f:0 "Barışın son saati nadiren gürültülüdür."
 gw_crisis.4008.a:0 "Devletin sinirine hâkim olun."
 gw_crisis.4008.b:0 "Son bir çağrı yapın."
 gw_crisis_4008_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Kısmî Seferberlik Planı#! kazanır"
 gw_crisis_4008_b_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Son Konferans Ruhu#! kazanır\n- Bir Büyük Savaş blokuna liderlik ediyorsak, #V Dünya Gerginliği 2 azalır#!"

 # --- Wartime Atmosphere Events ---
 gw_war.3100.t:0 "Toplar Açıyor"
 gw_war.3100.d:0 "İlk raporlar dosyalanabileceğinden daha hızlı geliyor. Nezaret pencerelerinin altında kalabalıklar toplanıyor, bandolar yaşından eski çıkan şarkılar çalıyor ve her nazır savaşın sayfadan çıkıp milyonların hayatına girdiğini anlıyor."
 gw_war.3100.f:0 "Millet, henüz hesabını tutmadığı için tezahürat ediyor."
 gw_war.3100.a:0 "İlk saatleri ulusal kararlılığa çevirin."
 gw_war.3100.b:0 "Ülkeyi uzun bir savaşa hazırlayın."
 gw_war_3100_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold İlk Savaş Coşkusu#! kazanır\n- #V Ulusal Hoşnutsuzluk 4 azalır#!\n- #V Savaş Desteği 5 artar#!"
 gw_war_3100_b_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Uzun Savaş Planlaması#! kazanır\n- #V Ulusal Hoşnutsuzluk 6 azalır#!"

 gw_war.3101.t:0 "Millete Sunulan Savaş Hedefleri"
 gw_war.3101.d:0 "Hükûmetten zaferin ne anlama geldiğini söylemesi isteniyor. Bazıları yeniden yapılmış bir dünya talep ediyor, bazıları ordunun gerçekten kazanabileceği disiplinli bir barış. Nutuk, kayıplar bilinmeden basılacak."
 gw_war.3101.f:0 "Bir savaş hedefi, geri dönemeyeceklere verilen bir sözdür."
 gw_war.3101.a:0 "Fedakârlığa lâyık bir uzlaşma vaat edin."
 gw_war.3101.b:0 "Dikkatli konuşun ve kabineyi bir arada tutun."
 gw_war_3101_a_tt:0 "#header Etkiler:#!\n- #N Ulusal Hoşnutsuzluk 5 artar#!\n- #V Savaş Desteği 5 artar#!"
 gw_war_3101_b_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Ulusal Birlik Kabinesi#! kazanır\n- #V Ulusal Hoşnutsuzluk 4 azalır#!"

 gw_war.3102.t:0 "İlk Taarruz"
 gw_war.3102.d:0 "Genelkurmay, düşman yerleşmeden önce ivmenin yakalanması gerektiğinde ısrarcı. Cephe daha çok mermi, daha çok at, daha çok tren ve daha çok insan istiyor. Her gecikme korkaklık gibi, her emir bir kumar gibi hissedilir."
 gw_war.3102.f:0 "İlk taarruz her zaman son olacağına inanır."
 gw_war.3102.a:0 "İhtiyatları cepheye sürün ve ileri itin."
 gw_war.3102.b:0 "Coşku israfa dönüşmeden mevzilenin."
 gw_war_3102_a_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Taarruz Ruhu#! kazanır\n- #N Ulusal Hoşnutsuzluk 4 artar#!\n- #V Savaş Desteği 5 artar#!"
 gw_war_3102_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Tahkim Edilmiş Hatlar#! kazanır\n- #V Ulusal Hoşnutsuzluk 4 azalır#!\n- #N Savaş Desteği 3 azalır#!"

 gw_war.3103.t:0 "Hatlar Sertleşiyor"
 gw_war.3103.d:0 "Cephe, gazetelerin açıklayabileceği bir şekilde artık hareket etmiyor. Siperler derinleşiyor, yollar trafiğin altında kayboluyor ve ikmal subayları generaller kadar önemli hale geliyor. Savaş artık bir hadise değil. O bir sistem."
 gw_war.3103.f:0 "Çamur sabırlıdır."
 gw_war.3103.a:0 "Cepheye istediği her şeyi verin."
 gw_war.3103.b:0 "Birlikleri kırılmadan rotasyona alın."
 gw_war_3103_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Mühimmat Aşırı Üretimi#! kazanır\n- #N Ulusal Hoşnutsuzluk 4 artar#!\n- #V Savaş Desteği 3 artar#!"
 gw_war_3103_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Cephe Hattı Rahatlatması#! kazanır\n- #V Ulusal Hoşnutsuzluk 6 azalır#!"

 gw_war.3104.t:0 "Mermerdeki İsimler"
 gw_war.3104.d:0 "İlk listeler sütundu. Şimdi duvar oldular. Belediye meclisleri anıt fonları, kiliseler isimler, aileler ise mektupların gazetelerden önce neden kesildiğini soruyor."
 gw_war.3104.f:0 "Yas, hiçbir nezaretin dengeleyemeyeceği bir defterdir."
 gw_war.3104.a:0 "Bırakın millet umumî yas tutsun."
 gw_war.3104.b:0 "Listeleri kısa, gayeyi açık tutun."
 gw_war_3104_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Ulusal Birlik Kabinesi#! kazanır\n- #V Ulusal Hoşnutsuzluk 6 azalır#!"
 gw_war_3104_b_tt:0 "#header Etkiler:#!\n- #N Ulusal Hoşnutsuzluk 3 artar#!\n- #V Savaş Desteği 3 artar#!"

 gw_war.3105.t:0 "Bölünmüş Genelkurmay"
 gw_war.3105.d:0 "Haritalar suçlamaya dönüştü. Bir ekol düşman toparlanmadan saldırıyı talep ediyor; diğeri ordunun yeniden inşa edilebileceğinden hızlı eridiğini söylüyor. Kabine hangi başarısızlık türünden daha çok korktuğuna karar vermek zorunda."
 gw_war.3105.f:0 "Savaşta hem tedbir hem cesaret üniforma giyer."
 gw_war.3105.a:0 "Taarruz hizbini destekleyin."
 gw_war.3105.b:0 "Genelkurmayı uzun bir mücadele için yeniden tertipleyin."
 gw_war_3105_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Taarruz Ruhu#! kazanır\n- #N Ulusal Hoşnutsuzluk 5 artar#!\n- #V Savaş Desteği 5 artar#!"
 gw_war_3105_b_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Uzun Savaş Planlaması#! kazanır\n- #V Ulusal Hoşnutsuzluk 4 azalır#!"

 gw_war.3106.t:0 "Masaya Bir Barış Notası Düşüyor"
 gw_war.3106.d:0 "Nota gayri resmî, önemli olan her bakımdan imzasız ve görmezden gelinemez. Teslim demeden teminatlardan, sınırlardan, onurdan ve yorgunluktan söz ediyor. Kabine notayı iki kez okuyor."
 gw_war.3106.f:0 "İlk barış denemesi her zaman reddedilir."
 gw_war.3106.a:0 "Zayıflık kök salmadan reddedin."
 gw_war.3106.b:0 "Sağgörülü kanallar zemini yoklasın."
 gw_war_3106_a_tt:0 "#header Etkiler:#!\n- #N Ulusal Hoşnutsuzluk 5 artar#!\n- #V Savaş Desteği 5 artar#!"
 gw_war_3106_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Ulusal Birlik Kabinesi#! kazanır\n- #V Ulusal Hoşnutsuzluk 8 azalır#!\n- #N Savaş Desteği 5 azalır#!"

 gw_war.3107.t:0 "Kâğıt İmparatorluğu"
 gw_war.3107.d:0 "Her mermi, somun, bot ve vagon artık bir formla geliyor. Bürokrasi savaş etrafında, yanan bir binanın etrafındaki iskele gibi büyüyor. Yapıyı kurtarabilir veya herkesi içine hapsedebilir."
 gw_war.3107.f:0 "Modern savaş üç nüsha üzerinden yürütülür."
 gw_war.3107.a:0 "Nezaretler yükü merkezîleştirsin."
 gw_war.3107.b:0 "Cepheye zarar verdiği yerlerde kırtasiyeyi azaltın."
 gw_war_3107_a_tt:0 "#header Etkiler:#!\n- #V 18 ay boyunca#! #bold Uzun Savaş Planlaması#! kazanır\n- #N Ulusal Hoşnutsuzluk 2 artar#!"
 gw_war_3107_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Cephe Hattı Rahatlatması#! kazanır\n- #V Ulusal Hoşnutsuzluk 6 azalır#!\n- #N Savaş Desteği 3 azalır#!"

 gw_war.3108.t:0 "Son Taarruz"
 gw_war.3108.d:0 "Genelkurmay düz oklar ve özenli tahminler içeren bir plan daha sunuyor. Odadaki herkes biliyor ki tahminler birer dua. Bu saldırı başarısız olursa, bir sonraki harita bir barış masasında çizilebilir."
 gw_war.3108.f:0 "Son taarruz hiçbir zaman son olarak ilan edilmez."
 gw_war.3108.a:0 "Bir darbe daha her şeyi tayin edebilir."
 gw_war.3108.b:0 "Ülkeyi daha düşük bir barışa hazırlayın."
 gw_war_3108_a_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Taarruz Ruhu#! kazanır\n- #N Ulusal Hoşnutsuzluk 8 artar#!\n- #V Savaş Desteği 10 artar#!"
 gw_war_3108_b_tt:0 "#header Etkiler:#!\n- #V Ulusal Hoşnutsuzluk 10 azalır#!\n- #N Savaş Desteği 10 azalır#!"

 gw_war.3109.t:0 "Şehitlerin Şarkıları"
 gw_war.3109.d:0 "Şehitlerin artık şarkıları, rozetleri, bağış sandıkları ve her kasabada sessiz odaları var. Anıları milleti dengeleyebilir veya yeni bir fedakârlık talebine dönüşebilir."
 gw_war.3109.f:0 "Bir ülke, liderlerinin seçtiği dilde hatırlar."
 gw_war.3109.a:0 "Daha fazla kan istemeden onları onurlandırın."
 gw_war.3109.b:0 "Fedakârlıklarını savaşı bitirme çağrısına çevirin."
 gw_war_3109_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Ulusal Birlik Kabinesi#! kazanır\n- #V Ulusal Hoşnutsuzluk 8 azalır#!"
 gw_war_3109_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold İlk Savaş Coşkusu#! kazanır\n- #N Ulusal Hoşnutsuzluk 2 artar#!\n- #V Savaş Desteği 5 artar#!"

 gw_war.3110.t:0 "Tarafsız Pazarlar"
 gw_war.3110.d:0 "Savaş bazı güzergâhları kapattı, bazılarında ise servet yarattı. Tüccarlar ruhsat, insancıllar koridor, her muharip ise tarafsızlığın bir bedeli olup olmadığını soruyor."
 gw_war.3110.f:0 "Dünya alış-veriş ederken, tarafsızlık nadiren sessizdir."
 gw_war.3110.a:0 "Ticaret kendi alıcısını bulsun."
 gw_war.3110.b:0 "Yardımı kazancın önüne koyun."
 gw_war_3110_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Tarafsız Ticaret Patlaması#! kazanır"
 gw_war_3110_b_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold İnsani Yardım Misyonu#! kazanır\n- #V Dünya Gerginliği 1 azalır#!"

 gw_war.3111.t:0 "Dünya Kayıp Listelerini Okuyor"
 gw_war.3111.d:0 "Yabancı gazeteler rakamları önce ciddi bir ölçülülükle, sonra dehşetle basıyor. Savaş artık ittifaklar arasında uzak bir tartışma değil; isimlerle yazılmış bir uyarıdır."
 gw_war.3111.f:0 "Tarafsız evler bile yas coğrafyasını öğreniyor."
 gw_war.3111.a:0 "Tarafsız kanallar üzerinden yardım örgütleyin."
 gw_war.3111.b:0 "Gözlemci gönderin ve sessizce hazırlanın."
 gw_war_3111_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold İnsani Yardım Misyonu#! kazanır\n- #V Dünya Gerginliği 1 azalır#!"
 gw_war_3111_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Uzun Savaş Planlaması#! kazanır"

 # --- Discontent Threshold Events ---
 gw_war.3010.t:0 "Cepheden Mektuplar"
 gw_war.3010.d:0 "İlk bohçalar nezaretlere askerî iple bağlı olarak ulaşıyor: çamurun, hummanın ve topçunun dilini öğrenmiş oğullardan, kocalardan ve kardeşlerden gelen mektuplar. Editörler hangi sayfaların basılabileceğini soruyor. Kabine, ülkenin hakikate mi, cesarete mi, yoksa her ikisine mi ihtiyacı olduğunu soruyor."
 gw_war.3010.f:0 "Her aile satır aralarını okur."
 gw_war.3010.a:0 "Fedakârlıklarını ulusal kararlılığa çevirin."
 gw_war.3010.b:0 "İzin verin, cephe nefes alsın."
 gw_war_3010_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Savaş Tahvili Seferberliği#! kazanır\n- #V Ulusal Hoşnutsuzluk 8 azalır#!\n- #V Savaş Desteği 5 artar#!"
 gw_war_3010_b_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Cephe Hattı Rahatlatması#! kazanır\n- #V Ulusal Hoşnutsuzluk 12 azalır#!\n- Erler rotasyona alınıp dinlendirilirken seferberlik maliyetleri yükselir"

 gw_war.3020.t:0 "Mühimmat Defteri"
 gw_war.3020.d:0 "Ordunun talepleri artık sütunlara sığmıyor. Mermi, tüfek, üniforma, ray, kömür: her istem acil damgalı geliyor. Fabrikalar daha sert çalıştırılabilir, fakat işçiler akşam yemeğinde eksik yerleri çoktan saymaya başladı."
 gw_war.3020.f:0 "Cephe, cephe gerisinin zar zor karşılayabildiğini tüketir."
 gw_war.3020.a:0 "Tezgâhları gece boyunca yanık tutun."
 gw_war.3020.b:0 "Atölyeler boşalmadan önce karneleri gevşetin."
 gw_war_3020_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Mühimmat Aşırı Üretimi#! kazanır\n- #N Ulusal Hoşnutsuzluk 5 artar#!\n- #V Savaş Desteği 5 artar#!"
 gw_war_3020_b_tt:0 "#header Etkiler:#!\n- Etkinse #bold Savaş Zamanı Karnesi#!'ni kaldırır\n- #V 12 ay boyunca#! #bold Cephe Hattı Rahatlatması#! kazanır\n- #V Ulusal Hoşnutsuzluk 10 azalır#!\n- #N Savaş Desteği 5 azalır#!"

 gw_war.3030.t:0 "Güven Oyu"
 gw_war.3030.d:0 "Meclis sabah çanından önce dolu. Muhalefet sıraları şartları talep ediyor; nazırlar herhangi bir çatlak işaretinin akşama varmadan düşman karargâhında okunacağında ısrar ediyor. Dışarıda kalabalık, inanabileceği bir cümleyi bekliyor."
 gw_war.3030.f:0 "Savaştaki bir hükûmet hem orduları hem sabrı yönetmek zorundadır."
 gw_war.3030.a:0 "Zafer için bir ulusal nezaret kurun."
 gw_war.3030.b:0 "Panik yayılmadan kışkırtıcıları susturun."
 gw_war.3030.c:0 "Yorgunluğu kabul edin ve barışa giden bir yol vaat edin."
 gw_war_3030_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Savaş Tahvili Seferberliği#! kazanır\n- #V Ulusal Hoşnutsuzluk 10 azalır#!"
 gw_war_3030_b_tt:0 "#header Etkiler:#!\n- #V 18 ay boyunca#! #bold Askıya Alınmış Sivil Hürriyetler#! kazanır\n- #V Ulusal Hoşnutsuzluk 15 azalır#!\n- #V Savaş Desteği 10 artar#!\n- #N Radikalleşme zamanla yükselir#!"
 gw_war_3030_c_tt:0 "#header Etkiler:#!\n- #V Ulusal Hoşnutsuzluk 20 azalır#!\n- #N Savaş Desteği 10 azalır#!"

 gw_war.3001.t:0 "Cephe Gerisinde Çatlaklar"
 gw_war.3001.d:0 "Savaş uzayıp gitti ve cephe gerisinde çatlaklar belirmeye başladı. İşçiler greve gidiyor, askerler firar ediyor ve halk bu kan dökülmesinin gayesini açıkça sorguluyor. Aydınlar ve muhalif siyasetçiler barış talep ederken, ordu zaferin elimizde olduğunda ısrar ediyor — yeter ki millet sağlam dursun."
 gw_war.3001.f:0 "Bir millet kırılmadan önce daha ne kadar kanayabilir?"
 gw_war.3001.a:0 "Muhalifleri bastırın — savaş devam etmeli!"
 gw_war.3001.b:0 "Maneviyatı geri kazanmak için ödün verin."
 gw_war.3001.c:0 "Uyarıları görmezden gelin — geçip giderler."

 gw_war.3002.t:0 "Kırılma Noktası"
 gw_war.3002.d:0 "Millet kırılma noktasına ulaştı. Saflarda isyanlar yayıldı, fabrikalar durdu ve halk açık ayaklanmanın eşiğinde. Savaş artık sürdürülemez — bir şeyin verilmesi gerek, yoksa bütün devlet çökecek."
 gw_war.3002.f:0 "Sınırlarının ötesine zorlanan millet kendini yiyip bitirir."
 gw_war.3002.a:0 "Ordu savaşmayı reddediyor — saflar arasında isyan yayılıyor."
 gw_war.3002.b:0 "Devrim patlak veriyor — cephe gerisi bütünüyle çöküyor."

