 # --- Game Concept ---
 concept_gw_league_congress:0 "League Congress"
 concept_gw_league_congress_desc:0 "A League Congress is a formal session of the League of Nations in which the leading member powers record their votes on a motion before the assembly. Votes are weighted purely by prestige, and the session remains open for 3 months. Great Powers and Major Powers may call a Congress every 2 years.\n\nAvailable motions:\n- #bold Denounce#! (60%): prestige and influence penalties, slower infamy decay, and #N +5#! infamy\n- #bold Embargo#! (70%): trade, prestige, and influence penalties\n- #bold Expel Member#! (70%): target is expelled for 10 years\n\nFailed motions backfire, granting the target #V prestige#!."

 # ============================================================
 # GAME CONCEPTS
 # ============================================================

 concept_gw_world_tension:0 "World Tension"
 concept_gw_world_tension_desc:0 "World Tension represents the global level of international instability (0–100%). As it rises, Great Powers receive diplomatic bonuses, but the risk of a catastrophic Great War also increases. At 60% an Arms Race begins, at 70% ultimatums are issued, and at 80% the Central Powers leader may initiate the Great War.\n\nTension rises from Great Power conflicts, infamy, military buildup, and colonial competition. It decays during peacetime and is further reduced by the League of Nations. Before 1880, tighter source caps and Concert-era restraint make very high tension harder to sustain; direct war-start shocks are also capped by year. During the Great War itself, tension does not decay."

 concept_gw_league_of_nations:0 "League of Nations"
 concept_gw_league_of_nations_desc:0 "The League of Nations is an international institution formed once the Geneva Convention has gained broad Great Power acceptance. It aims to preserve the peace and reduces world tension during peacetime.\n\nMembers gain modest trade, prestige, and diplomatic advantages. The four Permanent Members wield greater authority and additional diplomatic leverage. Permanent membership rotates after each Great War to reflect the new balance of power. Non-members suffer mild penalties from international isolation.\n\nLeague members of sufficient standing may call a Congress to denounce, embargo, or expel nations."

 concept_gw_geneva_convention:0 "Geneva Convention"
 concept_gw_geneva_convention_desc:0 "The Geneva Convention is an international agreement on the protection of civilians and war victims. Nations that join gain Society Technology Spread, but generate more Infamy and receive fewer Diplomatic Play Maneuvers."

 concept_gw_central_powers:0 "Central Powers"
 concept_gw_central_powers_desc:0 "The Central Powers represent the revisionist bloc — Great Powers dissatisfied with the current international order who seek to reshape it. Led by the highest-ranked dissatisfied Great Power, they will challenge the Allied Powers when world tension reaches critical levels. Great Powers can also choose neutrality to opt out of both blocs."

 concept_gw_allied_powers:0 "Allied Powers"
 concept_gw_allied_powers_desc:0 "The Allied Powers represent the status quo bloc — Great Powers invested in maintaining the current international order. Led by the highest-ranked satisfied Great Power, they will defend the existing order against the Central Powers. Great Powers can also choose neutrality to opt out of both blocs."

 concept_gw_great_war:0 "Great War"
 concept_gw_great_war_desc:0 "A Great War is a general conflict between the rival Great Power blocs, triggered when world tension reaches a critical level. It can end in a decisive settlement or in an exhausted peace, and its outcome reshapes the international order.\n\nDuring the war, national discontent rises from casualties, radicalization, and strain on the home front. At 80% discontent, internal cracks appear; at 100%, mutiny or collapse may follow. After the war concludes, tension is reduced and the diplomatic order is rearranged."

 concept_gw_war_reparations:0 "War Reparations"
 concept_gw_war_reparations_desc:0 "Payments imposed on defeated nations after a Great War to compensate the victors for their losses. Reparations last for 10 years.\n\nDefeated Great Powers suffer -20% prestige, -10K tax capacity, -15% influence, and +25% mobilization cost. Victorious Great Powers receive +10% prestige, +5K tax capacity, and +10% influence. The leading defeated power also suffers additional penalties and may trigger the 'Stab-in-the-Back' myth."

 concept_gw_crisis:0 "International Crisis"
 concept_gw_crisis_desc:0 "A period of extreme diplomatic tension between the Great Powers, characterized by ultimatums, mobilizations, and the imminent risk of war. Crises can either be resolved diplomatically or escalate into the Great War."

 concept_gw_arms_race:0 "Arms Race"
 concept_gw_arms_race_desc:0 "A competitive military buildup between rival Great Powers. Each side expands its army and navy to match or exceed the other, driving world tension ever higher."

 concept_gw_call_to_war:0 "Call to War"
 concept_gw_call_to_war_desc:0 "Once [concept_gw_world_tension] reaches 80% and the [concept_gw_central_powers] leader has researched Multilateral Alliances, the leader may issue the Call to War. This opens a 90-day mobilization window during which all Great Powers must declare for the [concept_gw_central_powers], for the [concept_gw_allied_powers], or for neutrality. When the window closes, the diplomatic play that initiates the [concept_gw_great_war] is created automatically."

 concept_gw_alignment_score:0 "Alignment Score"
 concept_gw_alignment_score_desc:0 "Each Great Power has three alignment weights — Central, Allied, and Neutral — derived from order satisfaction, infamy, treaties, ideology, lobbies, and historical anchors. The AI compares these weights and a margin threshold before switching alignment, and an annual cooldown prevents whiplash. Players may override the AI choice through the alignment buttons."

 concept_gw_dissatisfied_with_order:0 "Dissatisfied with the Order"
 concept_gw_dissatisfied_with_order_desc:0 "A soft diplomatic stance: the country broadly resents the current international order and is treated as a [concept_gw_central_powers] sympathiser when no explicit alignment exists. Set automatically when alignment weights tilt toward the Central side."

 concept_gw_satisfied_with_order:0 "Satisfied with the Order"
 concept_gw_satisfied_with_order_desc:0 "A soft diplomatic stance: the country broadly supports the current international order and is treated as an [concept_gw_allied_powers] sympathiser when no explicit alignment exists. Set automatically when alignment weights tilt toward the Allied side."

 concept_gw_congress_motion:0 "Congress Motion"
 concept_gw_congress_motion_desc:0 "A formal proposal placed before the [concept_gw_league_of_nations] by a Great or Major Power: #bold Denounce#! (require 25+ infamy), #bold Embargo#! (require 50+ infamy), or #bold Expel#! a member (require 75+ infamy). Each motion runs for three months, during which League members cast support, oppose, or abstain. Severity of the resulting sanction scales with the support margin."

 concept_gw_congress_vote_threshold:0 "Congress Vote Threshold"
 concept_gw_congress_vote_threshold_desc:0 "Votes are weighted by prestige rather than counted one-per-state. A Denounce motion passes at #V 60%#! support; Embargo and Expel motions require #V 70%#!. Abstentions are excluded from both totals. If the motion fails, the initiator absorbs a prestige backfire instead."

 concept_gw_league_permanent_member:0 "Permanent Member"
 concept_gw_league_permanent_member_desc:0 "The four highest-prestige League members at any given moment carry the Permanent Member modifier, granting additional influence and prestige. Permanent seats rotate as prestige rankings change and after every Great War."

 concept_gw_league_non_member_pressure:0 "Non-Member Pressure"
 concept_gw_league_non_member_pressure_desc:0 "Recognised states that have refused or lost their League membership operate under diplomatic suspicion: reduced influence and a small infamy generation penalty. The pressure lifts when the country rejoins the League."

 concept_gw_war_reparations_paying:0 "Paying Reparations"
 concept_gw_war_reparations_paying_desc:0 "Defeated Great Powers pay reparations for a decade after the [concept_gw_great_war]. The burden is most heavily felt by the leading defeated power, whose stab-in-the-back narratives can destabilise the post-war order."

 concept_gw_major_defeat:0 "Major Defeat"
 concept_gw_major_defeat_desc:0 "Applied to a Great Power that capitulates during the [concept_gw_great_war]. Loss of influence persists for ten years and signals the strategic eclipse of the defeated power in the new international order."

