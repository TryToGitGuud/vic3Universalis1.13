 # --- World Tension Atmosphere Events ---
 gw_crisis.4001.t:0 "The Markets Read the Telegrams"
 gw_crisis.4001.d:0 "The exchange floors have begun to read foreign dispatches as carefully as ledgers. A rumor from one capital moves prices in another; bankers ask whether ships should sail, and ministers ask whether reassurance is cheaper than panic."
 gw_crisis.4001.f:0 "Credit hears the guns before they fire."
 gw_crisis.4001.a:0 "Reassure the exchanges."
 gw_crisis.4001.b:0 "Let the financiers price in the danger."
 gw_crisis_4001_a_tt:0 "#header Effects:#!\n- Gains #bold Last Conference Spirit#! for #V 9 months#!\n- If we lead a Great War bloc, #V World Tension decreases by 1#!"
 gw_crisis_4001_b_tt:0 "#header Effects:#!\n- Gains #bold Market War Scare#! for #V 12 months#!"

 gw_crisis.4002.t:0 "The Newspapers Find Their Enemy"
 gw_crisis.4002.d:0 "Editors who once printed trade figures now print maps, casualty forecasts, and old insults in fresh ink. Every headline makes the world simpler, smaller, and more dangerous."
 gw_crisis.4002.f:0 "A nation can be taught whom to fear."
 gw_crisis.4002.a:0 "Let the press stiffen public resolve."
 gw_crisis.4002.b:0 "Warn the editors against hysteria."
 gw_crisis_4002_a_tt:0 "#header Effects:#!\n- Gains #bold War Press Campaign#! for #V 12 months#!"
 gw_crisis_4002_b_tt:0 "#header Effects:#!\n- Gains #bold Backchannel Diplomacy#! for #V 9 months#!\n- If we lead a Great War bloc, #V World Tension decreases by 1#!"

 gw_crisis.4003.t:0 "Railway Timetables"
 gw_crisis.4003.d:0 "The general staff no longer speaks of armies first, but of stations, bridges, coal depots, and impossible minutes. Civilian timetables are quietly measured against mobilization plans."
 gw_crisis.4003.f:0 "The map is a promise; the timetable is a threat."
 gw_crisis.4003.a:0 "Prepare the military schedules."
 gw_crisis.4003.b:0 "Keep the trains civilian a little longer."
 gw_crisis_4003_a_tt:0 "#header Effects:#!\n- Gains #bold Mobilization Timetables#! for #V 12 months#!"
 gw_crisis_4003_b_tt:0 "#header Effects:#!\n- Gains #bold Last Conference Spirit#! for #V 9 months#!\n- If we lead a Great War bloc, #V World Tension decreases by 1#!"

 gw_crisis.4004.t:0 "Embassy Lights Burn Late"
 gw_crisis.4004.d:0 "The lights in the diplomatic quarter stay on after midnight. Couriers cross wet streets with sealed envelopes while ambassadors ask whether a sentence can still prevent a mobilization order."
 gw_crisis.4004.f:0 "Peace is sometimes a telegram away, and sometimes already lost."
 gw_crisis.4004.a:0 "Keep the backchannels open."
 gw_crisis.4004.b:0 "Let the public know the danger."
 gw_crisis_4004_a_tt:0 "#header Effects:#!\n- Gains #bold Backchannel Diplomacy#! for #V 12 months#!\n- If we lead a Great War bloc, #V World Tension decreases by 1#!"
 gw_crisis_4004_b_tt:0 "#header Effects:#!\n- Gains #bold Public War Scare#! for #V 9 months#!"

 gw_crisis.4005.t:0 "The War Scare"
 gw_crisis.4005.d:0 "Shops sell out of flour, newspapers sell out by noon, and opposition benches demand to know what the cabinet knows. In the streets, every uniform looks like an omen."
 gw_crisis.4005.f:0 "The public has learned the smell of rain before the storm."
 gw_crisis.4005.a:0 "Admit the danger and brace the country."
 gw_crisis.4005.b:0 "Calm the streets before fear governs them."
 gw_crisis_4005_a_tt:0 "#header Effects:#!\n- Gains #bold Public War Scare#! for #V 12 months#!"
 gw_crisis_4005_b_tt:0 "#header Effects:#!\n- Gains #bold Last Conference Spirit#! for #V 12 months#!\n- If we lead a Great War bloc, #V World Tension decreases by 1#!"

 gw_crisis.4006.t:0 "A Last Conference Proposed"
 gw_crisis.4006.d:0 "A neutral capital offers rooms, interpreters, and one last table. The invitation is polite; the implication is not. If the powers refuse to sit, the world will draw its own conclusion."
 gw_crisis.4006.f:0 "There are moments when ceremony is all that remains between peace and mobilization."
 gw_crisis.4006.a:0 "Send a delegation."
 gw_crisis.4006.b:0 "There is nothing left to discuss."
 gw_crisis_4006_a_tt:0 "#header Effects:#!\n- Gains #bold Last Conference Spirit#! for #V 12 months#!\n- If we lead a Great War bloc, #V World Tension decreases by 2#!"
 gw_crisis_4006_b_tt:0 "#header Effects:#!\n- Gains #bold Partial Mobilization Plan#! for #V 9 months#!"

 gw_crisis.4007.t:0 "Border Incidents"
 gw_crisis.4007.d:0 "Reports from the frontier disagree on every detail except the most dangerous one: shots were fired. Patrol commanders blame confusion, newspapers blame enemies, and generals ask for authority before the next mistake."
 gw_crisis.4007.f:0 "A frontier incident is never small when the world is waiting for one."
 gw_crisis.4007.a:0 "Answer firmness with readiness."
 gw_crisis.4007.b:0 "Punish the officers and close the file."
 gw_crisis_4007_a_tt:0 "#header Effects:#!\n- Gains #bold Mobilization Timetables#! for #V 12 months#!"
 gw_crisis_4007_b_tt:0 "#header Effects:#!\n- Gains #bold Backchannel Diplomacy#! for #V 12 months#!\n- If we lead a Great War bloc, #V World Tension decreases by 1#!"

 gw_crisis.4008.t:0 "The Silence Before Mobilization"
 gw_crisis.4008.d:0 "The chancelleries grow strangely quiet. Orders are not yet public, but offices empty late, telegraph clerks do not meet anyone's eyes, and railway men wait for envelopes they hope will not arrive."
 gw_crisis.4008.f:0 "The last hour of peace is rarely loud."
 gw_crisis.4008.a:0 "Hold the nerve of the state."
 gw_crisis.4008.b:0 "Make one final appeal."
 gw_crisis_4008_a_tt:0 "#header Effects:#!\n- Gains #bold Partial Mobilization Plan#! for #V 12 months#!"
 gw_crisis_4008_b_tt:0 "#header Effects:#!\n- Gains #bold Last Conference Spirit#! for #V 12 months#!\n- If we lead a Great War bloc, #V World Tension decreases by 2#!"

 # --- Wartime Atmosphere Events ---
 gw_war.3100.t:0 "The Guns Open"
 gw_war.3100.d:0 "The first reports arrive faster than anyone can file them. Crowds gather beneath ministry windows, bands play songs that already sound older than they are, and every minister understands that the war has escaped the page and entered the lives of millions."
 gw_war.3100.f:0 "The nation cheers because it has not yet counted."
 gw_war.3100.a:0 "Turn the first hours into national resolve."
 gw_war.3100.b:0 "Prepare the country for a long war."
 gw_war_3100_a_tt:0 "#header Effects:#!\n- Gains #bold Initial War Fervor#! for #V 12 months#!\n- #V National Discontent decreases by 4#!\n- #V War Support increases by 5#!"
 gw_war_3100_b_tt:0 "#header Effects:#!\n- Gains #bold Long War Planning#! for #V 12 months#!\n- #V National Discontent decreases by 6#!"

 gw_war.3101.t:0 "War Aims Before the Nation"
 gw_war.3101.d:0 "The government is asked to say what victory means. Some demand a remade world, others a disciplined peace that the army can actually win. The speech will be printed before the casualties are known."
 gw_war.3101.f:0 "A war aim is a promise made to those who may never return."
 gw_war.3101.a:0 "Promise a settlement worthy of the sacrifice."
 gw_war.3101.b:0 "Speak carefully and bind the cabinet together."
 gw_war_3101_a_tt:0 "#header Effects:#!\n- #N National Discontent increases by 5#!\n- #V War Support increases by 5#!"
 gw_war_3101_b_tt:0 "#header Effects:#!\n- Gains #bold National Unity Cabinet#! for #V 12 months#!\n- #V National Discontent decreases by 4#!"

 gw_war.3102.t:0 "The First Offensive"
 gw_war.3102.d:0 "The staff insists that momentum must be seized before the enemy settles in. The front asks for more shells, more horses, more trains, and more men. Every delay feels like cowardice; every order feels like a wager."
 gw_war.3102.f:0 "The first offensive always believes it will be the last."
 gw_war.3102.a:0 "Commit the reserves and press forward."
 gw_war.3102.b:0 "Dig in before enthusiasm becomes waste."
 gw_war_3102_a_tt:0 "#header Effects:#!\n- Gains #bold Offensive Spirit#! for #V 9 months#!\n- #N National Discontent increases by 4#!\n- #V War Support increases by 5#!"
 gw_war_3102_b_tt:0 "#header Effects:#!\n- Gains #bold Entrenched Lines#! for #V 9 months#!\n- #V National Discontent decreases by 4#!\n- #N War Support decreases by 3#!"

 gw_war.3103.t:0 "The Lines Harden"
 gw_war.3103.d:0 "The front has stopped moving in any way the newspapers can explain. Trenches deepen, roads vanish under traffic, and supply officers become as important as generals. The war is no longer an event. It is a system."
 gw_war.3103.f:0 "Mud is patient."
 gw_war.3103.a:0 "Feed the front whatever it asks."
 gw_war.3103.b:0 "Rotate the units before they break."
 gw_war_3103_a_tt:0 "#header Effects:#!\n- Gains #bold Munitions Overdrive#! for #V 12 months#!\n- #N National Discontent increases by 4#!\n- #V War Support increases by 3#!"
 gw_war_3103_b_tt:0 "#header Effects:#!\n- Gains #bold Frontline Relief#! for #V 9 months#!\n- #V National Discontent decreases by 6#!"

 gw_war.3104.t:0 "Names on Marble"
 gw_war.3104.d:0 "The first lists were columns. Now they are walls. Town councils ask for memorial funds, churches ask for names, and families ask why the letters stopped before the papers did."
 gw_war.3104.f:0 "Grief is a ledger no ministry can balance."
 gw_war.3104.a:0 "Let the nation mourn in public."
 gw_war.3104.b:0 "Keep the lists brief and the purpose clear."
 gw_war_3104_a_tt:0 "#header Effects:#!\n- Gains #bold National Unity Cabinet#! for #V 12 months#!\n- #V National Discontent decreases by 6#!"
 gw_war_3104_b_tt:0 "#header Effects:#!\n- #N National Discontent increases by 3#!\n- #V War Support increases by 3#!"

 gw_war.3105.t:0 "The General Staff Divided"
 gw_war.3105.d:0 "The maps have become accusations. One school demands attack before the enemy recovers; another says the army is being spent faster than it can be rebuilt. The cabinet must decide which kind of failure it fears more."
 gw_war.3105.f:0 "In war, caution and courage both arrive wearing uniforms."
 gw_war.3105.a:0 "Back the offensive faction."
 gw_war.3105.b:0 "Reorder the staff for a longer struggle."
 gw_war_3105_a_tt:0 "#header Effects:#!\n- Gains #bold Offensive Spirit#! for #V 12 months#!\n- #N National Discontent increases by 5#!\n- #V War Support increases by 5#!"
 gw_war_3105_b_tt:0 "#header Effects:#!\n- Gains #bold Long War Planning#! for #V 12 months#!\n- #V National Discontent decreases by 4#!"

 gw_war.3106.t:0 "A Peace Note Crosses the Desk"
 gw_war.3106.d:0 "The note is unofficial, unsigned in all the ways that matter, and impossible to ignore. It speaks of guarantees, borders, honor, and exhaustion without saying surrender. The cabinet reads it twice."
 gw_war.3106.f:0 "The first peace feeler is always denied."
 gw_war.3106.a:0 "Reject it before weakness takes root."
 gw_war.3106.b:0 "Let discreet channels test the ground."
 gw_war_3106_a_tt:0 "#header Effects:#!\n- #N National Discontent increases by 5#!\n- #V War Support increases by 5#!"
 gw_war_3106_b_tt:0 "#header Effects:#!\n- Gains #bold National Unity Cabinet#! for #V 9 months#!\n- #V National Discontent decreases by 8#!\n- #N War Support decreases by 5#!"

 gw_war.3107.t:0 "The Empire of Paper"
 gw_war.3107.d:0 "Every shell, loaf, boot, and railway carriage now has a form. The bureaucracy grows around the war like scaffolding around a burning building. It may save the structure, or trap everyone inside it."
 gw_war.3107.f:0 "Modern war is fought in triplicate."
 gw_war.3107.a:0 "Let the ministries centralize the burden."
 gw_war.3107.b:0 "Cut the red tape where it hurts the front."
 gw_war_3107_a_tt:0 "#header Effects:#!\n- Gains #bold Long War Planning#! for #V 18 months#!\n- #N National Discontent increases by 2#!"
 gw_war_3107_b_tt:0 "#header Effects:#!\n- Gains #bold Frontline Relief#! for #V 9 months#!\n- #V National Discontent decreases by 6#!\n- #N War Support decreases by 3#!"

 gw_war.3108.t:0 "The Last Offensive"
 gw_war.3108.d:0 "The staff presents one more plan with straight arrows and careful estimates. Everyone in the room knows the estimates are prayers. If this attack fails, the next map may be drawn at a peace table."
 gw_war.3108.f:0 "The last offensive is never announced as the last."
 gw_war.3108.a:0 "One more blow may decide everything."
 gw_war.3108.b:0 "Prepare the country for a lesser peace."
 gw_war_3108_a_tt:0 "#header Effects:#!\n- Gains #bold Offensive Spirit#! for #V 9 months#!\n- #N National Discontent increases by 8#!\n- #V War Support increases by 10#!"
 gw_war_3108_b_tt:0 "#header Effects:#!\n- #V National Discontent decreases by 10#!\n- #N War Support decreases by 10#!"

 gw_war.3109.t:0 "Songs of the Fallen"
 gw_war.3109.d:0 "The dead now have songs, badges, subscription funds, and quiet rooms in every town. Their memory can steady the nation or be turned into another demand for sacrifice."
 gw_war.3109.f:0 "A country remembers in the language its leaders choose."
 gw_war.3109.a:0 "Honor them without asking for more blood."
 gw_war.3109.b:0 "Make their sacrifice a call to finish the war."
 gw_war_3109_a_tt:0 "#header Effects:#!\n- Gains #bold National Unity Cabinet#! for #V 12 months#!\n- #V National Discontent decreases by 8#!"
 gw_war_3109_b_tt:0 "#header Effects:#!\n- Gains #bold Initial War Fervor#! for #V 9 months#!\n- #N National Discontent increases by 2#!\n- #V War Support increases by 5#!"

 gw_war.3110.t:0 "Neutral Markets"
 gw_war.3110.d:0 "War has closed some routes and made fortunes on others. Merchants ask for licenses, humanitarians ask for corridors, and every belligerent asks whether neutrality has a price."
 gw_war.3110.f:0 "Neutrality is rarely quiet when the world is buying."
 gw_war.3110.a:0 "Let commerce find its buyers."
 gw_war.3110.b:0 "Put relief ahead of profit."
 gw_war_3110_a_tt:0 "#header Effects:#!\n- Gains #bold Neutral Trade Boom#! for #V 12 months#!"
 gw_war_3110_b_tt:0 "#header Effects:#!\n- Gains #bold Humanitarian Mission#! for #V 12 months#!\n- #V World Tension decreases by 1#!"

 gw_war.3111.t:0 "The World Reads the Casualty Lists"
 gw_war.3111.d:0 "Foreign newspapers print the numbers with solemn restraint at first, then with horror. The war is no longer a distant argument of alliances; it is a warning written in names."
 gw_war.3111.f:0 "Even neutral homes learn the geography of grief."
 gw_war.3111.a:0 "Organize relief through neutral channels."
 gw_war.3111.b:0 "Send observers and prepare quietly."
 gw_war_3111_a_tt:0 "#header Effects:#!\n- Gains #bold Humanitarian Mission#! for #V 12 months#!\n- #V World Tension decreases by 1#!"
 gw_war_3111_b_tt:0 "#header Effects:#!\n- Gains #bold Long War Planning#! for #V 9 months#!"

 # --- Discontent Threshold Events ---
 gw_war.3010.t:0 "Letters from the Front"
 gw_war.3010.d:0 "The first bundles arrive at the ministries tied with military twine: letters from sons, husbands, and brothers who have learned the language of mud, fever, and artillery. Editors ask which pages may be printed. The cabinet asks whether the country needs truth, courage, or both."
 gw_war.3010.f:0 "Every family reads between the lines."
 gw_war.3010.a:0 "Turn their sacrifice into national resolve."
 gw_war.3010.b:0 "Grant leave and let the front breathe."
 gw_war_3010_a_tt:0 "#header Effects:#!\n- Gains #bold War Bond Drive#! for #V 12 months#!\n- #V National Discontent decreases by 8#!\n- #V War Support increases by 5#!"
 gw_war_3010_b_tt:0 "#header Effects:#!\n- Gains #bold Frontline Relief#! for #V 12 months#!\n- #V National Discontent decreases by 12#!\n- Mobilization costs rise while men are rotated and rested"

 gw_war.3020.t:0 "The Munitions Ledger"
 gw_war.3020.d:0 "The army's demands no longer fit neatly in columns. Shells, rifles, uniforms, rails, coal: each request arrives marked urgent. The factories can be driven harder, but the workers already count the missing places at supper."
 gw_war.3020.f:0 "The front consumes what the home front can scarcely replace."
 gw_war.3020.a:0 "Keep the works lit through the night."
 gw_war.3020.b:0 "Ease rationing before the workshops empty."
 gw_war_3020_a_tt:0 "#header Effects:#!\n- Gains #bold Munitions Overdrive#! for #V 12 months#!\n- #N National Discontent increases by 5#!\n- #V War Support increases by 5#!"
 gw_war_3020_b_tt:0 "#header Effects:#!\n- Removes #bold Wartime Rationing#! if active\n- Gains #bold Frontline Relief#! for #V 12 months#!\n- #V National Discontent decreases by 10#!\n- #N War Support decreases by 5#!"

 gw_war.3030.t:0 "The Vote of Confidence"
 gw_war.3030.d:0 "The chamber is full before the morning bell. Opposition benches demand terms; ministers insist that any sign of fracture will be read at the enemy headquarters before sunset. Outside, the crowd waits for a sentence it can believe."
 gw_war.3030.f:0 "A government at war must command both armies and patience."
 gw_war.3030.a:0 "Form a national ministry for victory."
 gw_war.3030.b:0 "Suspend the agitators before panic spreads."
 gw_war.3030.c:0 "Admit the strain and promise a road to peace."
 gw_war_3030_a_tt:0 "#header Effects:#!\n- Gains #bold War Bond Drive#! for #V 12 months#!\n- #V National Discontent decreases by 10#!"
 gw_war_3030_b_tt:0 "#header Effects:#!\n- Gains #bold Civil Liberties Suspended#! for #V 18 months#!\n- #V National Discontent decreases by 15#!\n- #V War Support increases by 10#!\n- #N Radicalism increases over time#!"
 gw_war_3030_c_tt:0 "#header Effects:#!\n- #V National Discontent decreases by 20#!\n- #N War Support decreases by 10#!"

 gw_war.3001.t:0 "Cracks in the Home Front"
 gw_war.3001.d:0 "The war has dragged on, and cracks are appearing in the home front. Workers strike, soldiers desert, and the public openly questions the purpose of this bloodshed. Intellectuals and opposition politicians demand peace, while the military insists that victory is within reach — if only the nation holds firm."
 gw_war.3001.f:0 "How long can a nation bleed before it breaks?"
 gw_war.3001.a:0 "Crack down on the dissenters — the war must go on!"
 gw_war.3001.b:0 "Make concessions to restore morale."
 gw_war.3001.c:0 "Ignore the warnings — they will pass."

 gw_war.3002.t:0 "The Breaking Point"
 gw_war.3002.d:0 "The nation has reached its breaking point. Mutinies have spread through the ranks, factories have ground to a halt, and the people are on the verge of open revolt. The war can no longer be sustained — something must give, or the entire state will collapse."
 gw_war.3002.f:0 "A nation pushed beyond its limits will devour itself."
 gw_war.3002.a:0 "The military refuses to fight — mutiny spreads through the ranks."
 gw_war.3002.b:0 "Revolution erupts — the home front collapses entirely."

