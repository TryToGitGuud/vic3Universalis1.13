 # ============================================================

 je_gw_geneva_convention:0 "Cenevre Sözleşmesi"
 je_gw_geneva_convention_desc:0 "Cenevre'de akdedilen, sivillerin ve savaş mağdurlarının korunmasına ilişkin uluslararası sözleşmeye katılmayı düşünmeliyiz. Antlaşmanın kapsamı genişledikçe, bir uluslararası örgütün de kurulması mümkün olacaktır."
 je_gw_geneva_convention_reason:0 "$je_gw_geneva_convention_desc$\nKatılan Büyük Güçler: [JournalEntry.CalcCurrentGoalValue|V|0]/[JournalEntry.GetGoalAddValue|V|0]\n\n#header Katılım Etkileri:#!\n@innovation! #P +%10#! Sosyal Teknoloji Yayılımı\n@infamy! #N +%10#! Kötü Nam Üretimi\n@maneuvers! #N -%10#! Diplomatik Hamle Manevrası"
 gw_geneva_4_great_powers:0 "En az 4 Büyük Güç Sözleşmeye katılmış olmalı"
 gw_geneva_year_1900:0 "Yıl 1900 veya sonrası olmalı"
 gw_je_geneva_member:0 "#V Sözleşmeye katılmış bulunuyoruz#!"
 gw_je_geneva_not_member:0 "#N Sözleşmeye henüz katılmadık#!"

 gw_join_geneva_convention:0 "Cenevre Sözleşmesine Katıl"
 gw_join_geneva_convention_desc:0 "Devletimiz, sivillerin ve savaş esirlerinin korunmasını taahhüt ederek Cenevre Sözleşmesine katılacaktır."
 gw_join_geneva_convention_button:0 "Cenevre Sözleşmesine Katıl"
 gw_join_geneva_convention_button_desc:0 "Cenevre Sözleşmesine katıl ve diplomatik yükümlülüklerini kabul et."
 gw_join_geneva_convention_effect_tt:0 "Cenevre Sözleşmesinin imzacısı olacağız."
 gw_join_geneva_not_at_war_tt:0 "Barış halinde olmalıyız"
 gw_geneva_human_rights_tt:0 "İnsan Hakları teknolojisini araştırmış olmalıyız"
 gw_join_league_decision:0 "Milletler Cemiyetine Katıl"
 gw_join_league_decision_desc:0 "Devletimiz, Milletler Cemiyetine katılacak ve onun diplomatik çerçevesini kabul edecektir."
 gw_join_league_button:0 "Milletler Cemiyetine Katıl"
 gw_join_league_button_desc:0 "Milletler Cemiyetine katıl ve onun diplomatik çerçevesini kabul et."
 gw_join_league_effect_tt:0 "Milletler Cemiyetinin üyesi olacağız."

 je_gw_league_of_nations:0 "Milletler Cemiyeti"
 je_gw_league_of_nations_desc:0 "Milletler Cemiyeti, barışı korumak ve dünya gerginliğini azaltmak için çalışan uluslararası bir örgüttür."
 je_gw_league_of_nations_reason:0 "Merkez: [ROOT.GetCountry.GetCustom('GetGWLeagueHQ')]\nDaimi Üyeler: [ROOT.GetCountry.GetCustom('GetGWLeaguePermanentMembers')]\nToplam Üye: [JournalEntry.CalcCurrentGoalValue|V|0]\n\n#header Üyelik Ayrıcalıkları:#!\n@money! #V +%5#! Ticari Rekabetçilik\n@influence! #V +%5#! Nüfuz\n@prestige! #V +%3#! Prestij\n@maneuvers! Daimi Üyeler ayrıca ek #V nüfuz#!, #V prestij#! ve #V manevra#! kazanır\n\n#header Üye Olmayanlar:#!\n@prestige! #N -%3#! Prestij\n@money! #N -%3#! Ticari Rekabetçilik, yalıtılmışlıktan ötürü"
 gw_je_league_permanent_member:0 "#V Milletler Cemiyetinin Daimi Üyesiyiz#!"
 gw_je_league_member:0 "#V Milletler Cemiyetinin üyesiyiz#!"
 gw_je_league_not_member:0 "#N Milletler Cemiyetinin üyesi değiliz#!"
 je_gw_congress_session:0 "Cemiyet Kongresi"
 je_gw_congress_session_desc:0 "Cemiyet Kongresi toplantı halindedir. Önde gelen üye güçlerin heyetleri, gündemdeki önerge için oylarını kaydetmektedir."
 je_gw_congress_session_reason:0 "Önerge: [ROOT.GetCountry.GetCustom('GetGWCongressMotionName')]\nÇağıran: [ROOT.GetCountry.GetCustom('GetGWCongressInitiatorName')]\nHedef: [ROOT.GetCountry.GetCustom('GetGWCongressTargetName')]\nGeçen Süre: [GetGlobalVariable('gw_congress_months_active').GetValue|0]/3 ay\nGerekli Destek: [ROOT.GetCountry.GetCustom('GetGWCongressThreshold')]\nOy Hakkına Sahip Heyetler: [GetGlobalVariable('gw_congress_eligible_total').GetValue|0]\n\n#header Destek: [GetGlobalVariable('gw_congress_support_total').GetValue|0] Prestij#!\n[ROOT.GetCountry.GetCustom('GetGWCongressSupportList')]\n\n#header Karşı: [GetGlobalVariable('gw_congress_oppose_total').GetValue|0] Prestij#!\n[ROOT.GetCountry.GetCustom('GetGWCongressOpposeList')]\n\n#header Çekimser: [GetGlobalVariable('gw_congress_abstain_total').GetValue|0] Prestij#!\n[ROOT.GetCountry.GetCustom('GetGWCongressAbstainList')]\n\nMevcut Sonuç: [JournalEntry.CalcCurrentGoalValue|0] / [JournalEntry.GetGoalAddValue|0] aktif prestij önergeyi desteklemektedir."

 gw_geneva.1.t:0 "Milletler Cemiyeti Kurulmuştur"
 gw_geneva.1.d:0 "Cenevre Sözleşmesine katılan ulusların sayısı arttıkça, Büyük Güçler barışı korumak, silahlanmayı azaltmak ve anlaşmazlıkları diplomasi yoluyla çözmek için ortak bir uluslararası örgüt kurmaya karar vermişlerdir. İlk Daimi Üyeleri [ROOT.GetCountry.GetCustom('GetGWLeaguePermanentMembers')] olmak üzere, Milletler Cemiyeti resmen ilan edilmiştir."
 gw_geneva.1.f:0 "Büyük Güçler, bu kurumun son Büyük Savaş'ı gerçekten de tüm savaşları sona erdiren savaş haline getireceğini ilan etmektedir."
 gw_geneva.1.a:0 "Ümit edelim ki öyle olur."
 gw_geneva.2.t:0 "Daimi Üyelik Onaylandı"
 gw_geneva.2.d:0 "Heyetimize Milletler Cemiyetindeki ilk Daimi Sandalyelerden biri verilmiştir. Bu mevki, bizi yeni diplomatik düzenin başlıca koruyucularından biri olarak tanımlamaktadır."
 gw_geneva.2.f:0 "Prestij artık anayasal bir biçim almıştır."
 gw_geneva.2.a:0 "Bu vazifeyi haysiyetle yerine getireceğiz."

 # --- Cenevre Sözleşmesi Olay Zinciri (gerginlik 40 / 50 / 60) ---
 gw_geneva.10.t:0 "Sanayi Savaşları Basında"
 gw_geneva.10.d:0 "Resimli haftalık dergiler, sömürge seferlerini resmî bildirilerin asla niyetlenmediği bir biçimde halkın gözü önüne sermiştir. Yakılmış köy fotoğrafları ve yaralı asker dizileri, misyoner cemiyetlerinin vaazları ve barış birliklerinin başyazılarıyla birleşerek, savaşın yürütülme tarzının hâlâ hükûmetlerin özel meselesi olarak kalıp kalamayacağını sormaktadır. Hekimler, din adamları ve reformcular tarafından imzalanan bir dilekçe, Büyük Güçleri bağlayıcı bir insani sözleşme müzakere etmeye çağırmaktadır."
 gw_geneva.10.f:0 "Diplomasi koridorlarının ertelemeyi umduğu bir mesele."
 gw_geneva.10.a:0 "Çağrıyı destekleyelim — adımızı insani reforma verelim."
 gw_geneva.10.b:0 "Reddedelim — yabancı duygusallığına politikamızda yer yoktur."

 gw_geneva.11.t:0 "Kızılhaç Dilekçesi"
 gw_geneva.11.d:0 "Kızılhaç sancağı altında toplanan uluslararası bir tıp cemiyetleri kongresi, Büyük Güçlere resmî olarak başvurmuş ve her birinin insani bir konferansa heyet ataması talebinde bulunmuştur. Davetçiler amatör değildir: görevdeki askerî cerrahları, eski subayları ve saygın hukukçuları içermektedir. Taleplerini antlaşma hukukunun soğuk diline döküp eğitimli basının önemli kısmının desteğini almışlardır."
 gw_geneva.11.f:0 "Bu dilekçeye susarak cevap verilemez."
 gw_geneva.11.a:0 "Heyet gönderelim — mesele ciddî değerlendirmeyi hak ediyor."
 gw_geneva.11.b:0 "Resmen reddedelim — askerî siyasetimizi yabancı bir komisyonun emrine vermeyiz."

 gw_geneva.12.t:0 "Vahşetler Açığa Çıktı"
 gw_geneva.12.d:0 "Son seferlerden gizlice çıkarılan, doğrulanmış ve üç dilde yayımlanan belgeler, önceki suskunluğumuza dair her türlü makul savunmayı ortadan kaldırmıştır. Yabancı meclislerin özel bir komisyonu kendi soruşturmasını başlatmıştır. Bir zamanlar diplomatik bir merak konusu olan insani konferans, şimdi Avrupa siyasetinin merkezindedir. Tutumumuz beklenmektedir."
 gw_geneva.12.f:0 "Mesele artık kapalı kapılar ardından çıkmış bulunuyor."
 gw_geneva.12.a:0 "Sözleşmenin öncüsü olalım — insani çerçeveye önderlik edelim."
 gw_geneva.12.b:0 "Askerlerimizi savunalım — ordumuz yabancı gazetelerde yargılanamaz."

