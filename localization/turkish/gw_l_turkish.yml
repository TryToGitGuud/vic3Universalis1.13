 gw_naval_estimates:1 "Donanma Tahsisatı Onaylandı"
 gw_naval_estimates_desc:0 "Meclis görülmemiş bir donanma programını oylayarak geçirdi. Tersaneler kurulmakta, siparişler verilmekte ve yabancı ateşeler omurga saymaya başlamıştır."
 gw_grand_manoeuvres:1 "Büyük Manevralar"
 gw_grand_manoeuvres_desc:0 "On binlerce ihtiyat sonbaharı çadır altında geçirmiştir. Genelkurmay verisini, yabancı gözlemciler kendi verilerini elde etmiştir."
 gw_industrial_expansion_orders:1 "Savunma Sanayii Genişlemesi"
 gw_industrial_expansion_orders_desc:0 "Silah, top ve mühimmat sanayileri boyunca uzun vadeli kontratlar verildi. Yeni tezgâhlar inşa halinde; mevcut hatlar çift vardiya çalışıyor."
 gw_conscription_reform:1 "Askerlik Reformu"
 gw_conscription_reform_desc:0 "Yeni kanun hizmet yükümlülüklerini uzatıyor ve insan kaynağı tabanını genişletiyor. İhtiyat kayıtları uzadı, Genelkurmay okulları doldu."
 gw_arms_race_followers:1 "Silahlanma Yarışı — Takipçiler"
 gw_arms_race_followers_desc:0 "Genelkurmayımız, blok liderinin programının gerisinde kalmaya razı olmayarak yığınağın bir kısmına sessizce uyum sağladı."
