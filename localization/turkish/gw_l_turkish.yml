 gw_leave_league_decision:0 "Milletler Cemiyetinden Çekil"
 gw_leave_league_decision_desc:0 "Devletimiz, Milletler Cemiyetinden ve onun yükümlülüklerinden çekilecektir. Bu, uluslararası itibarımıza zarar verecek ve taahhütlerimizi bozmaktan ötürü Kötü Nam getirecektir.\n\n#bold Tüm Cemiyet üyelik avantajlarını yitirecek ve uluslararası baskıyla karşılaşacağız.#!"
