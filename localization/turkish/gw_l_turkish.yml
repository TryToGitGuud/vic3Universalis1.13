 gw_declare_neutrality_decision:0 "Tarafsızlık İlan Et"
 gw_declare_neutrality_decision_desc:0 "Devletimiz, Büyük Güçler arasındaki mücadelede resmen tarafsızlığını ilan edecektir.\n\n#header Etkiler:#!\n- #bold İlan Edilmiş Tarafsızlık#! uygulanır\n- Kayıplardan doğan #V -%10#! savaş yorgunluğu\n- #V +%3#! nüfuz\n- #N -%10#! prestij\n- #N Diğer güçler tutumumuza şüpheyle bakacaktır#!\n- Tutum yeniden değiştirilmeden önce #N 1 yıl bekleme#!"
 gw_neutrality_tooltip:0 "Halihazırda tarafsız olmamalıyız.\nSon bir yıl içinde tutum değiştirmemiş olmalıyız.\nBüyük Güç olmalıyız.\nTarafsızlık diplomatik ve prestij maliyetleri taşır."
 gw_revoke_neutrality_decision:0 "Tarafsızlıktan Vazgeç"
 gw_revoke_neutrality_decision_desc:0 "Devletimiz tarafsız tutumunu bırakıp Büyük Güç siyaseti arenasına yeniden girecektir.\n\n#header Etkiler:#!\n- #bold İlan Edilmiş Tarafsızlık#! modifikatörü kalkar\n- [concept_gw_central_powers] veya [concept_gw_allied_powers] ile yeniden hizalanabiliriz\n- Tutum yeniden değiştirilmeden önce #N 1 yıl bekleme#!"
 gw_revoke_neutrality_tooltip:0 "Halihazırda tarafsız olmalıyız.\nSon bir yıl içinde tutum değiştirmemiş olmalıyız."
