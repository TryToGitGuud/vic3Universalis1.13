 gw_join_central_powers_decision:0 "İttifak Devletlerine Katıl"
 gw_join_central_powers_decision_desc:0 "Devletimiz mevcut uluslararası düzeni adaletsiz ilan edecektir. [concept_gw_central_powers] ile birlikte durup dünyayı yeniden biçimlendirmeye çalışacağız.\n\n#header Etkiler:#!\n- Aktifse İtilaf hizalanması kalkar\n- Tutum yeniden değiştirilmeden önce #N 1 yıl bekleme#!"
 gw_join_central_tooltip:0 "Halihazırda İttifak Devletlerine hizalanmamış olmalıyız.\nSon bir yıl içinde tutum değiştirmemiş olmalıyız."

 gw_join_allied_powers_decision:0 "İtilaf Devletlerine Katıl"
 gw_join_allied_powers_decision_desc:0 "Devletimiz mevcut uluslararası düzene bağlılığını ilan edecektir. İstikrarı korumak için [concept_gw_allied_powers] ile birlikte duracağız.\n\n#header Etkiler:#!\n- Aktifse İttifak hizalanması kalkar\n- Tutum yeniden değiştirilmeden önce #N 1 yıl bekleme#!"
 gw_join_allied_tooltip:0 "Halihazırda İtilaf Devletlerine hizalanmamış olmalıyız.\nSon bir yıl içinde tutum değiştirmemiş olmalıyız."

 gw_initiate_great_war_decision:0 "Büyük Savaşı Başlat"
 gw_initiate_great_war_decision_desc:0 "[concept_gw_central_powers] lideri olarak, dünya düzenine hâkimiyet için [concept_gw_allied_powers]'a meydan okuyacağız. Bu, dünyayı güç dengesini sonsuza dek değiştirecek yıkıcı bir çatışmaya sürükleyecektir.\n\n#bold Bu eylem geri alınamaz.#!"
 gw_tension_must_be_80:0 "Dünya Gerginliği en az %80 olmalı"
 gw_must_be_central_powers_leader:0 "İttifak Devletlerinin lideri olmak zorundayız"
 gw_must_be_allied_powers_leader:0 "İtilaf Devletlerinin lideri olmak zorundayız"
 gw_no_great_war_active:0 "Hâlihazırda devam eden bir Büyük Savaş yok"

 # --- Call to War (Scripted Button + Events) ---
 gw_call_to_war_button:0 "Savaşa Çağrı"
 gw_call_to_war_button_desc:0 "[concept_gw_allied_powers]'a karşı resmî bir Savaşa Çağrı yap.\n\n#header Gereklilikler:#!\n- Dünya Gerginliği en az #bold %90#! olmalı\n- #bold Çok Taraflı İttifaklar#! araştırılmış olmalı\n- Barış halinde olmalıyız\n- İtilaf lideri mevcut olmalı ve barışta kalmalı\n- Hâlihazırda bir Büyük Savaş veya etkin Savaşa Çağrı bulunmamalı\n\n#header Etkiler:#!\n- #bold 3 aylık seferberlik dönemi#! başlar\n- Önemli Güçler hizalanmalarını yeniden gözden geçirebilir\n- Dönem sonunda hâlâ geçerli bir karşı lider varsa, özel #bold Dünya Düzenini Yeniden Şekillendir#! diplomatik hamlesi başlar\n- Sıradan savaşlar ve manuel diplomatik hamleler Büyük Savaş zincirine #bold dahil değildir#!\n\n#bold Bu eylem geri alınamaz.#!"
 gw_call_to_war_possible_tt:0 "#bold Çok Taraflı İttifaklar#! teknolojisi gerekir.\nSavaşta olmamalıyız.\nİtilaf Devletleri lideri mevcut olmalı ve savaşta olmamalı."
 gw_call_to_war_tension_tt:0 "Dünya Gerginliği en az #bold %90#!"
 gw_call_to_war_tech_tt:0 "#bold Çok Taraflı İttifaklar#! araştırılmış"
 gw_call_to_war_not_at_war_tt:0 "Barış halindeyiz"
 gw_call_to_war_allied_exists_tt:0 "İtilaf lideri mevcut ve barışta"
 gw_call_to_war_no_war_active_tt:0 "Hâlihazırda devam eden bir Büyük Savaş yok"
 gw_call_to_war_no_call_active_tt:0 "Başka bir Savaşa Çağrı etkin değil"
 gw_call_to_war_effect_tt:0 "#bold 3 aylık seferberlik dönemi#! başlar.\nÖnemli Güçler hizalanmalarını yeniden gözden geçirebilir.\nDönem sonunda hâlâ geçerli bir karşı lider varsa, Büyük Savaş diplomatik hamlesi başlar."
 gw_call_mobilization_tt:0 "Seferberlik dönemi başladı. #bold 3 ay#! sonra karşı blokun hâlâ geçerli bir lideri varsa, özel Büyük Savaş diplomatik hamlesi başlayacaktır."
 gw_call_allied_prepare_tt:0 "Büyük Savaş diplomatik hamlesi başlamadan önce savunmalarınızı hazırlamak için #bold 3 ayınız#! var."
 gw_call_join_central_tt:0 "Dünya düzenini yeniden şekillendirmek için [concept_gw_central_powers] ile hizalanırız."
 gw_call_join_allied_tt:0 "Mevcut düzeni savunmak için [concept_gw_allied_powers] ile hizalanırız."
 gw_call_stay_neutral_tt:0 "Tarafsızlığımızı ilan ederiz ve hiçbir tarafa katılmayız, ancak diplomasimiz daralacaktır."
 gw_call_to_war_abort_tt:0 "Geçerli bir karşı blok lideri kalmadığından seferberlik dağılır."
 gw_call_keep_current_tt:0 "Mevcut tutumumuzu sürdürürüz."

 # Call to War Events
 gw_call.1.t:0 "Savaşa Çağrı"
 gw_call.1.d:0 "Savaşa Çağrı yapılmıştır. [concept_gw_central_powers], dünya düzenine hâkimiyet için [concept_gw_allied_powers]'a meydan okuyacaktır. Müttefiklerimize haber verilmektedir ve tarafsız uluslar şimdi yollarını belirlemelidir. Üç ay sonra diplomatik hamle başlayacak ve Büyük Savaş patlak verecektir."
 gw_call.1.f:0 "Zar atılmıştır."
 gw_call.1.a:0 "Orduları seferber edin!"

 gw_call.2.t:0 "İttifak Devletleri Savaşa Çağrı Yapıyor"
 gw_call.2.d:0 "[concept_gw_central_powers] bize karşı resmî bir Savaşa Çağrı yapmıştır. Üç ay sonra dünya düzenini yeniden şekillendirmek üzere bir diplomatik hamle başlatılacaktır. Bu süreyi savunmalarımızı hazırlamak ve müttefiklerimizi toplamak için kullanmalıyız."
 gw_call.2.f:0 "Fırtına yaklaşıyor."
 gw_call.2.a:0 "Milleti toplayın. Boyun eğmeyeceğiz."

 gw_call.3.t:0 "Büyük Güçler Seferber Oluyor"
 gw_call.3.d:0 "[concept_gw_central_powers], [concept_gw_allied_powers]'a karşı bir Savaşa Çağrı yapmıştır. Üç ay sonra Büyük Savaş başlayacaktır. Her Büyük Güç şimdi nerede duracağına karar vermelidir. Hizip hizalanması bekleme süremiz kaldırılmıştır — savaş başlamadan önce tarafımızı serbestçe seçebiliriz."
 gw_call.3.f:0 "Ulusların kaderi tartının üzerindedir."
 gw_call.3.a:0 "İttifak Devletleriyle yan yana duralım!"
 gw_call.3.b:0 "İtilaf Devletleriyle yan yana duralım!"
 gw_call.3.c:0 "Tarafsızlık ilan edelim."
 gw_call.3.e:0 "Mevcut hizalanmamızı koruyalım."

 gw_call.10.t:0 "Büyük Savaş Başlıyor"
 gw_call.10.d:0 "Seferberlik dönemi sona ermiştir. Savaşa Çağrı'nın yapılmasından bu yana üç ay geçti ve dünya taraflarını seçti. Resmî diplomasi başarısız olmuştur; [concept_gw_central_powers] şimdi [concept_gw_allied_powers]'a karşı özel #bold Dünya Düzenini Yeniden Şekillendir#! diplomatik hamlesini açıyor. Büyük Savaş başlamıştır."
 gw_call.10.f:0 "Tanrı hepimize yardım etsin."
 gw_call.10.a:0 "Yeni düzen için!"
 gw_call.10.b:0 "Karşı blok dağılmıştır."

 # --- Diplomatic Play ---
 gw_dp_reshape_order:0 "Dünya Düzenini Yeniden Şekillendir"
 gw_dp_reshape_order_desc:0 "[concept_gw_central_powers], uluslararası düzene hâkimiyet için [concept_gw_allied_powers]'a meydan okur. Bu, Büyük Savaş'tır — ulusların kaderini belirleyecek bir çatışma."
 gw_wg_reshape_world_order:0 "Dünya Düzenini Yeniden Şekillendir"
 gw_wg_reshape_world_order_desc:0 "Karşı hizip liderinin uluslararası düzene hükmetme kabiliyetini kırmayı amaçlayan bir Büyük Savaş hedefi. Hedef liderin başkenti işgal edilerek çekişilir; nihai uzlaşma Büyük Savaş sonuç olaylarınca belirlenir."
 war_goal_gw_wg_reshape_world_order_type_name:0 "Dünya Düzenini Yeniden Şekillendir"
 war_goal_gw_wg_reshape_world_order_type_desc:0 "Karşı hizip liderinin uluslararası düzene hükmetme kabiliyetini kırmayı amaçlayan bir Büyük Savaş hedefi."
 war_goal_gw_wg_reshape_world_order:0 "Dünya Düzenini Yeniden Şekillendir"
 war_goal_gw_wg_reshape_world_order_desc:0 "Karşı blok liderinin uluslararası düzene hükmetme kabiliyetini kır. Nihai uzlaşma Büyük Savaş sonuç olaylarınca ele alınır."

 # ============================================================
 # GREAT POWER CONFERENCE EVENTS
 # ============================================================

 gw_conference.1.t:0 "Bir Büyük Güç Konferansı"
 gw_conference.1.d:0 "Gerginlikler yükselirken ve Büyük Güçler hâlâ resmen barışta iken, diplomatlar genel bir konferans için ısrar etmeye başlamıştır. Dikkatle yönetilen bir uzlaşma güç dengesini yeniden tasdik edebilir, basını yatıştırabilir ve diplomasi koridorlarına çatışmadan geri çekilme alanı verebilir."
 gw_conference.1.f:0 "Eski düzen, ancak koruyucuları masaya oturmaya razı olduğu sürece ayakta kalır."
 gw_conference.1.a:0 "Konferansı toplayın."
 gw_conference.1.b:0 "Durum bir konferans gerektirmiyor."
 gw_conference.2.t:0 "Büyük Güçler Müzakerede"
 gw_conference.2.d:0 "Önde gelen güçler son diplomatik krizi kontrol altına almak için bir araya gelmiştir. Kalıcı bir uzlaşma garanti değildir, fakat görüşme sinirleri yatıştırmış ve her kabineye savaşın bir kaçınılmazlık değil, bir tercih olduğunu hatırlatmıştır."
 gw_conference.2.f:0 "Bir an için, protokolün dili seferberliğin dilini geride bırakmıştır."
 gw_conference.2.a:0 "Barışa bir şans daha tanındı."
 gw_conference_convene_tt:0 "#header Etkiler:#!\n- #V Dünya Gerginliği 6 azalır#!\n- #N 5 yıl boyunca#! tekrar bir Büyük Güç Konferansı çağrılamaz"
 gw_conference_decline_tt:0 "#header Etkiler:#!\n- #N 3 yıl boyunca#! tekrar bir Büyük Güç Konferansı önerilemez"

 # ============================================================
 # CRISIS EVENTS
 # ============================================================

 # Phase 1: Arms Race (60%)
 gw_crisis.1001.t:0 "Genelkurmay Muhtırası"
 gw_crisis.1001.d:0 "En son rakamlar mühürlü dosyalarda ulaşıyor: yeni toplar, yeni gemiler, yeni seferberlik cetvelleri. Bütün başkentlerde aynı sessiz hesap yapılmaktadır. Şimdi yavaşlamak ihtiyatlı olabilir; geride kalmak ölümcül."
 gw_crisis.1001.f:0 "Bir bütçe, ilk siparişler kesilene kadar yalnızca mürekkeptir."
 gw_crisis.1001.a:0 "Genelkurmay programını onaylayın."
 gw_crisis.1001.b:0 "Bütçeler sancağa dönüşmeden sınırları yoklayın."
 gw_crisis_1001_a_tt:0 "#header Etkiler:#!\n- #V 24 ay boyunca#! #bold Silahlanma Yarışı#! kazanır\n- #V 18 ay boyunca#! #bold Genelkurmay Programı#! kazanır\n- #V 6 ay#! içinde bir takip silahlanma yarışı olayı tetiklenebilir"
 gw_crisis_1001_b_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Silahlanma Sınırlaması Görüşmeleri#! kazanır\n- #V Dünya Gerginliği 1 azalır#!"

 gw_crisis.1002.t:0 "Kırmızı Mürekkeple Revize Edilmiş Cetveller"
 gw_crisis.1002.d:0 "İlk tahsisat kışlalarda, dökümhanelerde ve tersanelerde çoktan eridi. Generaller şimdi revize edilmiş tahminlerle dönüyor; her sayfa acil damgalı, her kenar boşluğu rakip tümenlerin adlarıyla dolu."
 gw_crisis.1002.f:0 "Bir silahlanma yarışında nihai tahmin diye bir şey yoktur."
 gw_crisis.1002.a:0 "Revize takvimi kabul edin."
 gw_crisis.1002.b:0 "Bırakın diplomatlar sarmalı sınırlamaya çalışsın."
 gw_crisis_1002_a_tt:0 "#header Etkiler:#!\n- #V 18 ay boyunca#! #bold Genelkurmay Programı#! kazanır"
 gw_crisis_1002_b_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Silahlanma Sınırlaması Görüşmeleri#! kazanır\n- #V Dünya Gerginliği 1 azalır#!"

 gw_crisis.1003.t:0 "Hazırlığın Bulaşıcılığı"
 gw_crisis.1003.d:0 "Masamıza herhangi bir ültimatom düşmedi, oysa her başkent aynı gazeteleri okuyor. Demiryolu tarifeleri yeni bir ciddiyetle inceleniyor, ihtiyat subayları sessizce göreve çağrılıyor ve yatırımcılar barışın kendisinin bir spekülasyona dönüşüp dönüşmediğini soruyor."
 gw_crisis.1003.f:0 "Savaş ilan edilmedi, ama sabah gazetelerinde çoktan fiyatlandırılmıştır."
 gw_crisis.1003.a:0 "Ülkeyi sakin ve hazır tutun."
 gw_crisis.1003.b:0 "Sesimizi ölçülülüğe verelim."
 gw_crisis_1003_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Halkın Savaş Endişesi#! kazanır"
 gw_crisis_1003_b_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Silahlanma Sınırlaması Görüşmeleri#! kazanır"

 # --- Arms Race Atmosphere Chain (bloc leader, embrace path) ---
 gw_crisis.1100.t:0 "Donanma Tahsisat Yasası"
 gw_crisis.1100.d:0 "Bahriye, meclisin önüne barış zamanı tarihindeki en büyük inşa programını sunmuştur. Muharebe filoları, hızlı kruvazörler, denizaltı filotillaları — cetvelin her satırı rakip blokun kızağa çektiği gemilerle gerekçelendirilmiştir. Yabancı ateşeler şifre defterleri açık olarak oylamayı beklemektedir."
 gw_crisis.1100.f:0 "Bir başkentte kızağa çekilen gemi, bir başkasında cevaplandırılan gemidir."
 gw_crisis.1100.a:0 "Tahsisatı tam olarak geçirin."
 gw_crisis.1100.b:0 "En büyük kalemi gelecek oturuma ertelet."

 gw_crisis.1101.t:0 "Büyük Manevralar"
 gw_crisis.1101.d:0 "On binlerce ihtiyat, Genelkurmay'ın kuruluşundan bu yana görülmemiş ölçekte bir sonbahar tatbikatı için silah altına alınacaktır. Basına talimat verilmiş, demiryolu müdürleri uyarılmış, yabancı gözlemciler davet edilmiştir — ne rapor edecekleri konusunda hiçbir şüphe kalmasın diye."
 gw_crisis.1101.f:0 "Ciddiyetle prova edilmiş barış zamanı tatbikatı."
 gw_crisis.1101.a:0 "Manevraları tam kuvvetle düzenleyin."
 gw_crisis.1101.b:0 "Rutin garnizon tatbikatlarıyla yetinin."

 gw_crisis.1102.t:0 "Savunma Sanayii Kontratları"
 gw_crisis.1102.d:0 "Silah, top ve mühimmat firmaları uzun vadeli kontratlar için ortak dilekçeler vermiştir. Harbiye Nezareti bu kontratları vermeyi — ve yeni bir tur fabrika inşaatını güvence altına almayı — önermektedir. Hissedarlar sessizce memnundur; barış cemiyetleri ise değildir."
 gw_crisis.1102.f:0 "Bir kez çift vardiyaya geçtiğinde, tezgâhlar kolay kolay geri dönmez."
 gw_crisis.1102.a:0 "Kontratları verin ve yeni tesislerin temelini atın."
 gw_crisis.1102.b:0 "Mevcut kapasite yeterli olacaktır."

 gw_crisis.1103.t:0 "Askerlik Reformu"
 gw_crisis.1103.d:0 "Genelkurmay yeni bir askerlik yasası tasarısı sunmuştur: daha uzun hizmet, kaldırılan geniş muafiyetler, yarım milyon kişi uzatılmış ihtiyat kayıtları. Tasarıyı destekleyenler bunu ihtiyatlı bir reform tedbiri olarak tarif ediyor; karşı çıkanlar ise bir sonraki savaşı kesinleştiren yasa olarak."
 gw_crisis.1103.f:0 "Henüz ilan edilmemiş bir savaş için yazılmış bir kanun."
 gw_crisis.1103.a:0 "Yasayı tam haliyle geçirin."
 gw_crisis.1103.b:0 "Mevcut hizmet sürelerini koruyun."

 # --- Arms Race Echo Events (non-leader Major Powers) ---
 gw_crisis.1110.t:0 "Donanma Tahsisatlarının Yankısı"
 gw_crisis.1110.d:0 "Rakip blokun yeni donanma programı bizim bahriye dairelerimizde de dikkatle okunmuştur. Tersanelerimiz onlarınkiyle ölçekçe kıyaslanamaz, fakat dock işçisi olmayan bir ülke değiliz ve elçilerimiz sermayenin bizi aramaya başladığını haber vermektedir."
 gw_crisis.1110.f:0 "Yurt dışında geçen bir tedbir, yurt içinde tartılmadan yola devam edemez."
 gw_crisis.1110.a:0 "Programın bir kısmını sessizce taklit edelim."
 gw_crisis.1110.b:0 "Yabancı basında resmî bir protesto yayımlayın."
 gw_crisis.1110.c:0 "Haberi kaydedin; aleni bir tutum almayın."

 gw_crisis.1111.t:0 "Büyük Manevraların Yankısı"
 gw_crisis.1111.d:0 "Gözlemcilerimiz yabancı manevralardan kalın dosyalarla dönmüştür. Genelkurmay, benzer tatbikatlarımızı düzenlemek için izin — ve ek bütçe — talep etmektedir. Kabine, kenarda durmanın bedeliyle yarışa katılmanın bedelini tartmaktadır."
 gw_crisis.1111.f:0 "Talim etmeyen ordu, savaşmayan ordu sayılır."
 gw_crisis.1111.a:0 "Kendi sonbahar tatbikatlarımıza izin verin."
 gw_crisis.1111.b:0 "Yabancı gösteriyi tahrik olarak kınayın."
 gw_crisis.1111.c:0 "Gözlemci gönderin; başka bir taahhütte bulunmayın."

 gw_crisis.1112.t:0 "Sanayi Kontratlarının Yankısı"
 gw_crisis.1112.d:0 "Yabancı ihaleler zırh levhası, dumansız barut ve sahra topu pazarını yeniden şekillendirmiştir. Bizim firmalarımız da muhtıralar sunmuştur; bazılarının yabancı sermayeyle iş birliği yaptığı söylenmektedir. Harbiye Nezareti'nden yönlendirme istenmiştir."
 gw_crisis.1112.f:0 "Sanayi diplomasi koridorlarını beklemez."
 gw_crisis.1112.a:0 "Eşdeğer kontratları kendi firmalarımıza verin."
 gw_crisis.1112.b:0 "Yığınağa resmî bir protesto yayımlayın."
 gw_crisis.1112.c:0 "Bırakın firmalar istedikleri gibi pazarlık etsin; devlet bu işin tarafı değildir."

 gw_crisis.1113.t:0 "Askerlik Reformunun Yankısı"
 gw_crisis.1113.d:0 "Yabancı askerlik yasası, bizim harp okullarımızda sessiz bir şok yaratmıştır. Emsalden çıkarılacak ders açıktır: rakip blok hizmet süresini uzattıysa, bizim ihtiyat kayıtlarımız da gözden geçirilmelidir. Kabine meseleyi bir sonraki oturumun gündemine almıştır."
 gw_crisis.1113.f:0 "Yurt dışındaki bir emsal, yurt içinde bir vazife haline gelir."
 gw_crisis.1113.a:0 "Kendi askerlik yasamızı genişletecek şekilde revize edin."
 gw_crisis.1113.b:0 "Yabancı tedbiri militarizm olarak kınayın."
 gw_crisis.1113.c:0 "Durum netleşene kadar meseleyi erteleyin."

 # Phase 2: Ultimatum (70%)
 gw_crisis.2001.t:0 "Alacakaranlıkta Teslim Edilen Nota"
 gw_crisis.2001.d:0 "Bir sefir lambaların altında beklerken kâtipler son kopyaları çıkarmaktadır. Sözcükler tartılmış, keskinleştirilmiş ve hem onur hem felaket için yeterince muğlak hale getirilmiştir. Sabaha kadar her dost başkent bunun diplomasi mi yoksa savaşın ilk hareketi mi olduğunu soracaktır."
 gw_crisis.2001.f:0 "Mühür kırılmamıştı, fakat tehdit çoktan anlaşılmıştı."
 gw_crisis.2001.a:0 "Notayı değişiklik yapmadan gönderin."
 gw_crisis.2001.b:0 "Nota sertleşmeden önce gizli bir kanal açın."
 gw_crisis.2001.c:0 "Notayı seferberlik emirleriyle birlikte gönderin."
 gw_crisis_2001_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Diplomatik Kriz#! kazanır\n- Karşı blok liderine bir ültimatom kaydedilir"
 gw_crisis_2001_b_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Gizli Diplomasi#! kazanır\n- #V Dünya Gerginliği 2 azalır#!"
 gw_crisis_2001_c_tt:0 "#header Etkiler:#!\n- #V 18 ay boyunca#! #bold Kısmî Seferberlik Planı#! kazanır\n- #V 12 ay boyunca#! #bold Diplomatik Kriz#! kazanır\n- Karşı blok liderine bir ültimatom kaydedilir"

 gw_crisis.2002.t:0 "Kabine Masasındaki Cevap"
 gw_crisis.2002.d:0 "Ültimatom masada açık duruyor. Maddeleri egemenliği yaralayacak kadar ağır, fakat reddetmek tahrik diye anılabilecek kadar muğlaktır. Odanın içinde nazırlar alçak sesle konuşuyor; dışarıda şehir, tarihin binaya girdiğini çoktan biliyor."
 gw_crisis.2002.f:0 "Bazı cevaplar muhatabı için yazılır. Bazıları tarih için."
 gw_crisis.2002.a:0 "Ültimatomu bütünüyle reddedin."
 gw_crisis.2002.b:0 "Yalnızca hayatta kalınabilecek olanı kabul edin."
 gw_crisis_2002_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Kısmî Seferberlik Planı#! kazanır\n- Bekleyen ültimatom temizlenir"
 gw_crisis_2002_b_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Gizli Diplomasi#! kazanır\n- Bekleyen ültimatom temizlenir\n- #V Dünya Gerginliği 1 azalır#!"

 gw_crisis.2003.t:0 "Tedirgin Bir Kıtadan Telgraflar"
 gw_crisis.2003.d:0 "Kriz bizim değil, henüz değil. Yine de her telgraf servisi geri çağrılan elçilerin ve nöbete alınmış istasyonların söylentilerini taşıyor. Tüccarlar kontratları erteliyor, gazeteler netlik istiyor ve kabine, bir milletin daha ne kadar yalnızca 'endişeli' kalabileceğini soruyor."
 gw_crisis.2003.f:0 "Tarafsızlık, ilk telgraf gelmeden önce en kolaydır."
 gw_crisis.2003.a:0 "Halkı belirsizliğe hazırlayın."
 gw_crisis.2003.b:0 "Sessiz kanalları işletin."
 gw_crisis_2003_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Halkın Savaş Endişesi#! kazanır"
 gw_crisis_2003_b_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Gizli Diplomasi#! kazanır"

 # Phase 3: Crisis Peak (80%)
 gw_crisis.3001.t:0 "Savaştan Önceki Son Şûra"
 gw_crisis.3001.d:0 "Haritalar çoktan iğnelendi. Muhtıralar çoktan demiryolu uçlarını, depoları ve tarihleri öngörüyor. Yalnızca son emir yazılmadan duruyor ve odadaki herkes biliyor ki ertelemek, eyleme geçmek kadar felaket sayılabilir."
 gw_crisis.3001.f:0 "Gecenin bir saatinde, hazırlık karara dönüşür."
 gw_crisis.3001.a:0 "Savaşa Çağrı'yı yapın."
 gw_crisis.3001.g:0 "Emri son mümkün saate kadar elinizde tutun."
 gw_crisis.3001.e:0 "Son bir ölçülülük sinyali gönderin."
 gw_crisis_3001_a_tt:0 "#header Etkiler:#!\n- #bold Savaşa Çağrı#! seferberlik dönemi başlar\n- #V 3 ay#! sonra hâlâ geçerli bir karşı lider varsa, Büyük Savaş diplomatik hamlesi başlar"
 gw_crisis_bide_time_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Kısmî Seferberlik Planı#! kazanır\n- #bold Savaşa Çağrı#! butonu Dünya Durumu günlük girdisinde kullanılabilir kalır"
 gw_crisis_not_yet_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Gizli Diplomasi#! kazanır\n- #V Dünya Gerginliği 5 azalır#!\n- #N 1 yıl boyunca#! nihai kriz olayı tekrar tetiklenmez"

 gw_crisis.3002.t:0 "Savunma Protokolleri"
 gw_crisis.3002.d:0 "Diğer bloktan gelen raporlar iyimserliğe pek yer bırakmamaktadır. Kabinenin önündeki mesele artık düzenin yalnızca nutuklarla korunup korunamayacağı değil, savunma çarkının kendisi kıvılcım haline gelmeden hazır kılınıp kılınamayacağıdır."
 gw_crisis.3002.f:0 "En iyi savunma, gerek duyulduğu saate kadar sessiz olandır."
 gw_crisis.3002.a:0 "Sınır planlarını düzene koyun."
 gw_crisis.3002.b:0 "Sefarethaneleri konuşturmaya devam edin."
 gw_crisis_3002_a_tt:0 "#header Etkiler:#!\n- #V 18 ay boyunca#! #bold Savunma Hazırlığı#! kazanır"
 gw_crisis_3002_b_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Gizli Diplomasi#! kazanır\n- #V Dünya Gerginliği 2 azalır#!"

 gw_crisis.3003.t:0 "Avrupa'nın Bekleme Odaları"
 gw_crisis.3003.d:0 "Büyük bloklar uçurumun kenarında durmaktadır ve daha küçük odalar aynı sorularla doluyor: hangi sınır ilk kapanacak, hangi müttefik çağıracak, hangi pazar çökecek, hangi nutuk barış zamanında verilen son nutuk olarak hatırlanacak?"
 gw_crisis.3003.f:0 "Büyük bir savaştan önceki küçük saatler her başkente aittir."
 gw_crisis.3003.a:0 "Halkı sakin tutun."
 gw_crisis.3003.b:0 "Nezaretleri darbeye hazırlayın."
 gw_crisis_3003_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Halkın Savaş Endişesi#! kazanır"
 gw_crisis_3003_b_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Savunma Hazırlığı#! kazanır"

