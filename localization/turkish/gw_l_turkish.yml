 # --- Game Concept ---
 concept_gw_league_congress:0 "Cemiyet Kongresi"
 concept_gw_league_congress_desc:0 "Cemiyet Kongresi, önde gelen üye güçlerin meclis önündeki bir önerge için oylarını kaydettiği Milletler Cemiyetinin resmî bir oturumudur. Oylar tamamen prestije göre ağırlıklandırılır ve oturum 3 ay açık kalır. Büyük Güçler ve Önemli Güçler her 2 yılda bir Kongre toplayabilir.\n\nMevcut önergeler:\n- #bold Kınama#! (%60): prestij ve nüfuz cezaları, daha yavaş Kötü Nam azalması ve #N +5#! Kötü Nam\n- #bold Ambargo#! (%70): ticaret, prestij ve nüfuz cezaları\n- #bold Üyeyi İhraç Et#! (%70): hedef 10 yıl boyunca ihraç edilir\n\nReddedilen önergeler geri teper ve hedefe #V prestij#! kazandırır."

 # ============================================================
 # GAME CONCEPTS
 # ============================================================

 concept_gw_world_tension:0 "Dünya Gerginliği"
 concept_gw_world_tension_desc:0 "Dünya Gerginliği, uluslararası istikrarsızlığın küresel düzeyini temsil eder (%0-100). Yükseldikçe Büyük Güçler diplomatik avantajlar kazanır, fakat felaket bir Büyük Savaş riski de artar. %60'ta bir Silahlanma Yarışı başlar, %70'te ültimatomlar verilir ve %80'de İttifak Devletleri lideri Büyük Savaş'ı başlatabilir.\n\nGerginlik; Büyük Güç çatışmalarından, Kötü Nam'dan, askerî yığınaktan ve sömürge rekabetinden yükselir. Barış zamanında azalır ve Milletler Cemiyeti tarafından daha da düşürülür. 1880 öncesi daha sıkı kaynak sınırları ve Concert dönemi kısıtlaması çok yüksek gerginliğin sürdürülmesini zorlaştırır; doğrudan savaş başlatma şokları da yıllık sınırlandırılmıştır. Büyük Savaş sırasında gerginlik azalmaz."

 concept_gw_league_of_nations:0 "Milletler Cemiyeti"
 concept_gw_league_of_nations_desc:0 "Milletler Cemiyeti, Cenevre Sözleşmesi Büyük Güçler arasında geniş kabul gördükten sonra kurulan uluslararası bir kurumdur. Barışı korumayı amaçlar ve barış zamanı dünya gerginliğini azaltır.\n\nÜyeler mütevazi ticaret, prestij ve diplomatik avantajlar kazanır. Dört Daimi Üye daha büyük yetki ve ek diplomatik nüfuza sahiptir. Daimi üyelik her Büyük Savaş'tan sonra yeni güç dengesini yansıtacak şekilde döner. Üye olmayanlar uluslararası yalıtımdan kaynaklanan hafif cezalara katlanır.\n\nYeterli prestijdeki Cemiyet üyeleri, milletleri kınamak, ambargo uygulamak veya ihraç etmek için bir Kongre toplayabilir."

 concept_gw_geneva_convention:0 "Cenevre Sözleşmesi"
 concept_gw_geneva_convention_desc:0 "Cenevre Sözleşmesi, sivillerin ve savaş mağdurlarının korunmasına dair uluslararası bir anlaşmadır. Katılan milletler Sosyal Teknoloji Yayılımı kazanır, fakat daha fazla Kötü Nam üretir ve daha az Diplomatik Hamle Manevrası alır."

 concept_gw_central_powers:0 "İttifak Devletleri"
 concept_gw_central_powers_desc:0 "İttifak Devletleri revizyonist bloku temsil eder — mevcut uluslararası düzeni yeniden şekillendirmek isteyen, ondan hoşnutsuz Büyük Güçlerdir. En yüksek sırada hoşnutsuz Büyük Güç tarafından yönetilirler ve dünya gerginliği kritik düzeye ulaştığında İtilaf Devletlerine meydan okuyacaklardır. Büyük Güçler her iki blokun dışında kalmak için tarafsızlığı da seçebilir."

 concept_gw_allied_powers:0 "İtilaf Devletleri"
 concept_gw_allied_powers_desc:0 "İtilaf Devletleri statüko blokunu temsil eder — mevcut uluslararası düzeni korumaya bağlı Büyük Güçlerdir. En yüksek sırada hoşnut Büyük Güç tarafından yönetilirler ve mevcut düzeni İttifak Devletlerine karşı savunacaklardır. Büyük Güçler her iki blokun dışında kalmak için tarafsızlığı da seçebilir."

 concept_gw_great_war:0 "Büyük Savaş"
 concept_gw_great_war_desc:0 "Büyük Savaş, dünya gerginliği kritik düzeye ulaştığında tetiklenen, rakip Büyük Güç blokları arasındaki genel bir çatışmadır. Kesin bir uzlaşmayla veya tükenmiş bir barışla sona erebilir ve sonucu uluslararası düzeni yeniden şekillendirir.\n\nSavaş sırasında ulusal hoşnutsuzluk; kayıplar, radikalleşme ve cephe gerisindeki yorgunluktan yükselir. %80 hoşnutsuzlukta iç çatlaklar belirir; %100'de isyan veya çöküş izleyebilir. Savaş bittikten sonra gerginlik azalır ve diplomatik düzen yeniden tertip edilir."

 concept_gw_war_reparations:0 "Savaş Tazminatı"
 concept_gw_war_reparations_desc:0 "Büyük Savaş sonrasında galipleri kayıpları için tazmin etmek üzere yenilen milletlere uygulanan ödemeler. Tazminat 10 yıl sürer.\n\nYenilen Büyük Güçler -%20 prestij, -10B vergi kapasitesi, -%15 nüfuz ve +%25 seferberlik maliyeti ile karşılaşır. Muzaffer Büyük Güçler +%10 prestij, +5B vergi kapasitesi ve +%10 nüfuz alır. Başlıca yenilen güç ayrıca ek cezalara katlanır ve 'Arkadan Bıçaklanma' efsanesini tetikleyebilir."

 concept_gw_crisis:0 "Uluslararası Kriz"
 concept_gw_crisis_desc:0 "Büyük Güçler arasında ültimatomlar, seferberlikler ve yaklaşan savaş riskiyle karakterize edilen, aşırı diplomatik gerginlik dönemi. Krizler ya diplomatik yoldan çözülebilir ya da Büyük Savaş'a tırmanabilir."

 concept_gw_arms_race:0 "Silahlanma Yarışı"
 concept_gw_arms_race_desc:0 "Rakip Büyük Güçler arasında rekabetçi bir askerî yığınak. Her taraf ordusunu ve donanmasını diğerini eşitlemek veya geçmek için genişletir ve dünya gerginliğini giderek yükseltir."

 concept_gw_call_to_war:0 "Savaşa Çağrı"
 concept_gw_call_to_war_desc:0 "[concept_gw_world_tension] %80'e ulaştığında ve [concept_gw_central_powers] lideri Çok Taraflı İttifaklar teknolojisini araştırdığında, lider Savaşa Çağrı yapabilir. Bu, tüm Büyük Güçlerin [concept_gw_central_powers], [concept_gw_allied_powers] veya tarafsızlık yanında olduklarını ilan etmesi gereken 90 günlük bir seferberlik penceresi açar. Pencere kapandığında, [concept_gw_great_war]'ı başlatan diplomatik hamle otomatik olarak oluşturulur."

 concept_gw_alignment_score:0 "Hizalanma Skoru"
 concept_gw_alignment_score_desc:0 "Her Büyük Güçün — İttifak, İtilaf ve Tarafsız olmak üzere — düzen hoşnutluğu, treaty bağları, ideoloji, lobiler ve tarihî çapalardan türetilen üç hizalanma ağırlığı vardır. Yapay zekâ hizalanma değiştirmeden önce bu ağırlıkları ve bir marj eşiğini karşılaştırır; yıllık bekleme süresi ani savrulmaları önler. Oyuncular hizalanma butonları aracılığıyla yapay zekâ seçimini geçersiz kılabilir."

 concept_gw_dissatisfied_with_order:0 "Düzenden Hoşnutsuz"
 concept_gw_dissatisfied_with_order_desc:0 "Yumuşak bir diplomatik tutum: ülke genel olarak mevcut uluslararası düzene içerlemektedir ve açık bir hizalanma yokken [concept_gw_central_powers] sempatizanı olarak muamele görür. Hizalanma ağırlıkları İttifak tarafına eğildiğinde otomatik olarak atanır."

 concept_gw_satisfied_with_order:0 "Düzenden Hoşnut"
 concept_gw_satisfied_with_order_desc:0 "Yumuşak bir diplomatik tutum: ülke genel olarak mevcut uluslararası düzeni destekler ve açık bir hizalanma yokken [concept_gw_allied_powers] sempatizanı olarak muamele görür. Hizalanma ağırlıkları İtilaf tarafına eğildiğinde otomatik olarak atanır."

 concept_gw_congress_motion:0 "Kongre Önergesi"
 concept_gw_congress_motion_desc:0 "Bir Büyük veya Önemli Güç tarafından [concept_gw_league_of_nations] önüne konulan resmî bir öneri: #bold Kınama#! (25+ Kötü Nam gerekir), #bold Ambargo#! (50+ Kötü Nam gerekir) veya bir üyenin #bold İhracı#! (75+ Kötü Nam gerekir). Her önerge üç ay sürer; bu süreçte Cemiyet üyeleri destek, karşı veya çekimser oy verir. Sonuçtaki yaptırımın şiddeti destek payına göre ölçeklenir."

 concept_gw_congress_vote_threshold:0 "Kongre Oylama Eşiği"
 concept_gw_congress_vote_threshold_desc:0 "Oylar devlet başına bir değil, prestije göre ağırlıklandırılır. Kınama önergesi #V %60#! destekle geçer; Ambargo ve İhraç önergeleri #V %70#! gerektirir. Çekimserler her iki toplamdan da dışlanır. Önerge geçmezse, çağıran taraf bir prestij geri tepmesini soğurur."

 concept_gw_league_permanent_member:0 "Daimi Üye"
 concept_gw_league_permanent_member_desc:0 "Herhangi bir anda en yüksek prestije sahip dört Cemiyet üyesi Daimi Üye modifikatörünü taşır; bu ek nüfuz ve prestij sağlar. Daimi koltuklar prestij sıralamaları değiştikçe ve her Büyük Savaş'tan sonra döner."

 concept_gw_league_non_member_pressure:0 "Üye Olmayan Baskısı"
 concept_gw_league_non_member_pressure_desc:0 "Cemiyet üyeliğini reddetmiş veya yitirmiş tanınmış devletler, diplomatik şüphe altında faaliyet gösterir: azaltılmış nüfuz ve küçük bir Kötü Nam üretimi cezası. Ülke Cemiyete yeniden katıldığında baskı kalkar."

 concept_gw_war_reparations_paying:0 "Tazminat Ödüyor"
 concept_gw_war_reparations_paying_desc:0 "Yenilen Büyük Güçler [concept_gw_great_war]'dan sonra on yıl boyunca tazminat öder. Yük en ağır biçimde başlıca yenilen güç tarafından hissedilir; bu gücün arkadan bıçaklanma anlatıları savaş sonrası düzeni sarsabilir."

 concept_gw_major_defeat:0 "Büyük Yenilgi"
 concept_gw_major_defeat_desc:0 "[concept_gw_great_war] sırasında teslim olan bir Büyük Güç'e uygulanır. Nüfuz kaybı on yıl sürer ve yenilen gücün yeni uluslararası düzendeki stratejik gölgede kalışını gösterir."

