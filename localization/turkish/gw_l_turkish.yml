 je_gw_world_tension:0 "Dünya Durumu"
 je_gw_world_tension_desc:0 "Uluslararası istikrarsızlığın küresel düzeyi. Gerginlik yükseldikçe, yıkıcı bir Büyük Savaş riski artar."
 je_gw_world_tension_reason:0 "#header Dünya Gerginliği: %[JournalEntry.CalcCurrentGoalValue|0]#!\n\n#header [concept_gw_allied_powers] — Üye Sayısı: #v [GetGlobalVariable('gw_allied_members_count').GetValue|0]#!  @battalions! #v [GetGlobalVariable('gw_allied_army_total').GetValue|0]#!  @ships! #v [GetGlobalVariable('gw_allied_navy_total').GetValue|0]#!:#!\n[ROOT.GetCountry.GetCustom('GetGWAlliedList')]\n\n#header [concept_gw_central_powers] — Üye Sayısı: #v [GetGlobalVariable('gw_central_members_count').GetValue|0]#!  @battalions! #v [GetGlobalVariable('gw_central_army_total').GetValue|0]#!  @ships! #v [GetGlobalVariable('gw_central_navy_total').GetValue|0]#!:#!\n[ROOT.GetCountry.GetCustom('GetGWCentralList')]\n\n#header Tarafsız Güçler — Üye Sayısı: #v [GetGlobalVariable('gw_neutral_members_count').GetValue|0]#!:#!\n[ROOT.GetCountry.GetCustom('GetGWNeutralList')]\n\n#header Geçen Yılki Gerginlik Dökümü:#!\n[ROOT.GetCountry.GetCustom('GetGWDecayTier')]\n[ROOT.GetCountry.GetCustom('GetGWMilitaryTier')]\n[ROOT.GetCountry.GetCustom('GetGWPoliticalTier')]\n[ROOT.GetCountry.GetCustom('GetGWConflictsTier')]\n\n#header Gerginlik Kademesi Modifikatörleri:#!\n#V %20'nin altında#!: [concept_gw_peace_dividend]\n#N %40'ta#!: [concept_gw_growing_tensions]\n#N %60'ta#!: [concept_gw_tier_arms_race]\n#N %70'te#!: [concept_gw_tier_ultimatum]\n#N %80'de#!: [concept_gw_tier_crisis]\n\n#header Gerginlik Kaynakları:#!\n- Önemli veya Büyük Güçlerin dahil olduğu savaşlar (#N +2#! / #N +3#! / Büyük Güç ile Büyük Güç arasında #N +5#!)\n- Doğrudan savaş başlatma gerginliği yıllık sınırlandırılmıştır (1880 öncesi #N +8#!, 1880'den itibaren #N +12#!)\n- Büyük Güç fethi/ilhakı (#N +3#!)\n- Büyük/Önemli Güç himaye hamleleri (#N +2#! / #N +1#!)\n- Büyük Güç Kötü Nam birikimi (25 ve 50'de #N +1#!)\n- Önemli Güç Kötü Nam birikimi (50 ve 100'de #N +1#!)\n- Sömürgeleştirilebilir toprak kalmaması (#N +2#!)\n- Dünyanın yarısından azının sömürgeleştirilmemiş olması (#N +2#!)\n- Büyük Güçlerin %50 veya fazlasının hoşnutsuz olması (#N +3#!)\n- Askerî teknoloji yayılımı (3 Büyük Güç'te #N +1#!, 5'te #N +2#!)\n- Büyük Güç ordu büyümesi (yılda 200 yeni tabur başına #N +1#!, en fazla #N +5#!)\n- Büyük Güç donanma büyümesi (yılda 15/25/50 yeni gemi için #N +1#!, en fazla #N +3#!)\n- Kötü Namı 100 veya üzeri herhangi bir Büyük Güç (#N +3#!)\n- Aynı anda 3 veya daha fazla Büyük Güçün savaşta olması (#N +2#!)\n- Yenilmiş liderlerin savaş sonrası revizyonizmi (#N +2#!)\n- Atmosfer olayları küresel gerginliği yalnızca Büyük Savaş blok lideri tarafından seçildiğinde etkileyebilir\n\n#header Gerginlik Azalması:#!\n- Barış zamanı azalması (yılda #V -3#!)\n- Büyük Güç ile Büyük Güç savaşı: doğal azalma askıya alınır\n- 1880 öncesi Concert dönemi kısıtlaması yüksek gerginliğin sürdürülmesini zorlaştırır\n- Büyük Savaş sırasında: #N azalma yok#!\n- Milletler Cemiyeti (yılda #V -2#!, yalnızca barış zamanı)"

