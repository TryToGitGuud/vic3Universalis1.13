 gw_hist.2009.t:0 "Emek Diplomasisi"
 gw_hist.2009.d:0 "Yabancı misyonlar işçi, malzeme ve sessiz iş birliği istiyor. Savaş başka yerlerde verilebilir, fakat kontratları limanlarımıza ve nezaretlerimize ulaşıyor."
 gw_hist.2009.f:0 "Tarafsızlık bile seferber edilebilir."
 gw_hist.2009.a:0 "Yardımı ticarî tutun."
 gw_hist.2009.b:0 "İtilaf kanallarından yardım sunun."
 gw_hist_2009_a_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Tarafsızlık Teminatı#! kazanır"
 gw_hist_2009_b_tt:0 "#header Etkiler:#!\n- Hizalanma #bold İtilaf Devletleri#! yönünde kayar\n- #V 12 ay boyunca#! #bold Gizli Savaş Vaatleri#! kazanır"

 gw_hist.2010.t:0 "Küçük Kabineler Karar Veriyor"
 gw_hist.2010.d:0 "Büyük güçler uzak başkentlerin bile cevap vermesini gerektirecek kadar yüksek sesle konuştu. Katılmak, beklemek ya da kendini sigortaya almak — hepsinin bir bedeli olan kararlardır."
 gw_hist.2010.f:0 "Tarih nadiren yalnızca onu başlatan ülkelere sorar."
 gw_hist.2010.a:0 "Şimdilik dışarıda kalın."
 gw_hist.2010.b:0 "İttifak Devletleri için hazırlanın."
 gw_hist.2010.c:0 "İtilaf Devletleri için hazırlanın."
 gw_hist_2010_a_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Tarafsızlık Baskısı#! kazanır"
