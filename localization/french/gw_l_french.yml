 # --- Material Tension Events ---
 gw_crisis.4101.t:0 "Arsenal Contracts"
 gw_crisis.4101.d:0 "The armaments firms arrive with estimates before the cabinet has asked for them. They speak of reserves, delivery windows, and the danger of finding empty warehouses when the crisis turns."
 gw_crisis.4101.f:0 "A rifle ordered in peace may still be fired in war."
 gw_crisis.4101.a:0 "Place the contracts before prices climb."
 gw_crisis.4101.b:0 "Keep the orders within the peace budget."
 gw_crisis_4101_a_tt:0 "#header Effects:#!\n- Gains #bold Arsenal Contracts#! for #V 12 months#!"
 gw_crisis_4101_b_tt:0 "#header Effects:#!\n- Gains #bold Last Peace Budget#! for #V 9 months#!\n- If we lead a Great War bloc, #V World Tension decreases by 1#!"

 gw_crisis.4102.t:0 "Naval Estimates"
 gw_crisis.4102.d:0 "The navy asks for hulls not yet laid, engines not yet built, and crews not yet trained. Every rival dockyard is treated as a promise made against us."
 gw_crisis.4102.f:0 "Sea power is counted in steel long before the guns are fitted."
 gw_crisis.4102.a:0 "Approve the expanded estimates."
 gw_crisis.4102.b:0 "Delay the flotilla until the air clears."
 gw_crisis_4102_a_tt:0 "#header Effects:#!\n- Gains #bold Naval Estimates#! for #V 12 months#!"
 gw_crisis_4102_b_tt:0 "#header Effects:#!\n- Gains #bold Last Peace Budget#! for #V 9 months#!\n- If we lead a Great War bloc, #V World Tension decreases by 1#!"

 gw_crisis.4103.t:0 "Staff College Memoranda"
 gw_crisis.4103.d:0 "The general staff has begun circulating memoranda with red borders and no signatures. They do not call for war; they simply describe the disadvantages of being late to one."
 gw_crisis.4103.f:0 "A timetable can be an argument."
 gw_crisis.4103.a:0 "Fund the staff exercises."
 gw_crisis.4103.b:0 "Send the memoranda to civilian review."
 gw_crisis_4103_a_tt:0 "#header Effects:#!\n- Gains #bold Staff College Memoranda#! for #V 12 months#!"
 gw_crisis_4103_b_tt:0 "#header Effects:#!\n- Gains #bold Backchannel Diplomacy#! for #V 9 months#!\n- If we lead a Great War bloc, #V World Tension decreases by 1#!"

 gw_crisis.4104.t:0 "War Insurance"
 gw_crisis.4104.d:0 "Underwriters have begun treating rumor as cargo. Premiums climb with every speech, and merchants ask whether the state will guarantee voyages that still look safe on the map."
 gw_crisis.4104.f:0 "Markets hear the guns before armies do."
 gw_crisis.4104.a:0 "Let the warning stand."
 gw_crisis.4104.b:0 "Reassure the shippers through private channels."
 gw_crisis_4104_a_tt:0 "#header Effects:#!\n- Gains #bold War Insurance#! for #V 12 months#!"
 gw_crisis_4104_b_tt:0 "#header Effects:#!\n- Gains #bold Last Conference Spirit#! for #V 9 months#!\n- If we lead a Great War bloc, #V World Tension decreases by 1#!"

 gw_crisis.4105.t:0 "Bread and Powder"
 gw_crisis.4105.d:0 "The quartermasters ask for flour in the same breath as powder. Ministers who thought of war as maps now find it measured in loaves, coal wagons, and factory shifts."
 gw_crisis.4105.f:0 "An army marches after the baker and before the gunner."
 gw_crisis.4105.a:0 "Reserve grain and explosives together."
 gw_crisis.4105.b:0 "Keep civilian supply visibly first."
 gw_crisis_4105_a_tt:0 "#header Effects:#!\n- Gains #bold Bread and Powder#! for #V 12 months#!"
 gw_crisis_4105_b_tt:0 "#header Effects:#!\n- Gains #bold Market War Scare#! for #V 9 months#!\n- If we lead a Great War bloc, #V World Tension decreases by 1#!"

 gw_crisis.4106.t:0 "Emergency Credits"
 gw_crisis.4106.d:0 "The treasury has drafted a bill that does not mention war, though everyone in the chamber knows what it is for. Credit, once opened, has a way of becoming policy."
 gw_crisis.4106.f:0 "A budget can mobilize before a regiment does."
 gw_crisis.4106.a:0 "Open the credits."
 gw_crisis.4106.b:0 "Keep one more peacetime budget."
 gw_crisis_4106_a_tt:0 "#header Effects:#!\n- Gains #bold Emergency Credits#! for #V 12 months#!"
 gw_crisis_4106_b_tt:0 "#header Effects:#!\n- Gains #bold Last Peace Budget#! for #V 12 months#!\n- If we lead a Great War bloc, #V World Tension decreases by 2#!"

 gw_crisis.4107.t:0 "The Factory Orders"
 gw_crisis.4107.d:0 "Orders move from the ministries to the factory floors in sealed envelopes. Managers promise output; foremen count hands; workers wonder which promise will break first."
 gw_crisis.4107.f:0 "Industry has its own mobilization."
 gw_crisis.4107.a:0 "Let the contracts run ahead of events."
 gw_crisis.4107.b:0 "Slow the orders and invite talks."
 gw_crisis_4107_a_tt:0 "#header Effects:#!\n- Gains #bold Factory Orders#! for #V 12 months#!"
 gw_crisis_4107_b_tt:0 "#header Effects:#!\n- Gains #bold Arms Limitation Talks#! for #V 9 months#!\n- If we lead a Great War bloc, #V World Tension decreases by 1#!"

 gw_crisis.4108.t:0 "The Last Peace Budget"
 gw_crisis.4108.d:0 "The cabinet table holds two budgets. One buys time. The other buys readiness. No minister says which one future historians will call irresponsible."
 gw_crisis.4108.f:0 "Peace is often defended by numbers that look too small."
 gw_crisis.4108.a:0 "Pass the last peace budget."
 gw_crisis.4108.b:0 "Fold the arsenals into the accounts."
 gw_crisis_4108_a_tt:0 "#header Effects:#!\n- Gains #bold Last Peace Budget#! for #V 12 months#!\n- If we lead a Great War bloc, #V World Tension decreases by 2#!"
 gw_crisis_4108_b_tt:0 "#header Effects:#!\n- Gains #bold Arsenal Contracts#! for #V 9 months#!"

 # --- War Economy and Home Front Events ---
 gw_war.3201.t:0 "Bread for the Queues"
 gw_war.3201.d:0 "The queues outside the bakeries are longer than the morning dispatches. Local officials ask for grain, police ask for patience, and the army asks that nothing be taken from the front."
 gw_war.3201.f:0 "The home front has its own line of battle."
 gw_war.3201.a:0 "Protect the bread supply."
 gw_war.3201.b:0 "Hold the army's allocations."
 gw_war_3201_a_tt:0 "#header Effects:#!\n- Gains #bold Food Security Measures#! for #V 12 months#!\n- #V National Discontent decreases by 5#!\n- #N War Support decreases by 3#!"
 gw_war_3201_b_tt:0 "#header Effects:#!\n- Gains #bold Breadline Unrest#! for #V 9 months#!\n- #N National Discontent increases by 4#!\n- #V War Support increases by 3#!"

 gw_war.3202.t:0 "The Shell Contract"
 gw_war.3202.d:0 "A consortium promises shells by the trainload if the state accepts emergency prices and fewer questions. The front wants signatures before sunset."
 gw_war.3202.f:0 "Shortages turn accountants into strategists."
 gw_war.3202.a:0 "Sign before the guns fall silent."
 gw_war.3202.b:0 "Audit the contract first."
 gw_war_3202_a_tt:0 "#header Effects:#!\n- Gains #bold Shell Contracts#! for #V 12 months#!\n- #N National Discontent increases by 3#!\n- #V War Support increases by 4#!"
 gw_war_3202_b_tt:0 "#header Effects:#!\n- Gains #bold Long War Planning#! for #V 9 months#!\n- #V National Discontent decreases by 3#!\n- #N War Support decreases by 2#!"

 gw_war.3203.t:0 "Women at the Works"
 gw_war.3203.d:0 "Factory gates open before dawn to a new workforce. The newspapers call them patriots; the unions call them proof that the old rules have already changed."
 gw_war.3203.f:0 "Necessity hires quickly."
 gw_war.3203.a:0 "Bring them into the war industries."
 gw_war.3203.b:0 "Keep exemptions narrow and temporary."
 gw_war_3203_a_tt:0 "#header Effects:#!\n- Gains #bold Women in War Industry#! for #V 12 months#!\n- #V National Discontent decreases by 3#!\n- #V War Support increases by 2#!"
 gw_war_3203_b_tt:0 "#header Effects:#!\n- #V National Discontent decreases by 5#!\n- #N War Support decreases by 3#!"

 gw_war.3204.t:0 "Coal for the Railways"
 gw_war.3204.d:0 "The railways need coal for troop trains, hospitals, factories, and the cities. Every ton has a destination, and every destination claims to be essential."
 gw_war.3204.f:0 "A railway schedule is now a ration book."
 gw_war.3204.a:0 "Give military trains first claim."
 gw_war.3204.b:0 "Keep civilian coal moving."
 gw_war_3204_a_tt:0 "#header Effects:#!\n- Gains #bold Railway Priority#! for #V 9 months#!\n- #N National Discontent increases by 3#!\n- #V War Support increases by 3#!"
 gw_war_3204_b_tt:0 "#header Effects:#!\n- #V National Discontent decreases by 4#!\n- #N War Support decreases by 3#!"

 gw_war.3205.t:0 "War Bonds at the Town Hall"
 gw_war.3205.d:0 "Mayors offer halls, bands, and long lists of respectable names. The treasury wants loans; the country wants to believe that lending is a kind of service."
 gw_war.3205.f:0 "Some battles are subscribed in small coins."
 gw_war.3205.a:0 "Turn the drive into a civic ceremony."
 gw_war.3205.b:0 "Borrow quietly through the banks."
 gw_war_3205_a_tt:0 "#header Effects:#!\n- Gains #bold War Bond Committees#! for #V 12 months#!\n- #V National Discontent decreases by 3#!\n- #V War Support increases by 3#!"
 gw_war_3205_b_tt:0 "#header Effects:#!\n- Gains #bold Emergency Credits#! for #V 9 months#!\n- #V National Discontent decreases by 1#!"

 gw_war.3206.t:0 "The Black Market"
 gw_war.3206.d:0 "Ration books and military contracts have created a second economy in back rooms and railway sidings. Everyone condemns it; too many depend on it."
 gw_war.3206.f:0 "Scarcity writes its own laws."
 gw_war.3206.a:0 "Break the networks before they harden."
 gw_war.3206.b:0 "Tolerate what keeps shelves from emptying."
 gw_war_3206_a_tt:0 "#header Effects:#!\n- Gains #bold Black Market Controls#! for #V 9 months#!\n- #V National Discontent decreases by 4#!\n- #N War Support decreases by 2#!"
 gw_war_3206_b_tt:0 "#header Effects:#!\n- Gains #bold Black Market Spread#! for #V 9 months#!\n- #N National Discontent increases by 4#!"

 gw_war.3207.t:0 "Hospital Trains"
 gw_war.3207.d:0 "The wounded arrive before the telegrams. Doctors ask for rolling stock, nurses, and priority at every junction between the front and home."
 gw_war.3207.f:0 "Mercy also requires logistics."
 gw_war.3207.a:0 "Put the hospital trains first."
 gw_war.3207.b:0 "Keep the supply trains moving."
 gw_war_3207_a_tt:0 "#header Effects:#!\n- Gains #bold Hospital Trains#! for #V 12 months#!\n- #V National Discontent decreases by 6#!\n- #N War Support decreases by 3#!"
 gw_war_3207_b_tt:0 "#header Effects:#!\n- Gains #bold Munitions Overdrive#! for #V 9 months#!\n- #N National Discontent increases by 2#!\n- #V War Support increases by 4#!"

 gw_war.3208.t:0 "The Draft Boards"
 gw_war.3208.d:0 "The boards meet beneath portraits and recruitment posters. Each exemption has a name; each rejected appeal has a family waiting outside."
 gw_war.3208.f:0 "Manpower is counted one doorway at a time."
 gw_war.3208.a:0 "Tighten the quotas."
 gw_war.3208.b:0 "Defer the most contested cases."
 gw_war_3208_a_tt:0 "#header Effects:#!\n- Gains #bold Draft Board Drive#! for #V 12 months#!\n- #N National Discontent increases by 5#!\n- #V War Support increases by 4#!"
 gw_war_3208_b_tt:0 "#header Effects:#!\n- #V National Discontent decreases by 4#!\n- #N War Support decreases by 3#!"

 gw_war.3209.t:0 "The Ministry of Munitions"
 gw_war.3209.d:0 "The proposal creates a ministry with authority over contracts, labor, freight, and factory priorities. It is bureaucracy as artillery."
 gw_war.3209.f:0 "Modern war discovers new offices."
 gw_war.3209.a:0 "Give the ministry emergency authority."
 gw_war.3209.b:0 "Keep production in local hands."
 gw_war_3209_a_tt:0 "#header Effects:#!\n- Gains #bold Ministry of Munitions#! for #V 18 months#!\n- #N National Discontent increases by 4#!\n- #V War Support increases by 4#!"
 gw_war_3209_b_tt:0 "#header Effects:#!\n- Gains #bold Shell Contracts#! for #V 9 months#!\n- #V National Discontent decreases by 3#!\n- #N War Support decreases by 2#!"

 gw_war.3210.t:0 "Winter Fuel"
 gw_war.3210.d:0 "The first cold weeks turn every coal depot into a battlefield of petitions. Hospitals, barracks, factories, and tenements all ask to be judged indispensable."
 gw_war.3210.f:0 "Winter has no neutral policy."
 gw_war.3210.a:0 "Fuel the army first."
 gw_war.3210.b:0 "Keep the cities warm."
 gw_war_3210_a_tt:0 "#header Effects:#!\n- Gains #bold Winter Fuel Shortage#! for #V 9 months#!\n- #N National Discontent increases by 5#!\n- #V War Support increases by 3#!"
 gw_war_3210_b_tt:0 "#header Effects:#!\n- Gains #bold Food Security Measures#! for #V 9 months#!\n- #V National Discontent decreases by 5#!\n- #N War Support decreases by 4#!"

 gw_war.3211.t:0 "Censored Letters"
 gw_war.3211.d:0 "Censors sit in rooms heavy with ink and grief. Every line cut from a letter may protect morale, or make silence sound more frightening than the truth."
 gw_war.3211.f:0 "The blank space says something too."
 gw_war.3211.a:0 "Tighten the censor's hand."
 gw_war.3211.b:0 "Let more of the truth pass."
 gw_war_3211_a_tt:0 "#header Effects:#!\n- Gains #bold Censored Letters#! for #V 9 months#!\n- #N National Discontent increases by 4#!\n- #V War Support increases by 3#!"
 gw_war_3211_b_tt:0 "#header Effects:#!\n- #V National Discontent decreases by 5#!\n- #N War Support decreases by 4#!"

 gw_war.3212.t:0 "Veterans Before Victory"
 gw_war.3212.d:0 "Veteran units ask for rest with the quiet formality of men who have stopped expecting it. Staff officers answer with arrows on maps."
 gw_war.3212.f:0 "Experience is not the same as endurance."
 gw_war.3212.a:0 "Rotate the veterans home."
 gw_war.3212.b:0 "Ask them for one more effort."
 gw_war_3212_a_tt:0 "#header Effects:#!\n- Gains #bold Veterans Before Victory#! for #V 12 months#!\n- #V National Discontent decreases by 7#!\n- #N War Support decreases by 3#!"
 gw_war_3212_b_tt:0 "#header Effects:#!\n- Gains #bold Initial War Fervor#! for #V 9 months#!\n- #N National Discontent increases by 4#!\n- #V War Support increases by 4#!"

 gw_war.3213.t:0 "The Price of Flour"
 gw_war.3213.d:0 "Flour prices have become political news. Bakers blame mills, mills blame freight, and ministers learn that bread can bring a crowd faster than a speech."
 gw_war.3213.f:0 "The price of a loaf can measure faith in a government."
 gw_war.3213.a:0 "Subsidize bread before anger spreads."
 gw_war.3213.b:0 "Requisition stocks for the war."
 gw_war_3213_a_tt:0 "#header Effects:#!\n- Gains #bold Flour Relief#! for #V 12 months#!\n- #V National Discontent decreases by 6#!\n- #N War Support decreases by 2#!"
 gw_war_3213_b_tt:0 "#header Effects:#!\n- Gains #bold Breadline Unrest#! for #V 9 months#!\n- #N National Discontent increases by 5#!\n- #V War Support increases by 4#!"

 gw_war.3214.t:0 "Factories After Midnight"
 gw_war.3214.d:0 "The factory lamps burn long after the city goes dark. Output rises, tempers shorten, and the night shift begins to feel like a second front."
 gw_war.3214.f:0 "War has no closing bell."
 gw_war.3214.a:0 "Keep the night shifts running."
 gw_war.3214.b:0 "Shorten the hours before discipline breaks."
 gw_war_3214_a_tt:0 "#header Effects:#!\n- Gains #bold Night Shift Factories#! for #V 12 months#!\n- #N National Discontent increases by 5#!\n- #V War Support increases by 4#!"
 gw_war_3214_b_tt:0 "#header Effects:#!\n- Gains #bold Frontline Relief#! for #V 9 months#!\n- #V National Discontent decreases by 5#!\n- #N War Support decreases by 3#!"

