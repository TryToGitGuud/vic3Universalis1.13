 je_gw_alignment:0 "Büyük Güç Hizalanması"
 je_gw_alignment_desc:0 "Dünya siyaseti rakip bloklar halinde sertleştikçe, hükûmetimiz Büyük Savaş başlamadan diplomatik tutumunu ilan edebilir."
 je_gw_alignment_reason:0 "#bold Mevcut Tutum#!\n[ROOT.GetCountry.GetCustom('GetGWAlignmentStatus')]\n\n#bold Hibrit Hizalanma Olasılığı#!\nBu olasılıklar dünya düzeni hoşnutluğu, diplomatik antlaşmalar, ilişkiler, tutumlar, siyasî lobiler ve askerî güvenliği birleştirir. Savaşa Çağrı sırasında yapay zekâ seçimlerinin temelini de oluştururlar.\n[concept_gw_allied_powers]: #V %[ROOT.GetCountry.MakeScope.ScriptValue('gw_hybrid_alignment_allied_probability')|0]#!\n[concept_gw_central_powers]: #N %[ROOT.GetCountry.MakeScope.ScriptValue('gw_hybrid_alignment_central_probability')|0]#!\nTarafsızlık: #bold %[ROOT.GetCountry.MakeScope.ScriptValue('gw_hybrid_alignment_neutral_probability')|0]#!\n\n#bold Blok Liderleri#!\n[concept_gw_allied_powers]: [ROOT.GetCountry.GetCustom('GetGWAlliedLeaderName')]\n[concept_gw_central_powers]: [ROOT.GetCountry.GetCustom('GetGWCentralLeaderName')]\n\n#bold Diplomatik Konum#!\nBir ülke barış zamanı blok eğilimini, ancak bir tarafın belirgin üstünlüğü olduğunda değiştirir. Tarafsızlık ilan etmek bizi her iki bloktan da çıkarır, fakat bir süreliğine tutum değiştirme özgürlüğümüzü kısıtlar.\n\n#bold Mevcut Bloklar#!\nBu liste, modun küresel blok kayıtlarına şu anda yazılı olan dörde kadar önde gelen Büyük/Önemli Gücü gösterir.\n[concept_gw_allied_powers] (#v [GetGlobalVariable('gw_allied_members_count').GetValue|0]#!): [ROOT.GetCountry.GetCustom('GetGWAlliedList')]\n\n[concept_gw_central_powers] (#v [GetGlobalVariable('gw_central_members_count').GetValue|0]#!): [ROOT.GetCountry.GetCustom('GetGWCentralList')]\n\nTarafsız Güçler (#v [GetGlobalVariable('gw_neutral_members_count').GetValue|0]#!): [ROOT.GetCountry.GetCustom('GetGWNeutralList')]"
 gw_alignment_status_central:0 "#N İttifak Devletlerini destekliyoruz.#!"
 gw_alignment_status_allied:0 "#V İtilaf Devletlerini destekliyoruz.#!"
