 # ============================================================
 # LEAGUE CONGRESS
 # ============================================================

 # --- Congress Decisions ---
 gw_congress_call_denounce:0 "Call League Congress: Denounce"
 gw_congress_call_denounce_desc:0 "As a League member, we shall convene the League of Nations to formally denounce a nation for its aggressive conduct. Member states will vote on the motion, weighted by their international prestige.\n\n#header Requirements:#!\n- Must be a Great Power or Major Power\n- Target must have at least 25 infamy\n- Congress lasts 3 months\n- Requires 60% weighted support to pass\n\n#header If passed:#!\n- Target: #N -15%#! Prestige, #N -10%#! Influence, #N -25%#! Infamy Decay for 5 years\n- Target: #N +5#! Infamy\n\n#header If failed:#!\n- Target gains #V +15%#! Prestige and #V +25%#! Infamy Decay for 3 years"
 gw_congress_call_embargo:0 "Call League Congress: Embargo"
 gw_congress_call_embargo_desc:0 "We shall convene the League of Nations to impose collective economic sanctions against a rogue nation. This is the most severe economic sanction available and requires broad international support.\n\n#header Requirements:#!\n- Must be a Great Power or Major Power\n- Target must have at least 50 infamy\n- Congress lasts 3 months\n- Requires 70% weighted support to pass\n\n#header If passed:#!\n- Target: #N -25%#! Trade Competitiveness, #N -10%#! Prestige, #N -15%#! Influence for 5 years\n\n#header If failed:#!\n- Target gains #V +15%#! Prestige, #V +25%#! Infamy Decay for 3 years"
 gw_congress_cooldown_tooltip:0 "Must wait 2 years between calling congresses"
 gw_congress_no_session_tt:0 "No League Congress currently in session"
 gw_congress_not_at_war_tt:0 "Must not be at war"
 gw_congress_recent_case_tt:0 "A nation recently brought before the Congress cannot be selected again yet"
 gw_congress_must_select_target:0 "There must be a nation with at least 25 infamy to denounce"
 gw_congress_embargo_target_needed:0 "There must be a nation with at least 50 infamy to embargo"

 # --- Congress Scripted Buttons (Journal Entry) ---
 gw_congress_denounce_button:0 "Call Congress: Denounce"
 gw_congress_denounce_button_desc:0 "Convene the League of Nations to formally denounce a nation for aggressive conduct.\n\n#header Requirements:#!\n- Not at war, no congress in session, 2-year cooldown\n- Target must have at least #bold 25#! infamy\n- A nation recently brought before the Congress cannot be selected again yet\n\n#header If passed (60% needed):#!\n- Target: #N -15%#! Prestige, #N -10%#! Influence, #N -25%#! Infamy Decay for 5 years\n- Target: #N +5#! Infamy\n\n#header If failed:#!\n- Target gains #V +15%#! Prestige and #V +25%#! Infamy Decay for 3 years"
 gw_congress_embargo_button:0 "Call Congress: Embargo"
 gw_congress_embargo_button_desc:0 "Convene the League of Nations to impose collective economic sanctions against a rogue nation.\n\n#header Requirements:#!\n- Not at war, no congress in session, 2-year cooldown\n- Target must have at least #bold 50#! infamy\n- A nation recently brought before the Congress cannot be selected again yet\n\n#header If passed (70% needed):#!\n- Target: #N -25%#! Trade, #N -10%#! Prestige, #N -15%#! Influence for 5 years\n\n#header If failed:#!\n- Target gains #V +15%#! Prestige and #V +25%#! Infamy Decay for 3 years"
 gw_congress_expel_button:0 "Call Congress: Expel"
 gw_congress_expel_button_desc:0 "Convene the League of Nations to expel a rogue member from the organization.\n\n#header Requirements:#!\n- Not at war, no congress in session, 2-year cooldown\n- Target must be a League member with at least #bold 75#! infamy\n- A nation recently brought before the Congress cannot be selected again yet\n\n#header If passed (70% needed):#!\n- Target expelled for #bold 10 years#!\n- Target loses League privileges\n- Target: #N -20%#! Prestige, #N -15%#! Influence, #N -10%#! Trade for 10 years\n\n#header If failed:#!\n- Target gains #V +15%#! Prestige for 5 years"
 gw_congress_vote_support_button:0 "Support the Motion"
 gw_congress_vote_support_button_desc:0 "Record our delegation's vote in support of the present motion."
 gw_congress_vote_oppose_button:0 "Oppose the Motion"
 gw_congress_vote_oppose_button_desc:0 "Record our delegation's vote against the present motion."
 gw_congress_vote_abstain_button:0 "Abstain"
 gw_congress_vote_abstain_button_desc:0 "Record our delegation as abstaining. Our prestige will not count toward either side."

 # --- Congress Events ---
 gw_congress.1.t:0 "League Congress Convened"
 gw_congress.1.d:0 "We have called the League of Nations into session. Delegates from the leading member states are gathering to consider our motion. Their votes will be weighed according to the prestige each power commands."
 gw_congress.1.f:0 "The conscience of the civilized world stands assembled."
 gw_congress.1.a:0 "Let the deliberations begin."

 gw_congress.2.t:0 "League Congress — A Vote is Called"
 gw_congress.2.d:0 "[ROOT.GetCountry.GetCustom('GetGWCongressInitiatorName')] has called the League of Nations into session. The motion before the assembly concerns [ROOT.GetCountry.GetCustom('GetGWCongressTargetName')], and our delegation may record its vote while the congress remains open."
 gw_congress.2.f:0 "The register lies open; silence will be counted as its own answer."
 gw_congress.2.a:0 "Our delegation will review the motion."

 # --- Target Notification (Dynamic) ---
 gw_congress.3.t:0 "League Congress — We Stand Accused"
 gw_congress.3.t_denounce:0 "League Congress — We Face Denouncement"
 gw_congress.3.t_embargo:0 "League Congress — We Face an Embargo"
 gw_congress.3.t_expel:0 "League Congress — We Face Expulsion"
 gw_congress.3.d:0 "[ROOT.GetCountry.GetCustom('GetGWCongressInitiatorName')] has brought our conduct before the League of Nations. The member powers will deliberate and record their votes while we await the assembly's judgement."
 gw_congress.3.d_denounce:0 "[ROOT.GetCountry.GetCustom('GetGWCongressInitiatorName')] has called upon the League of Nations to #bold formally denounce#! us. The delegates will deliberate for #bold 3 months#! before deciding whether the motion is carried."
 gw_congress.3.d_embargo:0 "[ROOT.GetCountry.GetCustom('GetGWCongressInitiatorName')] has called upon the League of Nations to impose a collective trade #bold embargo#! against us. The delegates will deliberate for #bold 3 months#! before deciding whether sanctions shall be imposed."
 gw_congress.3.d_expel:0 "[ROOT.GetCountry.GetCustom('GetGWCongressInitiatorName')] has called upon the League of Nations to #bold expel#! us from the organization. The delegates will deliberate for #bold 3 months#! before determining whether we shall lose our standing in the League."
 gw_congress.3.f:0 "The wolves circle beneath diplomatic smiles."
 gw_congress.3.a:0 "We shall await the assembly's judgement."

 gw_congress.5.a:0 "The deliberations continue."

 gw_congress.10.t:0 "League Congress — Denouncement Passed"
 gw_congress.10.d:0 "The League of Nations has voted to formally denounce [ROOT.GetCountry.GetCustom('GetGWCongressTargetName')] for its aggressive conduct. The international community has spoken with a clear voice."
 gw_congress.10.f:0 "The weight of the world's disapproval is not easily shaken."
 gw_congress.10.a:0 "The League has spoken."

 gw_congress.11.t:0 "League Congress — Denouncement Failed"
 gw_congress.11.d:0 "The motion to denounce [ROOT.GetCountry.GetCustom('GetGWCongressTargetName')] has failed to gather sufficient support. The League remains divided, and no formal action will be taken."
 gw_congress.11.f:0 "The League's unity is tested and found wanting."
 gw_congress.11.a:0 "This is a disappointing outcome."

 gw_congress.12.t:0 "League Congress — Embargo Imposed"
 gw_congress.12.d:0 "The League of Nations has voted overwhelmingly to impose collective economic sanctions against [ROOT.GetCountry.GetCustom('GetGWCongressTargetName')]. The sanctioned nation will face diplomatic isolation and reduced commercial standing."
 gw_congress.12.f:0 "The economic noose tightens."
 gw_congress.12.a:0 "The embargo shall take effect at once."

 gw_congress.13.t:0 "League Congress — Embargo Rejected"
 gw_congress.13.d:0 "The motion to impose a collective embargo on [ROOT.GetCountry.GetCustom('GetGWCongressTargetName')] has failed. Too many member states were unwilling to bear the economic cost of sanctions, or sympathized with the accused."
 gw_congress.13.f:0 "Trade interests triumph over collective security."
 gw_congress.13.a:0 "The League lacks the will to act."

# --- Aborted Session Notification ---
 gw_congress.98.t:0 "League Congress — Session Aborted"
 gw_congress.98.d:0 "The Congress motion before the League has been rendered moot. The accused state no longer exists in any form the League can recognise — annexed, dissolved, or otherwise removed from the diplomatic ledger. Without a target, the deliberations cannot proceed."
 gw_congress.98.f:0 "A motion without a defendant is no motion at all."
 gw_congress.98.a:0 "We shall withdraw the motion."

# --- Expulsion Events ---
 gw_congress.30.t:0 "League Congress — Member Expelled"
 gw_congress.30.d:0 "The League of Nations has voted to expel [ROOT.GetCountry.GetCustom('GetGWCongressTargetName')] from the organization. Their membership privileges are revoked and they are barred from rejoining for ten years."
 gw_congress.30.f:0 "Cast out from the fellowship of nations."
 gw_congress.30.a:0 "A grave but necessary decision."

 gw_congress.31.t:0 "League Congress — Expulsion Rejected"
 gw_congress.31.d:0 "The motion to expel [ROOT.GetCountry.GetCustom('GetGWCongressTargetName')] from the League has failed. Sufficient member states opposed so drastic a measure, and the accused emerges vindicated."
 gw_congress.31.f:0 "The League recoils from its own power."
 gw_congress.31.a:0 "For now, they remain."

 gw_congress_call_expel:0 "Call League Congress: Expel Member"
 gw_congress_call_expel_desc:0 "We shall convene the League of Nations to expel a rogue member state. This is the gravest sanction available — the expelled nation loses all League privileges and cannot rejoin for ten years.\n\n#header Requirements:#!\n- Must be a Great Power or Major Power\n- Target must be a League member with at least 75 infamy\n- Congress lasts 3 months\n- Requires 70% weighted support to pass\n\n#header If passed:#!\n- Target expelled from the League for #bold 10 years#!\n- Target: #N -20%#! Prestige, #N -15%#! Influence, #N -10%#! Trade Competitiveness for 10 years\n\n#header If failed:#!\n- Target gains #V +15%#! Prestige for 5 years (backfire)"
 gw_congress_expel_target_needed:0 "There must be a League member with at least 75 infamy to expel"

 # --- Modifier Names ---
 gw_congress_expelled:1 "Expelled from the League of Nations"
 gw_congress_backfire_prestige:1 "Vindicated by the League"

 # ============================================================
 # TARGET SELECTION EVENTS
 # ============================================================

 # --- Denounce Target Selection ---
 gw_congress.100.t:0 "League Congress: Select Target for Denouncement"
 gw_congress.100.desc:0 "We have resolved to call a League Congress to denounce a nation for its transgressions against the international order. Our diplomats have identified several potential targets. Whom shall we bring before the assembly?"
 gw_congress.100.f:0 "Choose carefully — the League's credibility rests on sound judgement."
 gw_congress.100.a:0 "Denounce [SCOPE.sCountry('gw_candidate_1').GetName] — highest infamy among nations."
 gw_congress.100.b:0 "Denounce [SCOPE.sCountry('gw_candidate_2').GetName] — an aggressor currently at war."
 gw_congress.100.e:0 "We shall not call a congress at this time."

 # --- Embargo Target Selection ---
 gw_congress.101.t:0 "League Congress: Select Target for Embargo"
 gw_congress.101.desc:0 "A collective trade embargo is the most punishing economic sanction the League can impose. Our delegates must choose the target wisely — we need broad support for this drastic measure."
 gw_congress.101.f:0 "Economic warfare by another name."
 gw_congress.101.a:0 "Embargo [SCOPE.sCountry('gw_candidate_1').GetName] — the worst offender."
 gw_congress.101.b:0 "Embargo [SCOPE.sCountry('gw_candidate_2').GetName] — already denounced, time to escalate."
 gw_congress.101.e:0 "We shall not pursue an embargo at present."

# --- Expel Member Target Selection ---
 gw_congress.103.t:0 "League Congress: Select Member for Expulsion"
 gw_congress.103.desc:0 "Expulsion is the gravest sanction the League can impose upon one of its own. Only a member state that has flagrantly violated the principles of the League should face this judgement. Whom shall we accuse?"
 gw_congress.103.f:0 "To cast out a member is to admit the League has failed them — or they have failed the League."
 gw_congress.103.a:0 "Expel [SCOPE.sCountry('gw_candidate_1').GetName] — the most notorious member."
 gw_congress.103.b:0 "Expel [SCOPE.sCountry('gw_candidate_2').GetName] — already denounced, they have shown no remorse."
 gw_congress.103.e:0 "We shall not seek an expulsion at this time."

 # --- Target Selection Effect Tooltips ---
 gw_congress_denounce_effect_tt:0 "#header Deliberation#!\nA League Congress will be convened for #bold 3 months#!.\nRequires #bold 60%#! weighted support.\n\n#header If passed:#!\n- Target: #N -15%#! Prestige\n- Target: #N -10%#! Influence\n- Target: #N -25%#! Infamy Decay for 5 years\n- Target: #N +5#! Infamy\n\n#header If failed:#!\n- Target gains #V +15%#! Prestige and #V +25%#! Infamy Decay for 3 years"
 gw_congress_embargo_effect_tt:0 "#header Deliberation#!\nA League Congress will be convened for #bold 3 months#!.\nRequires #bold 70%#! weighted support.\n\n#header If passed:#!\n- Target: #N -25%#! Trade Competitiveness\n- Target: #N -10%#! Prestige\n- Target: #N -15%#! Influence for 5 years\n\n#header If failed:#!\n- Target gains #V +15%#! Prestige and #V +25%#! Infamy Decay for 3 years"
