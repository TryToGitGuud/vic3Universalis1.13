 # --- Great War Events ---

 gw_war.1001.t:0 "Büyük Savaş Sona Erdi — Zafer"
 gw_war.1001.d:0 "Büyük Savaş bizim lehimize sona ermiştir. Yenilen ulusların tebaası bağımsızlığını ilan etmiş, rejimleri yeniden şekillendirilmiş ve muzaffer güçler artık mağluplardan savaş tazminatı talep edebilir. Eskinin enkazı üzerinde yeni bir dünya düzeni inşa edilecektir."
 gw_war.1001.f:0 "Kazandık, fakat bir kuşağın kanı pahasına."
 gw_war.1001.a:0 "Yeni bir düzen tesis edilmiştir."

 gw_war.1002.t:0 "Büyük Savaş Sona Erdi — Yenilgi"
 gw_war.1002.d:0 "Barış antlaşmasının imzalanmasıyla teslim olmak zorunda kalmış bulunuyoruz. Bağımlı uluslarımız bağımsızlığını ilan etmiş, rejimimiz galiplerin gölgesinde yeniden şekillendirilmiş ve muzaffer güçler bizden tazminat talep edebilir."
 gw_war.1002.f:0 "Bir kuşağı ve savaştan önceki gururumuzu yitirdik."
 gw_war.1002.a:0 "Boyun eğmekten başka çaremiz yoktu."
 gw_war.1002.b:0 "Bu yalnızca bir ateşkestir."

 gw_war.1006.t:0 "Büyük Savaş Sona Erdi — Çıkmaz"
 gw_war.1006.d:0 "Büyük Savaş'ın dünya düzenini yeniden şekillendirmesi bekleniyordu, fakat iki taraf da kanlı bir kilitlenmeye savaşmıştır. Mevcut uluslararası düzeni korumak üzere bir uzlaşma sağlanmıştır."
 gw_war.1006.f:0 "Bir kuşağın kanı boşa dökülmüştür."
 gw_war.1006.a:0 "Demek ki zamanımızın barışı budur."

 gw_war.1007.t:0 "Arkadan Bıçaklanma Efsanesi"
 gw_war.1007.d:0 "Yenilginin ardından, halkımız arasında tehlikeli bir anlatı kök salmıştır. Bizi düşman değil, kendi saflarımızdaki hainler yenmişmiş — diyorlar. Cesur askerlerimizi arkadan baltalayan siyasetçiler, savaş vurguncuları ve muhalifler. Yanlış olmasına rağmen bu efsane, suçu yükleyecek birini arayan aşağılanmış halk arasında güçlü bir karşılık bulmaktadır."
 gw_war.1007.f:0 "Bizi savaş meydanında yenmediler — bize ihanet edildi!"
 gw_war.1007.a:0 "Hainler hesap vermek zorunda!"
 gw_war.1007.b:0 "Hakikati kabullenip yola devam etmeliyiz."

