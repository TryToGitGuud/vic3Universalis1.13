 # WORLD TENSION
 # ============================================================

 je_gw_world_tension:0 "World Situation"
 je_gw_world_tension_desc:0 "The global level of international instability. As tension rises, the risk of a catastrophic Great War increases."
 je_gw_world_tension_reason:0 "#header World Tension: [JournalEntry.CalcCurrentGoalValue|0]%#!\n\n#header [concept_gw_allied_powers] — Members: #v [GetGlobalVariable('gw_allied_members_count').GetValue|0]#!  @battalions! #v [GetGlobalVariable('gw_allied_army_total').GetValue|0]#!  @ships! #v [GetGlobalVariable('gw_allied_navy_total').GetValue|0]#!:#!\n[ROOT.GetCountry.GetCustom('GetGWAlliedList')]\n\n#header [concept_gw_central_powers] — Members: #v [GetGlobalVariable('gw_central_members_count').GetValue|0]#!  @battalions! #v [GetGlobalVariable('gw_central_army_total').GetValue|0]#!  @ships! #v [GetGlobalVariable('gw_central_navy_total').GetValue|0]#!:#!\n[ROOT.GetCountry.GetCustom('GetGWCentralList')]\n\n#header Neutral Powers — Members: #v [GetGlobalVariable('gw_neutral_members_count').GetValue|0]#!:#!\n[ROOT.GetCountry.GetCustom('GetGWNeutralList')]\n\n#header Last Year's Tension Breakdown:#!\n[ROOT.GetCountry.GetCustom('GetGWDecayTier')]\n[ROOT.GetCountry.GetCustom('GetGWMilitaryTier')]\n[ROOT.GetCountry.GetCustom('GetGWPoliticalTier')]\n[ROOT.GetCountry.GetCustom('GetGWConflictsTier')]\n\n#header Tension Tier Modifiers:#!\nBelow #V 20%#!: [concept_gw_peace_dividend]\nAt #N 40%#!: [concept_gw_growing_tensions]\nAt #N 60%#!: [concept_gw_tier_arms_race]\nAt #N 70%#!: [concept_gw_tier_ultimatum]\nAt #N 80%#!: [concept_gw_tier_crisis]\n\n#header Tension Sources:#!\n- Wars involving Major or Great Powers (#N +2#! / #N +3#! / #N +5#! for GP vs GP)\n- Direct war-start tension is capped per year (#N +8#! before 1880, #N +12#! from 1880)\n- Great Power conquest/annexation (#N +3#!)\n- Great/Major Power protectorate plays (#N +2#! / #N +1#!)\n- Great Power infamy accumulation (#N +1#! at 25 and 50)\n- Major Power infamy accumulation (#N +1#! at 50 and 100)\n- No colonizable land remaining (#N +2#!)\n- Less than half the world uncolonized (#N +2#!)\n- 50%+ Great Powers dissatisfied (#N +3#!)\n- Military tech proliferation (#N +1#! at 3 GPs, #N +2#! at 5)\n- GP army growth (#N +1#! per 200 new battalions/year, up to #N +5#!)\n- GP naval growth (#N +1#! at 15/25/50 new ships per year, up to #N +3#!)\n- Any Great Power with 100+ infamy (#N +3#!)\n- 3+ Great Powers at war simultaneously (#N +2#!)\n- Post-war revisionism by defeated leaders (#N +2#!)\n- Atmosphere events can shift global tension only when taken by a Great War bloc leader\n\n#header Tension Decay:#!\n- Peacetime decay (#V -3#! per year)\n- GP vs GP war: natural decay is suspended\n- Concert-era restraint before 1880 makes high tension harder to sustain\n- During the Great War: #N no decay#!\n- League of Nations (#V -2#! per year, peacetime only)"

