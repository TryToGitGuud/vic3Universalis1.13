 gw_congress_expel_button:0 "Kongreyi Topla: İhraç"
 gw_congress_expel_button_desc:0 "Asi bir üyeyi örgütten çıkarmak üzere Milletler Cemiyetini topla.\n\n#header Gereklilikler:#!\n- Savaşta değiliz, toplanmış kongre yok, 2 yıllık bekleme süresi geçmiş\n- Hedef en az #bold 75#! Kötü Nam'a sahip bir Cemiyet üyesi olmalı\n- Yakın zamanda Kongre önüne getirilmiş bir millet henüz tekrar seçilemez\n\n#header Geçerse (%70 gerekli):#!\n- Hedef #bold 10 yıl#! boyunca ihraç edilir\n- Hedef Cemiyet ayrıcalıklarını yitirir\n- Hedef: 10 yıl boyunca #N -%20#! Prestij, #N -%15#! Nüfuz, #N -%10#! Ticaret\n\n#header Geçmezse:#!\n- Hedef 5 yıl boyunca #V +%15#! Prestij kazanır"
