 gw_geneva_convention_member:1 "Cenevre Sözleşmesi Üyesi"
 gw_geneva_convention_member_desc:0 "Cenevre Sözleşmesi imzacısı uluslararası hukukî mübadeleden faydalanır, ancak baskıcı diplomasi izlerken daha sıkı bir gözetimi kabul eder."
 gw_peace_dividend:1 "Barış Kazançları"
 gw_growing_tensions:1 "Artan Gerilim"
 gw_high_tension:1 "Yüksek Uluslararası Gerginlik"
 gw_explosive_tension:1 "Barut Fıçısı"
 gw_critical_tension:1 "Kritik Gerginlik"
 gw_critical_tension_desc:0 "Uluslararası düzen felaketin eşiğinde durmaktadır. İttifak Devletleri lideri artık Savaşa Çağrı yapabilir — Genelkurmaylar seferberlik takvimlerinin varlığını inkâr etmeyi bırakmıştır."
 gw_humanitarian_concern:1 "İnsani Endişe"
 gw_humanitarian_concern_desc:0 "Halkın vicdanı uzak savaşların yürütülüş tarzına karşı kıpırdamıştır. Reformcular, misyonerler ve halk basını zulmü siyasî bir mesele haline getirmiştir."
 gw_humanitarian_credentials:1 "İnsani İtibar"
 gw_humanitarian_credentials_desc:0 "Heyetlerimiz Kızılhaç ve barış cemiyetlerinin konferanslarında oturmaktadır. Yabancı maceraların itibar bedeli artık barut dumanından daha uzağa ulaşmaktadır."
 gw_geneva_pioneer:1 "Cenevre Öncüsü"
 gw_geneva_pioneer_desc:0 "İnsani düzenin kurucu seslerinden biri sayılırız. Diğer güçler, savaşta uygar davranışın ne anlama geldiğini öğrenmek istediklerinde hukukçularımıza başvurur."
 gw_convention_critic:1 "Sözleşme Eleştirmeni"
 gw_convention_critic_desc:0 "Yetkililerimiz insani konferansları yabancı duygusallığı olarak reddetti. Kamuoyu güveni korunmuştur — fakat bu konferansların ardından gelen teknik heyetler bizim yanımızdan geçip gitmektedir."
 gw_war_apologist:1 "Askerlerin Müdafii"
 gw_war_apologist_desc:0 "Basın ve kürsü orduyu yabancı eleştirilerden korumaktadır. Yurt içinde ruh hâli sağlamdır; yurt dışında uzmanlarımıza daha az kapı açılmakta, göçmen çekiciliğimiz daralmaktadır."

