 gw_congress_embargo_effect_tt:0 "#header Müzakere#!\n#bold 3 ay#! boyunca bir Cemiyet Kongresi toplanacak.\n#bold %70#! ağırlıklı destek gerekir.\n\n#header Geçerse:#!\n- Hedef: 5 yıl boyunca #N -%25#! Ticarî Rekabetçilik\n- Hedef: #N -%10#! Prestij\n- Hedef: #N -%15#! Nüfuz\n\n#header Geçmezse:#!\n- Hedef 3 yıl boyunca #V +%15#! Prestij ve #V +%25#! Kötü Nam Azalması kazanır"
