 gw_congress.3.d_denounce:0 "[ROOT.GetCountry.GetCustom('GetGWCongressInitiatorName')], Milletler Cemiyetini bizi #bold resmen kınamaya#! çağırmıştır. Delegeler önergenin kabulüne karar vermeden önce #bold 3 ay#! müzakere edeceklerdir."
 gw_congress.3.d_embargo:0 "[ROOT.GetCountry.GetCustom('GetGWCongressInitiatorName')], Milletler Cemiyetini bize karşı kolektif ticaret #bold ambargosu#! uygulamaya çağırmıştır. Delegeler yaptırımların uygulanıp uygulanmayacağına karar vermeden önce #bold 3 ay#! müzakere edeceklerdir."
 gw_congress.3.d_expel:0 "[ROOT.GetCountry.GetCustom('GetGWCongressInitiatorName')], Milletler Cemiyetini bizi örgütten #bold ihraç etmeye#! çağırmıştır. Delegeler Cemiyetteki konumumuzu yitirip yitirmeyeceğimize karar vermeden önce #bold 3 ay#! müzakere edeceklerdir."
 gw_congress.3.f:0 "Diplomatik gülümsemelerin ardında kurtlar dolaşıyor."
 gw_congress.3.a:0 "Meclisin hükmünü bekleyeceğiz."

 gw_congress.5.a:0 "Müzakereler sürmektedir."

 gw_congress.10.t:0 "Cemiyet Kongresi — Kınama Kabul Edildi"
 gw_congress.10.d:0 "Milletler Cemiyeti, saldırgan davranışı için [ROOT.GetCountry.GetCustom('GetGWCongressTargetName')]'i resmen kınama yönünde oy kullandı. Uluslararası topluluk açık bir sesle konuşmuştur."
 gw_congress.10.f:0 "Dünyanın onaylamama yükü kolayca silkilip atılamaz."
 gw_congress.10.a:0 "Cemiyet konuşmuştur."

 gw_congress.11.t:0 "Cemiyet Kongresi — Kınama Reddedildi"
 gw_congress.11.d:0 "[ROOT.GetCountry.GetCustom('GetGWCongressTargetName')]'i kınama önergesi yeterli destek toplayamadı. Cemiyet bölünmüş kalmakta ve resmî bir işlem yapılmayacaktır."
 gw_congress.11.f:0 "Cemiyetin birliği sınandı ve yetersiz bulundu."
 gw_congress.11.a:0 "Hayal kırıklığı yaratan bir sonuç."

 gw_congress.12.t:0 "Cemiyet Kongresi — Ambargo Uygulandı"
 gw_congress.12.d:0 "Milletler Cemiyeti, [ROOT.GetCountry.GetCustom('GetGWCongressTargetName')]'e karşı kolektif ekonomik yaptırımlar uygulanması yönünde ezici çoğunlukla oy kullandı. Yaptırıma maruz millet diplomatik yalıtım ve ticarî itibar kaybıyla karşılaşacaktır."
 gw_congress.12.f:0 "Ekonomik kement sıkışıyor."
 gw_congress.12.a:0 "Ambargo derhal yürürlüğe girecektir."

 gw_congress.13.t:0 "Cemiyet Kongresi — Ambargo Reddedildi"
 gw_congress.13.d:0 "[ROOT.GetCountry.GetCustom('GetGWCongressTargetName')]'e karşı kolektif ambargo uygulama önergesi reddedildi. Pek çok üye devlet yaptırımların ekonomik bedelini taşımak istemedi ya da suçlanana sempati duydu."
 gw_congress.13.f:0 "Ticarî çıkarlar kolektif güvenliğin üzerine çıktı."
 gw_congress.13.a:0 "Cemiyetin harekete geçecek iradesi yok."

# --- İptal Bildirimi ---
 gw_congress.98.t:0 "Cemiyet Kongresi — Oturum İptal Edildi"
 gw_congress.98.d:0 "Cemiyet önündeki Kongre önergesi geçersiz kalmıştır. Suçlanan devlet, Cemiyetin tanıyabileceği herhangi bir biçimde artık mevcut değildir — ilhak edilmiş, dağılmış veya başka bir surette diplomatik defterden silinmiştir. Hedef olmadan müzakereler sürdürülemez."
 gw_congress.98.f:0 "Sanıksız önerge, önerge değildir."
 gw_congress.98.a:0 "Önergeyi geri çekeceğiz."

# --- İhraç Olayları ---
 gw_congress.30.t:0 "Cemiyet Kongresi — Üye İhraç Edildi"
 gw_congress.30.d:0 "Milletler Cemiyeti, [ROOT.GetCountry.GetCustom('GetGWCongressTargetName')]'i örgütten ihraç etme yönünde oy kullandı. Üyelik ayrıcalıkları iptal edilmiş ve on yıl boyunca yeniden katılmaları yasaklanmıştır."
 gw_congress.30.f:0 "Milletler birliğinden dışlanmış."
 gw_congress.30.a:0 "Ağır ama zorunlu bir karar."

 gw_congress.31.t:0 "Cemiyet Kongresi — İhraç Reddedildi"
 gw_congress.31.d:0 "[ROOT.GetCountry.GetCustom('GetGWCongressTargetName')]'i Cemiyetten ihraç etme önergesi reddedildi. Yeterli sayıda üye devlet bu denli sert bir tedbire karşı çıktı ve suçlanan akladığıyla çıktı."
 gw_congress.31.f:0 "Cemiyet kendi gücünden geri çekildi."
 gw_congress.31.a:0 "Şimdilik kalıyorlar."

 gw_congress_call_expel:0 "Cemiyet Kongresini Topla: Üyeyi İhraç Et"
 gw_congress_call_expel_desc:0 "Asi bir üye devleti ihraç etmek üzere Milletler Cemiyetini toplayacağız. Bu mevcut en ağır yaptırımdır — ihraç edilen millet tüm Cemiyet ayrıcalıklarını yitirir ve on yıl boyunca yeniden katılamaz.\n\n#header Gereklilikler:#!\n- Büyük Güç veya Önemli Güç olmalıyız\n- Hedef en az 75 Kötü Nam'a sahip bir Cemiyet üyesi olmalı\n- Kongre 3 ay sürer\n- Geçmesi için %70 ağırlıklı destek gerekir\n\n#header Geçerse:#!\n- Hedef #bold 10 yıl#! boyunca Cemiyetten ihraç edilir\n- Hedef: 10 yıl boyunca #N -%20#! Prestij, #N -%15#! Nüfuz, #N -%10#! Ticarî Rekabetçilik\n\n#header Geçmezse:#!\n- Hedef 5 yıl boyunca #V +%15#! Prestij kazanır (geri tepme)"
 gw_congress_expel_target_needed:0 "İhraç edilecek en az 75 Kötü Nam'a sahip bir Cemiyet üyesi olmalı"

 # --- Modifikatör İsimleri ---
 gw_congress_expelled:1 "Milletler Cemiyetinden İhraç Edildi"
 gw_congress_backfire_prestige:1 "Cemiyet Tarafından Aklandı"

 # ============================================================
 # TARGET SELECTION EVENTS
 # ============================================================

 # --- Denounce Target Selection ---
 gw_congress.100.t:0 "Cemiyet Kongresi: Kınama Hedefini Seç"
 gw_congress.100.desc:0 "Uluslararası düzene karşı ihlallerinden ötürü bir milleti kınamak üzere bir Cemiyet Kongresi toplamaya karar verdik. Diplomatlarımız birkaç olası hedef belirlemiştir. Kimi meclisin önüne getirelim?"
 gw_congress.100.f:0 "Dikkatli seçin — Cemiyetin itibarı sağduyulu yargıya bağlıdır."
 gw_congress.100.a:0 "[SCOPE.sCountry('gw_candidate_1').GetName]'i kına — milletler arasında en yüksek Kötü Nam'a sahip."
 gw_congress.100.b:0 "[SCOPE.sCountry('gw_candidate_2').GetName]'i kına — hâlihazırda savaşta olan bir saldırgan."
 gw_congress.100.e:0 "Şu an bir kongre toplamayalım."

 # --- Ambargo Hedef Seçimi ---
 gw_congress.101.t:0 "Cemiyet Kongresi: Ambargo Hedefini Seç"
 gw_congress.101.desc:0 "Kolektif ticaret ambargosu, Cemiyetin uygulayabileceği en cezalandırıcı ekonomik yaptırımdır. Delegelerimiz hedefi akıllıca seçmelidir — bu sert tedbir için geniş desteğe ihtiyacımız var."
 gw_congress.101.f:0 "Başka bir adla ekonomik savaş."
 gw_congress.101.a:0 "[SCOPE.sCountry('gw_candidate_1').GetName]'e ambargo uygula — en büyük suçlu."
 gw_congress.101.b:0 "[SCOPE.sCountry('gw_candidate_2').GetName]'e ambargo uygula — zaten kınanmıştı, tırmandırma vakti."
 gw_congress.101.e:0 "Şu an ambargo peşine düşmeyelim."

# --- Üye İhracı Hedef Seçimi ---
 gw_congress.103.t:0 "Cemiyet Kongresi: İhraç Edilecek Üyeyi Seç"
 gw_congress.103.desc:0 "İhraç, Cemiyetin kendi üyelerine uygulayabileceği en ağır yaptırımdır. Yalnızca Cemiyet ilkelerini açıkça çiğnemiş bir üye devlet bu hükümle yüzleşmelidir. Kimi itham edelim?"
 gw_congress.103.f:0 "Bir üyeyi dışlamak, ya Cemiyetin onları yüzüstü bıraktığını ya da onların Cemiyeti yüzüstü bıraktığını kabul etmektir."
 gw_congress.103.a:0 "[SCOPE.sCountry('gw_candidate_1').GetName]'i ihraç et — en namı kötüye çıkmış üye."
 gw_congress.103.b:0 "[SCOPE.sCountry('gw_candidate_2').GetName]'i ihraç et — zaten kınanmıştı, pişmanlık göstermedi."
 gw_congress.103.e:0 "Şu an ihraç peşine düşmeyelim."

 # --- Hedef Seçimi Etki Tooltipleri ---
