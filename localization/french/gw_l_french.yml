 # ============================================================
 # FACTION DECISIONS
 # ============================================================

 gw_join_central_powers_decision:0 "Join the Central Powers"
 gw_join_central_powers_decision_desc:0 "Our nation shall declare the present international order unjust. We will stand with the [concept_gw_central_powers] and seek to reshape the world.\n\n#header Effects:#!\n- Removes Allied alignment if active\n- #N 1-year cooldown#! before changing stance again"
 gw_join_central_tooltip:0 "Cannot already be aligned with the Central Powers.\nMust not have changed stance in the last year."

 gw_join_allied_powers_decision:0 "Join the Allied Powers"
 gw_join_allied_powers_decision_desc:0 "Our nation shall declare its commitment to the present international order. We will stand with the [concept_gw_allied_powers] to preserve stability.\n\n#header Effects:#!\n- Removes Central alignment if active\n- #N 1-year cooldown#! before changing stance again"
 gw_join_allied_tooltip:0 "Cannot already be aligned with the Allied Powers.\nMust not have changed stance in the last year."

 gw_initiate_great_war_decision:0 "Initiate the Great War"
 gw_initiate_great_war_decision_desc:0 "As the leader of the [concept_gw_central_powers], we shall challenge the [concept_gw_allied_powers] for dominance of the world order. This will plunge the world into a catastrophic conflict that will reshape the balance of power forever.\n\n#bold This action cannot be undone.#!"
 gw_tension_must_be_80:0 "World Tension must be at least 80%"
 gw_must_be_central_powers_leader:0 "Must be the Central Powers leader"
 gw_must_be_allied_powers_leader:0 "Must be the Allied Powers leader"
 gw_no_great_war_active:0 "No Great War is currently in progress"

 # --- Call to War (Scripted Button + Events) ---
 gw_call_to_war_button:0 "Call to War"
 gw_call_to_war_button_desc:0 "Issue a formal Call to War against the [concept_gw_allied_powers].\n\n#header Requirements:#!\n- World Tension must be at least #bold 80%#!\n- #bold Multilateral Alliances#! must be researched\n- We must be at peace\n- The Allied leader must exist and remain at peace\n- No Great War or active Call to War may already be in progress\n\n#header Effects:#!\n- A #bold 3-month mobilization period#! begins\n- Major Powers may reconsider their alignment\n- If a valid opposing leader still stands at the end of the period, the special #bold Reshape the World Order#! diplomatic play begins\n- Ordinary wars and manual diplomatic plays do #bold not#! count as the Great War chain\n\n#bold This action cannot be undone.#!"
 gw_call_to_war_possible_tt:0 "Requires #bold Multilateral Alliances#! technology.\nMust not be at war.\nAllied Powers leader must exist and not be at war."
 gw_call_to_war_tension_tt:0 "World Tension is at least #bold 90%#!"
 gw_call_to_war_tech_tt:0 "#bold Multilateral Alliances#! has been researched"
 gw_call_to_war_not_at_war_tt:0 "We are at peace"
 gw_call_to_war_allied_exists_tt:0 "The Allied leader exists and is at peace"
 gw_call_to_war_no_war_active_tt:0 "No Great War is currently in progress"
 gw_call_to_war_no_call_active_tt:0 "No other Call to War is currently active"
 gw_call_to_war_effect_tt:0 "A #bold 3-month mobilization period#! begins.\nMajor Powers may reconsider their alignment.\nIf a valid opposing leader still stands at the end of the period, the Great War diplomatic play begins."
 gw_call_mobilization_tt:0 "The mobilization period has begun. If the opposing bloc still has a valid leader after #bold 3 months#!, the special Great War diplomatic play will begin."
 gw_call_allied_prepare_tt:0 "You have #bold 3 months#! to prepare your defenses before the Great War diplomatic play begins."
 gw_call_join_central_tt:0 "We align with the [concept_gw_central_powers] to reshape the world order."
 gw_call_join_allied_tt:0 "We align with the [concept_gw_allied_powers] to defend the current order."
 gw_call_stay_neutral_tt:0 "We declare neutrality and refuse to join either side, but our diplomacy will grow more constrained."
 gw_call_to_war_abort_tt:0 "The mobilization collapses because no valid opposing bloc leader remains."
 gw_call_keep_current_tt:0 "We maintain our current stance."

 # Call to War Events
 gw_call.1.t:0 "The Call to War"
 gw_call.1.d:0 "The Call to War has been issued. The [concept_gw_central_powers] shall challenge the [concept_gw_allied_powers] for dominance of the world order. Our allies are being notified, and neutral nations must now determine their course. In three months, the diplomatic play will begin and the Great War shall commence."
 gw_call.1.f:0 "The die is cast."
 gw_call.1.a:0 "Mobilize the armies!"

 gw_call.2.t:0 "The Central Powers Issue a Call to War"
 gw_call.2.d:0 "The [concept_gw_central_powers] have issued a formal Call to War against us. In three months, a diplomatic play will be initiated to reshape the world order. We must use this time to prepare our defenses and rally our allies."
 gw_call.2.f:0 "The storm is coming."
 gw_call.2.a:0 "Rally the nation. We shall not yield."

 gw_call.3.t:0 "The Great Powers Mobilize"
 gw_call.3.d:0 "The [concept_gw_central_powers] have issued a Call to War against the [concept_gw_allied_powers]. In three months, the Great War will begin. Every Great Power must now decide where they stand. Our faction alignment cooldown has been lifted — we may freely choose our side before the war begins."
 gw_call.3.f:0 "The fate of nations hangs in the balance."
 gw_call.3.a:0 "Stand with the Central Powers!"
 gw_call.3.b:0 "Stand with the Allied Powers!"
 gw_call.3.c:0 "Declare neutrality."
 gw_call.3.e:0 "Maintain our current alignment."

 gw_call.10.t:0 "The Great War Begins"
 gw_call.10.d:0 "The mobilization period has ended. Three months have passed since the Call to War was issued, and the world has chosen its sides. Formal diplomacy has failed; the [concept_gw_central_powers] now open the special #bold Reshape the World Order#! diplomatic play against the [concept_gw_allied_powers]. The Great War has begun."
 gw_call.10.f:0 "God help us all."
 gw_call.10.a:0 "For the new order!"
 gw_call.10.b:0 "The opposing bloc has dissolved."

 # --- Diplomatic Play ---
 gw_dp_reshape_order:0 "Reshape the World Order"
 gw_dp_reshape_order_desc:0 "The [concept_gw_central_powers] challenges the [concept_gw_allied_powers] for dominance over the international order. This is the Great War — a conflict that will determine the fate of nations."
 gw_wg_reshape_world_order:0 "Reshape the World Order"
 gw_wg_reshape_world_order_desc:0 "A Great War objective aimed at breaking the opposing faction leader's ability to dictate the international order. It is contested by occupying the target leader's capital, while the final settlement is handled by the Great War outcome events."
 war_goal_gw_wg_reshape_world_order_type_name:0 "Reshape the World Order"
 war_goal_gw_wg_reshape_world_order_type_desc:0 "A Great War objective aimed at breaking the opposing faction leader's ability to dictate the international order."
 war_goal_gw_wg_reshape_world_order:0 "Reshape the World Order"
 war_goal_gw_wg_reshape_world_order_desc:0 "Break the opposing bloc leader's ability to dictate the international order. The final settlement is handled by the Great War outcome events."

 # ============================================================
 # GREAT POWER CONFERENCE EVENTS
 # ============================================================

 gw_conference.1.t:0 "A Great Power Conference"
 gw_conference.1.d:0 "With tensions rising and the Great Powers still formally at peace, diplomats have begun to argue for a general conference. A carefully managed settlement could reaffirm the balance of power, quiet the press, and give the chancelleries room to step back from confrontation."
 gw_conference.1.f:0 "The old order endures only while its custodians are willing to meet."
 gw_conference.1.a:0 "Convene the conference."
 gw_conference.1.b:0 "The situation does not require a conference."
 gw_conference.2.t:0 "The Great Powers Confer"
 gw_conference.2.d:0 "The leading powers have met to contain the latest diplomatic crisis. No lasting settlement is guaranteed, but the exchange has cooled tempers and reminded each cabinet that war remains a choice, not an inevitability."
 gw_conference.2.f:0 "For a moment, the language of protocol has prevailed over the language of mobilization."
 gw_conference.2.a:0 "Peace has been given another chance."
 gw_conference_convene_tt:0 "#header Effects:#!\n- #V World Tension decreases by 6#!\n- A Great Power Conference cannot be called again for #N 5 years#!"
 gw_conference_decline_tt:0 "#header Effects:#!\n- A Great Power Conference cannot be proposed again for #N 3 years#!"

 # ============================================================
 # CRISIS EVENTS
 # ============================================================

 # Phase 1: Arms Race (60%)
 gw_crisis.1001.t:0 "The Memorandum of the General Staff"
 gw_crisis.1001.d:0 "The latest figures arrive in sealed folders: new guns, new ships, new mobilization tables. Across the chancelleries, the same quiet arithmetic is being done. To slow now may be prudent; to fall behind may be fatal."
 gw_crisis.1001.f:0 "A budget is only ink until the first orders are cut."
 gw_crisis.1001.a:0 "Authorize the staff program."
 gw_crisis.1001.b:0 "Sound out limits before budgets become banners."
 gw_crisis_1001_a_tt:0 "#header Effects:#!\n- Gains #bold Arms Race#! for #V 24 months#!\n- Gains #bold General Staff Program#! for #V 18 months#!\n- A follow-up arms race event may fire in #V 6 months#!"
 gw_crisis_1001_b_tt:0 "#header Effects:#!\n- Gains #bold Arms Limitation Talks#! for #V 12 months#!\n- #V World Tension decreases by 1#!"

 gw_crisis.1002.t:0 "Tables Revised in Red Ink"
 gw_crisis.1002.d:0 "The first appropriations have already vanished into barracks, foundries, and naval yards. The generals now return with revised estimates, each page marked urgent, each margin crowded with the names of rival divisions."
 gw_crisis.1002.f:0 "There is no final estimate in an arms race."
 gw_crisis.1002.a:0 "Accept the revised timetable."
 gw_crisis.1002.b:0 "Let the diplomats try to cap the spiral."
 gw_crisis_1002_a_tt:0 "#header Effects:#!\n- Gains #bold General Staff Program#! for #V 18 months#!"
 gw_crisis_1002_b_tt:0 "#header Effects:#!\n- Gains #bold Arms Limitation Talks#! for #V 12 months#!\n- #V World Tension decreases by 1#!"

 gw_crisis.1003.t:0 "The Contagion of Preparedness"
 gw_crisis.1003.d:0 "No ultimatum has crossed our desk, yet every capital reads the same newspapers. Railway timetables are studied with new seriousness, reserve officers are quietly summoned, and investors ask whether peace itself has become a speculation."
 gw_crisis.1003.f:0 "War has not been declared, but it is already priced into the morning papers."
 gw_crisis.1003.a:0 "Keep the country calm, and ready."
 gw_crisis.1003.b:0 "Lend our voice to restraint."
 gw_crisis_1003_a_tt:0 "#header Effects:#!\n- Gains #bold Public War Scare#! for #V 12 months#!"
 gw_crisis_1003_b_tt:0 "#header Effects:#!\n- Gains #bold Arms Limitation Talks#! for #V 12 months#!"

 # --- Arms Race Atmosphere Chain (bloc leader, embrace path) ---
 gw_crisis.1100.t:0 "The Naval Estimates"
 gw_crisis.1100.d:0 "The Admiralty has laid before the legislature its largest peacetime construction programme. Battle squadrons, fast cruisers, submarine flotillas — every line in the schedule has been justified by reference to the rival bloc's launchings. The foreign attachés await the vote with their cypher books open."
 gw_crisis.1100.f:0 "A ship laid down in one capital is a ship answered for in another."
 gw_crisis.1100.a:0 "Pass the estimates in full."
 gw_crisis.1100.b:0 "Defer the largest item to next session."

 gw_crisis.1101.t:0 "The Grand Manoeuvres"
 gw_crisis.1101.d:0 "Tens of thousands of reservists are to be called up for autumn exercises on a scale not seen since the founding of the General Staff. The press has been instructed; the railway directors have been warned; the foreign observers have been invited, to remove any doubt as to what they will report home."
 gw_crisis.1101.f:0 "A peacetime exercise rehearsed in earnest."
 gw_crisis.1101.a:0 "Stage the manoeuvres in their full strength."
 gw_crisis.1101.b:0 "Hold to routine garrison drills."

 gw_crisis.1102.t:0 "Defence Industry Contracts"
 gw_crisis.1102.d:0 "The arms, artillery and munition firms have submitted joint petitions for long-term contracts. The Ministry of War proposes to award them — and to underwrite a new round of factory construction. The shareholders are quietly pleased; the peace societies are not."
 gw_crisis.1102.f:0 "Once the lines are running double shifts, they do not easily go back."
 gw_crisis.1102.a:0 "Award the contracts and break ground on the new works."
 gw_crisis.1102.b:0 "The existing capacity will suffice."

 gw_crisis.1103.t:0 "Conscription Reform"
 gw_crisis.1103.d:0 "The General Staff has tabled a new conscription bill: longer service, broader exemptions revoked, the reserve rolls extended by half a million. The bill's sponsors describe it as a measure of prudent reform; its opponents, as the law that makes the next war certain."
 gw_crisis.1103.f:0 "A statute written for a war that has not yet been declared."
 gw_crisis.1103.a:0 "Pass the bill in its full form."
 gw_crisis.1103.b:0 "Retain the existing terms of service."

 # --- Arms Race Echo Events (non-leader Major Powers) ---
 gw_crisis.1110.t:0 "Echoes of the Naval Estimates"
 gw_crisis.1110.d:0 "The rival bloc's new naval programme has been read with attention in our own admiralty offices. Our yards are nothing like theirs in scale, but we are not without dockwrights, and our envoys send word that capital has begun to seek us out."
 gw_crisis.1110.f:0 "A measure cannot pass abroad without being weighed at home."
 gw_crisis.1110.a:0 "Match part of the programme, quietly."
 gw_crisis.1110.b:0 "Lodge a formal protest in the foreign press."
 gw_crisis.1110.c:0 "Note the news; take no public position."

 gw_crisis.1111.t:0 "Echoes of the Grand Manoeuvres"
 gw_crisis.1111.d:0 "Our observers have returned from the foreign manoeuvres with thick portfolios. The General Staff requests permission — and a supplementary budget — to organise comparable exercises of our own. The Cabinet weighs the cost of standing aside against the cost of joining in."
 gw_crisis.1111.f:0 "An army that does not drill is presumed not to fight."
 gw_crisis.1111.a:0 "Authorise our own autumn exercises."
 gw_crisis.1111.b:0 "Denounce the foreign display as provocation."
 gw_crisis.1111.c:0 "Send observers; commit nothing further."

 gw_crisis.1112.t:0 "Echoes of the Industry Contracts"
 gw_crisis.1112.d:0 "The foreign awards have reshaped the market for armour plate, smokeless powder, and field artillery. Our own firms have submitted memoranda; some of them, we are told, in conjunction with foreign capital. The Ministry of War has been asked for guidance."
 gw_crisis.1112.f:0 "Industry does not wait for chancelleries."
 gw_crisis.1112.a:0 "Award the matching contracts to our firms."
 gw_crisis.1112.b:0 "Issue a formal protest at the build-up."
 gw_crisis.1112.c:0 "Let the firms negotiate as they will; the state takes no part."

 gw_crisis.1113.t:0 "Echoes of the Conscription Reform"
 gw_crisis.1113.d:0 "The foreign conscription law has produced a quiet shock in our own staff colleges. The argument from precedent is plain: if the rival bloc has lengthened its term of service, our reservist roll must be reviewed in turn. The Cabinet has scheduled the question for the next session."
 gw_crisis.1113.f:0 "A precedent abroad becomes a duty at home."
 gw_crisis.1113.a:0 "Revise our own conscription statute upward."
 gw_crisis.1113.b:0 "Denounce the foreign measure as militarism."
 gw_crisis.1113.c:0 "Defer the question until the situation clarifies."

 # Phase 2: Ultimatum (70%)
 gw_crisis.2001.t:0 "The Note Delivered at Dusk"
 gw_crisis.2001.d:0 "An ambassador waits beneath the lamps while clerks make the last copies. The language has been weighed, sharpened, and made just ambiguous enough for both honor and disaster. By morning, every friendly capital will ask whether this is diplomacy or the first movement of war."
 gw_crisis.2001.f:0 "The seal was unbroken, but the threat was already understood."
 gw_crisis.2001.a:0 "Send the note without amendment."
 gw_crisis.2001.b:0 "Open a private channel before the note hardens."
 gw_crisis.2001.c:0 "Let the note travel with mobilization orders."
 gw_crisis_2001_a_tt:0 "#header Effects:#!\n- Gains #bold Diplomatic Crisis#! for #V 12 months#!\n- Records an ultimatum for the opposing bloc leader"
 gw_crisis_2001_b_tt:0 "#header Effects:#!\n- Gains #bold Backchannel Diplomacy#! for #V 12 months#!\n- #V World Tension decreases by 2#!"
 gw_crisis_2001_c_tt:0 "#header Effects:#!\n- Gains #bold Partial Mobilization Plan#! for #V 18 months#!\n- Gains #bold Diplomatic Crisis#! for #V 12 months#!\n- Records an ultimatum for the opposing bloc leader"

 gw_crisis.2002.t:0 "The Reply at the Cabinet Table"
 gw_crisis.2002.d:0 "The ultimatum lies open on the table. Its clauses are severe enough to wound sovereignty, but vague enough that refusal may be called provocation. Around the room, ministers speak in low voices; outside it, the city already knows that history has entered the building."
 gw_crisis.2002.f:0 "Some answers are written for the recipient. Others are written for posterity."
 gw_crisis.2002.a:0 "Reject the ultimatum in full."
 gw_crisis.2002.b:0 "Accept only what can be survived."
 gw_crisis_2002_a_tt:0 "#header Effects:#!\n- Gains #bold Partial Mobilization Plan#! for #V 12 months#!\n- Clears the pending ultimatum"
 gw_crisis_2002_b_tt:0 "#header Effects:#!\n- Gains #bold Backchannel Diplomacy#! for #V 12 months#!\n- Clears the pending ultimatum\n- #V World Tension decreases by 1#!"

 gw_crisis.2003.t:0 "Telegrams from an Uneasy Continent"
 gw_crisis.2003.d:0 "The crisis is not ours, not yet. Still, every wire service carries rumors of recalled envoys and guarded railway stations. Merchants delay contracts, newspapers demand clarity, and the cabinet asks how long a nation can remain merely concerned."
 gw_crisis.2003.f:0 "Neutrality is easiest before the first telegram arrives."
 gw_crisis.2003.a:0 "Prepare the public for uncertainty."
 gw_crisis.2003.b:0 "Work the quiet channels."
 gw_crisis_2003_a_tt:0 "#header Effects:#!\n- Gains #bold Public War Scare#! for #V 12 months#!"
 gw_crisis_2003_b_tt:0 "#header Effects:#!\n- Gains #bold Backchannel Diplomacy#! for #V 12 months#!"

 # Phase 3: Crisis Peak (80%)
 gw_crisis.3001.t:0 "The Last Council Before War"
 gw_crisis.3001.d:0 "The maps are already pinned. The memoranda already assume railheads, depots, and dates. Only the final order remains unwritten, and everyone in the room understands that delay may be read as weakness just as surely as action may become catastrophe."
 gw_crisis.3001.f:0 "At some hour of the night, preparation becomes decision."
 gw_crisis.3001.a:0 "Issue the Call to War."
 gw_crisis.3001.g:0 "Hold the order until the last possible hour."
 gw_crisis.3001.e:0 "Send one final signal of restraint."
 gw_crisis_3001_a_tt:0 "#header Effects:#!\n- Begins the #bold Call to War#! mobilization period\n- If a valid opposing leader remains after #V 3 months#!, the Great War diplomatic play begins"
 gw_crisis_bide_time_tt:0 "#header Effects:#!\n- Gains #bold Partial Mobilization Plan#! for #V 12 months#!\n- The #bold Call to War#! button remains available on the World Situation journal entry"
 gw_crisis_not_yet_tt:0 "#header Effects:#!\n- Gains #bold Backchannel Diplomacy#! for #V 12 months#!\n- #V World Tension decreases by 5#!\n- The final crisis event will not fire again for #N 1 year#!"

 gw_crisis.3002.t:0 "The Defensive Protocols"
 gw_crisis.3002.d:0 "Reports from the other bloc leave little room for optimism. The question before the cabinet is no longer whether the order can be preserved by speeches alone, but whether the machinery of defense can be made ready without becoming the spark itself."
 gw_crisis.3002.f:0 "The best defense is quiet until the hour it is needed."
 gw_crisis.3002.a:0 "Put the frontier plans in order."
 gw_crisis.3002.b:0 "Keep the embassies talking."
 gw_crisis_3002_a_tt:0 "#header Effects:#!\n- Gains #bold Defense Readiness#! for #V 18 months#!"
 gw_crisis_3002_b_tt:0 "#header Effects:#!\n- Gains #bold Backchannel Diplomacy#! for #V 12 months#!\n- #V World Tension decreases by 2#!"

 gw_crisis.3003.t:0 "The Waiting Rooms of Europe"
 gw_crisis.3003.d:0 "The great blocs stand near the edge, and lesser rooms fill with the same questions: which border will close first, which ally will call, which market will break, which speech will be remembered as the last one made in peace?"
 gw_crisis.3003.f:0 "The small hours before a great war belong to every capital."
 gw_crisis.3003.a:0 "Keep the public steady."
 gw_crisis.3003.b:0 "Ready the ministries for the shock."
 gw_crisis_3003_a_tt:0 "#header Effects:#!\n- Gains #bold Public War Scare#! for #V 12 months#!"
 gw_crisis_3003_b_tt:0 "#header Effects:#!\n- Gains #bold Defense Readiness#! for #V 12 months#!"

 # ============================================================
 # GREAT WAR
 # ============================================================

 je_gw_great_war:0 "The Great War"
 je_gw_great_war_desc:0 "A Great War is underway. Preserve the home front, contain national discontent, and endure to the peace."
 je_gw_great_war_reason:0 "A Great War to reshape the international order is underway, and our nation is party to it.\n\n#header Home Front:#!\nNational Support starts high and falls as #N National Discontent#! rises. The balance above shows whether the home front still supports the war effort or is drifting toward unrest.\n\n#header Support Levels:#!\n- #V 80-100%#!: support remains fervent\n- #bold 60-79%#!: support is strained\n- #N 40-59%#!: the country is war-weary\n- #N 20-39%#!: the home front is close to breaking\n- #N 0-19%#!: crisis events may begin\n- #N 0%#!: mutiny or collapse may follow\n\n#header Main Causes:#!\nDiscontent rises from radical pops, mounting casualties, wartime rationing, and prolonged strain on the home front.\n\n#header Responses:#!\n- #V War Propaganda#! lowers discontent modestly and improves war support\n- #V Suppress Dissent#! reduces discontent sharply but inflames radicals\n- #V Wartime Rationing#! eases military costs but worsens unrest\n- #V Military Research Focus#! strengthens the war effort at a more modest pace\n\n#header Settlement:#!\nA decisive peace leaves one bloc ascendant, while an inconclusive settlement ends the war without a clear victor."

 gw_great_war_ended:0 "The Great War Has Ended"
 gw_great_war_dp_name:0 "The Great War"

 gw_discontent_frenzy:0 "National Support: #V Fervent#! ([ROOT.GetCountry.MakeScope.ScriptValue('gw_national_support_value')|0]%)"
 gw_discontent_doubtful:0 "National Support: #bold Strained#! ([ROOT.GetCountry.MakeScope.ScriptValue('gw_national_support_value')|0]%)"
 gw_discontent_tired:0 "National Support: #N War-Weary#! ([ROOT.GetCountry.MakeScope.ScriptValue('gw_national_support_value')|0]%)"
 gw_discontent_angry:0 "National Support: #N Breaking#! ([ROOT.GetCountry.MakeScope.ScriptValue('gw_national_support_value')|0]%) — the home front is close to collapse"
 gw_discontent_revolt:0 "National Support: #N Collapse Imminent#! ([ROOT.GetCountry.MakeScope.ScriptValue('gw_national_support_value')|0]%) — mutiny and revolution loom!"
 gw_home_front_balance_progress_bar:0 "Great War Home Front"
 gw_home_front_balance_progress_bar_desc:0 "National Support: #V [ROOT.GetCountry.MakeScope.ScriptValue('gw_national_support_value')|0]%#!"
 gw_home_front_balance_progress_bar_second_desc:0 "National Discontent: #N [ROOT.GetCountry.MakeScope.ScriptValue('gw_national_discontent_display_value')|0]%#!"
 gw_home_front_balance_progress_sync:0 "Current home front balance"

 # --- Great War Events ---

 gw_war.1001.t:0 "The Great War is Over — Victory"
 gw_war.1001.d:0 "The Great War has ended in our favour. The defeated nations' subjects have declared independence, their regimes have been remade, and the victorious powers may now claim war reparations from the vanquished. A new world order shall be built upon the ruins of the old."
 gw_war.1001.f:0 "We won, but at the cost of a generation's blood."
 gw_war.1001.a:0 "A new order has been established."

 gw_war.1002.t:0 "The Great War is Over — Defeat"
 gw_war.1002.d:0 "With the signing of the peace treaty, we have been forced to surrender. Our dependent nations have declared independence, our regime has been remade under the shadow of the victors, and the victorious powers may claim reparations from us."
 gw_war.1002.f:0 "We have lost a generation, and the pride we held before the war."
 gw_war.1002.a:0 "We had no choice but to submit."
 gw_war.1002.b:0 "This is but a truce."

 gw_war.1006.t:0 "The Great War is Over — Stalemate"
 gw_war.1006.d:0 "The Great War was expected to reshape the world order, but both sides have fought to a bloody standstill. A compromise was reached to maintain the current international order."
 gw_war.1006.f:0 "A generation's blood spilled for nothing."
 gw_war.1006.a:0 "So this is the peace of our time."

 gw_war.1007.t:0 "The Stab-in-the-Back Myth"
 gw_war.1007.d:0 "In the aftermath of defeat, a dangerous narrative has taken root among our people. It wasn't the enemy who defeated us, they say — it was traitors within our own ranks. Politicians, profiteers, and dissenters who undermined our brave soldiers from behind. This myth, though false, resonates powerfully with a humiliated populace hungry for someone to blame."
 gw_war.1007.f:0 "We were never defeated on the battlefield — we were betrayed!"
 gw_war.1007.a:0 "The traitors must be held accountable!"
 gw_war.1007.b:0 "We must accept the truth and move forward."

 # ============================================================
 # WARTIME DECISIONS
 # ============================================================

 gw_war_propaganda_decision:0 "War Propaganda"
 gw_war_propaganda_decision_desc:0 "The press, the schools, and the public square shall be turned toward the war effort.\n\n#header Effects:#!\n- #V +10#! war support in all active wars\n- #V +25#! instead with #bold War Propaganda#! technology\n- Applies #bold War Propaganda#! for 6 months\n- The modifier modestly #V lowers discontent from casualties#!\n- #N Cannot be used again until the modifier expires#!"

 gw_wartime_rationing_decision:0 "Wartime Rationing"
 gw_wartime_rationing_decision_desc:0 "Civilian consumption shall be restricted so that the armies may be supplied first.\n\n#header Effects:#!\n- Applies #bold Wartime Rationing#! for 2 years\n- #V -20%#! military wages and #V -20%#! mobilization cost\n- #N Raises discontent on the home front#!\n- #N +20%#! radicals from political movements and #N -20%#! loyalists\n- #N Cannot be used again until the modifier expires#!"

 gw_suppressing_dissent_decision:0 "Suppress Anti-War Dissent"
 gw_suppressing_dissent_decision_desc:0 "Agitation against the war effort shall be curtailed by police measures and censorship.\n\n#header Effects:#!\n- Applies #bold Suppressing Anti-War Dissent#! for 2 years\n- Immediately #V reduces national discontent#!\n- Continues to #V suppress discontent#! while active\n- #N Increases radicalism#! on the home front\n- #N Cannot be used again for 2 years#!"

 gw_wartime_research_decision:0 "Focus on Military Research"
 gw_wartime_research_decision_desc:0 "Scientific and industrial effort shall be directed toward immediate military needs.\n\n#header Effects:#!\n- Applies #bold Wartime Research Focus#! for 2 years\n- #V +25#! weekly innovation\n- #N Cannot be used again until the modifier expires#!"

 gw_war_propaganda_button:0 "$gw_war_propaganda_decision$"
 gw_war_propaganda_button_desc:0 "$gw_war_propaganda_decision_desc$"
 gw_wartime_rationing_button:0 "$gw_wartime_rationing_decision$"
 gw_wartime_rationing_button_desc:0 "$gw_wartime_rationing_decision_desc$"
 gw_suppressing_dissent_button:0 "$gw_suppressing_dissent_decision$"
 gw_suppressing_dissent_button_desc:0 "$gw_suppressing_dissent_decision_desc$"
 gw_wartime_research_button:0 "$gw_wartime_research_decision$"
 gw_wartime_research_button_desc:0 "$gw_wartime_research_decision_desc$"
 gw_wartime_button_at_war_tt:0 "We are at war"
 gw_war_propaganda_available_tt:0 "War Propaganda is not already active"
 gw_wartime_rationing_available_tt:0 "Wartime Rationing is not already active"
 gw_suppressing_dissent_available_tt:0 "Anti-war dissent is not already being suppressed"
 gw_wartime_research_available_tt:0 "Wartime Research Focus is not already active"

 # --- League Membership Decisions ---
 gw_leave_league_decision:0 "Withdraw from the League of Nations"
 gw_leave_league_decision_desc:0 "Our nation shall withdraw from the League of Nations and its obligations. This will damage our international standing and incur infamy for breaking our commitments.\n\n#bold We shall lose all League membership bonuses and face international pressure.#!"
 gw_leave_league_button:0 "Withdraw from the League"
 gw_leave_league_button_desc:0 "Withdraw from the League of Nations and accept the diplomatic consequences."
 gw_leave_league_effect_tt:0 "We will leave the League, gain infamy, and be unable to rejoin for 5 years."
 gw_leave_league_cooldown_tooltip:0 "Cannot rejoin the League for 5 years after withdrawal"
 gw_congress_expelled_tooltip:0 "Expelled by League Congress vote — barred from rejoining while the expulsion stands"

 # ============================================================
 # MODIFIER NAMES
 # ============================================================

 gw_geneva_convention_member:1 "Geneva Convention Member"
 gw_geneva_convention_member_desc:0 "A signatory to the Geneva Convention benefits from international legal exchange, but accepts stricter scrutiny when pursuing coercive diplomacy."
 gw_peace_dividend:1 "Peace Dividend"
 gw_growing_tensions:1 "Growing Tensions"
 gw_high_tension:1 "High International Tension"
 gw_explosive_tension:1 "Powder Keg"
 gw_critical_tension:1 "Critical Tension"
 gw_critical_tension_desc:0 "The international order stands at the edge of catastrophe. The Central Powers leader may now issue the Call to War — the General Staffs have stopped denying that mobilisation timetables exist."
 gw_humanitarian_concern:1 "Humanitarian Concern"
 gw_humanitarian_concern_desc:0 "Public conscience has stirred against the conduct of distant wars. Reformers, missionaries, and the popular press have made cruelty a political question."
 gw_humanitarian_credentials:1 "Humanitarian Credentials"
 gw_humanitarian_credentials_desc:0 "Our delegations sit at the conferences of the Red Cross and the peace societies. The reputation costs of foreign adventure now travel further than the gunsmoke."
 gw_geneva_pioneer:1 "Geneva Pioneer"
 gw_geneva_pioneer_desc:0 "We are counted among the founding voices of the humanitarian order. Other powers look to our jurists when they want to know what civilised conduct in war means."
 gw_convention_critic:1 "Critic of Conventions"
 gw_convention_critic_desc:0 "Our officials have dismissed the humanitarian conferences as a foreign sentimentality. Public confidence is held — but the technical missions that follow such conferences pass us by."
 gw_war_apologist:1 "Defender of Soldiers"
 gw_war_apologist_desc:0 "Press and pulpit defend the army from foreign criticism. The mood is robust at home; abroad, our specialists find fewer doors open, and our migration appeal narrows."

 # --- Arms Race Chain Modifiers ---
 gw_naval_estimates:1 "Naval Estimates Passed"
 gw_naval_estimates_desc:0 "The legislature has voted through an unprecedented naval programme. Yards are tooling up, orders are out, and the foreign attaches have begun counting keels."
 gw_grand_manoeuvres:1 "Grand Manoeuvres"
 gw_grand_manoeuvres_desc:0 "Tens of thousands of reservists have spent the autumn under canvas. The General Staff has its data; the foreign observers, theirs."
 gw_industrial_expansion_orders:1 "Defence Industry Expansion"
 gw_industrial_expansion_orders_desc:0 "Long-term contracts have been awarded across the arms, artillery, and munition trades. New shops are under construction; existing lines run double shifts."
 gw_conscription_reform:1 "Conscription Reform"
 gw_conscription_reform_desc:0 "The new statute extends service obligations and broadens the manpower base. The reservist rolls have lengthened, and the schools of the General Staff are crowded."
 gw_arms_race_followers:1 "Arms Race — Followers"
 gw_arms_race_followers_desc:0 "Our staff, unwilling to be left behind by the bloc leader's programme, have quietly matched part of the buildup."
 gw_dominating_world_order:1 "Dominating the World Order"
 gw_central_powers_leader:1 "Central Powers Leader"
 gw_allied_powers_leader:1 "Allied Powers Leader"
