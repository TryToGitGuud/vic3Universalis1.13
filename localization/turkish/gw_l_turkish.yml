 je_gw_great_war:0 "Büyük Savaş"
 je_gw_great_war_desc:0 "Bir Büyük Savaş sürmektedir. Cepheyi koruyun, ulusal hoşnutsuzluğu dizginleyin ve barışa kadar dayanın."
 je_gw_great_war_reason:0 "Uluslararası düzeni yeniden şekillendirmek üzere bir Büyük Savaş sürmektedir ve milletimiz buna taraftır.\n\n#header Cephe Gerisi:#!\nUlusal Destek yüksek başlar ve #N Ulusal Hoşnutsuzluk#! yükseldikçe düşer. Yukarıdaki denge, cephe gerisinin savaş çabasını hâlâ destekleyip desteklemediğini, yoksa huzursuzluğa mı kaydığını gösterir.\n\n#header Destek Seviyeleri:#!\n- #V %80-100#!: destek coşkulu kalır\n- #bold %60-79#!: destek gerilmiştir\n- #N %40-59#!: ülke savaştan bitkindir\n- #N %20-39#!: cephe gerisi kırılma noktasındadır\n- #N %0-19#!: kriz olayları başlayabilir\n- #N %0#!: isyan veya çöküş izleyebilir\n\n#header Başlıca Nedenler:#!\nHoşnutsuzluk; radikal nüfus, biriken kayıplar, savaş zamanı karneleri ve cephe gerisinin uzayan yorgunluğundan yükselir.\n\n#header Tepkiler:#!\n- #V Savaş Propagandası#! hoşnutsuzluğu mütevazi düzeyde düşürür ve savaş desteğini artırır\n- #V Muhalefeti Bastır#! hoşnutsuzluğu sert biçimde azaltır ama radikalleri ateşler\n- #V Savaş Zamanı Karnesi#! askerî maliyetleri hafifletir, huzursuzluğu kötüleştirir\n- #V Askerî Araştırma Odağı#! savaş çabasını daha mütevazi bir hızla güçlendirir\n\n#header Uzlaşma:#!\nKesin bir barış bir blokun üstün gelmesiyle, belirsiz bir uzlaşma ise açık galip olmaksızın savaşın sonuyla noktalanır."

 gw_great_war_ended:0 "Büyük Savaş Sona Ermiştir"
 gw_great_war_dp_name:0 "Büyük Savaş"

