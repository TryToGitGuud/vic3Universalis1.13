 # ============================================================
 # GENEVA CONVENTION & LEAGUE OF NATIONS
 # ============================================================

 je_gw_geneva_convention:0 "Geneva Convention"
 je_gw_geneva_convention_desc:0 "We should consider joining the international convention concluded in Geneva, on the protection of civilians and war victims. With the expansion of the treaty, we could also establish an international organization."
 je_gw_geneva_convention_reason:0 "$je_gw_geneva_convention_desc$\nGreat Powers joined: [JournalEntry.CalcCurrentGoalValue|V|0]/[JournalEntry.GetGoalAddValue|V|0]\n\n#header Accession Effects:#!\n@innovation! #P +10%#! Society Technology Spread\n@infamy! #N +10%#! Infamy Generation\n@maneuvers! #N -10%#! Diplomatic Play Maneuvers"
 gw_geneva_4_great_powers:0 "At least 4 Great Powers have joined the Convention"
 gw_geneva_year_1900:0 "The year is 1900 or later"
 gw_je_geneva_member:0 "#V We have joined the Convention#!"
 gw_je_geneva_not_member:0 "#N We have not yet joined the Convention#!"

 gw_join_geneva_convention:0 "Join the Geneva Convention"
 gw_join_geneva_convention_desc:0 "Our nation will accede to the Geneva Convention, committing to the protection of civilians and prisoners of war."
 gw_join_geneva_convention_button:0 "Join the Geneva Convention"
 gw_join_geneva_convention_button_desc:0 "Accede to the Geneva Convention and accept its diplomatic obligations."
 gw_join_geneva_convention_effect_tt:0 "We will become a signatory of the Geneva Convention."
 gw_join_geneva_not_at_war_tt:0 "We must be at peace"
 gw_geneva_human_rights_tt:0 "We must have researched Human Rights"
 gw_join_league_decision:0 "Join the League of Nations"
 gw_join_league_decision_desc:0 "Our nation will accede to the League of Nations and accept its diplomatic framework."
 gw_join_league_button:0 "Join the League of Nations"
 gw_join_league_button_desc:0 "Accede to the League of Nations and accept its diplomatic framework."
 gw_join_league_effect_tt:0 "We will become a member of the League of Nations."

 je_gw_league_of_nations:0 "League of Nations"
 je_gw_league_of_nations_desc:0 "The League of Nations is an international organization working to preserve peace and reduce world tension."
 je_gw_league_of_nations_reason:0 "Headquarters: [ROOT.GetCountry.GetCustom('GetGWLeagueHQ')]\nPermanent Members: [ROOT.GetCountry.GetCustom('GetGWLeaguePermanentMembers')]\nTotal Members: [JournalEntry.CalcCurrentGoalValue|V|0]\n\n#header Membership Benefits:#!\n@money! #V +5%#! Trade Competitiveness\n@influence! #V +5%#! Influence\n@prestige! #V +3%#! Prestige\n@maneuvers! Permanent Members receive additional #V influence#!, #V prestige#!, and #V maneuvers#!\n\n#header Non-Members:#!\n@prestige! #N -3%#! Prestige\n@money! #N -3%#! Trade Competitiveness from isolation"
 gw_je_league_permanent_member:0 "#V We are a Permanent Member of the League of Nations#!"
 gw_je_league_member:0 "#V We are a member of the League of Nations#!"
 gw_je_league_not_member:0 "#N We are not a member of the League of Nations#!"
 je_gw_congress_session:0 "League Congress"
 je_gw_congress_session_desc:0 "The League Congress is in session. Delegations of the leading member powers are recording their votes on the present motion."
 je_gw_congress_session_reason:0 "Motion: [ROOT.GetCountry.GetCustom('GetGWCongressMotionName')]\nCalled by: [ROOT.GetCountry.GetCustom('GetGWCongressInitiatorName')]\nTarget: [ROOT.GetCountry.GetCustom('GetGWCongressTargetName')]\nTime Elapsed: [GetGlobalVariable('gw_congress_months_active').GetValue|0]/3 months\nRequired Support: [ROOT.GetCountry.GetCustom('GetGWCongressThreshold')]\nEligible Delegates: [GetGlobalVariable('gw_congress_eligible_total').GetValue|0]\n\n#header Support: [GetGlobalVariable('gw_congress_support_total').GetValue|0] Prestige#!\n[ROOT.GetCountry.GetCustom('GetGWCongressSupportList')]\n\n#header Oppose: [GetGlobalVariable('gw_congress_oppose_total').GetValue|0] Prestige#!\n[ROOT.GetCountry.GetCustom('GetGWCongressOpposeList')]\n\n#header Abstain: [GetGlobalVariable('gw_congress_abstain_total').GetValue|0] Prestige#!\n[ROOT.GetCountry.GetCustom('GetGWCongressAbstainList')]\n\nCurrent Result: [JournalEntry.CalcCurrentGoalValue|0] / [JournalEntry.GetGoalAddValue|0] active prestige supports the motion."

 gw_geneva.1.t:0 "The League of Nations is Founded"
 gw_geneva.1.d:0 "As more and more nations have acceded to the Geneva Convention, the Great Powers have resolved to establish a joint international organization dedicated to preserving peace, reducing armaments, and settling disputes through diplomacy. With [ROOT.GetCountry.GetCustom('GetGWLeaguePermanentMembers')] serving as its first Permanent Members, the League of Nations has been officially proclaimed."
 gw_geneva.1.f:0 "The Great Powers proclaim that this institution shall ensure the last Great War was indeed the war to end all wars."
 gw_geneva.1.a:0 "One may hope so."
 gw_geneva.2.t:0 "A Permanent Seat Confirmed"
 gw_geneva.2.d:0 "Our delegation has been granted one of the first Permanent Seats in the League of Nations. This standing marks us as one of the principal guardians of the new diplomatic order."
 gw_geneva.2.f:0 "Prestige now bears a constitutional form."
 gw_geneva.2.a:0 "We shall discharge this duty with dignity."

 # --- Geneva Convention Event Chain (tension 40 / 50 / 60) ---
 gw_geneva.10.t:0 "Industrial Wars in the Press"
 gw_geneva.10.d:0 "The illustrated weeklies have brought the colonial expeditions home in a way that the official communiqués never intended. Photographs of burnt villages and rows of wounded men, accompanied by sermons from missionary societies and editorials from the peace leagues, ask whether the conduct of war must remain a private matter of governments. A petition signed by physicians, clergy, and reformers calls upon the Great Powers to negotiate a binding humanitarian convention."
 gw_geneva.10.f:0 "A question the chancelleries had hoped to defer."
 gw_geneva.10.a:0 "Endorse the appeal — we will lend our name to humane reform."
 gw_geneva.10.b:0 "Dismiss it — foreign sentimentality has no place in our policy."

 gw_geneva.11.t:0 "The Red Cross Petition"
 gw_geneva.11.d:0 "An international congress of medical societies — convened under the banner of the Red Cross — has formally addressed the Great Powers, requesting that each appoint a delegate to a humanitarian conference. The conveners are not amateurs: they include serving military surgeons, former officers, and respected jurists. They have framed their demand in the cold language of treaty law, and they have the support of much of the educated press."
 gw_geneva.11.f:0 "The petition cannot be answered with silence."
 gw_geneva.11.a:0 "Send a delegate — the matter merits serious consideration."
 gw_geneva.11.b:0 "Decline officially — we will not subordinate military policy to a foreign committee."

 gw_geneva.12.t:0 "Atrocities Revealed"
 gw_geneva.12.d:0 "Documents smuggled out of the recent campaigns — verified, cross-checked, and published in three languages — have removed any plausible defence for our previous reticence. A select committee of the foreign legislatures has begun its own inquiry. The humanitarian conference, once a diplomatic curiosity, is now the centre of European political attention. Our position is awaited."
 gw_geneva.12.f:0 "The matter has slipped beyond the back rooms."
 gw_geneva.12.a:0 "Champion the Convention — we shall lead the humanitarian framework."
 gw_geneva.12.b:0 "Defend our soldiers — the army shall not be tried in foreign newspapers."

