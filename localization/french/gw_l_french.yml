 # --- Geneva Post-War ---
 gw_geneva_post_great_war:0 "A Great War has been fought and concluded"

 # --- Soft Historical Events ---
 gw_hist.1001.t:0 "Naval Estimates Before the House"
 gw_hist.1001.d:0 "New estimates for the fleet arrive under heavy seal. Admirals speak in careful figures, but every column points to the same conclusion: a rival navy is no longer a distant concern."
 gw_hist.1001.f:0 "Steel, coal, and prestige now share the same ledger."
 gw_hist.1001.a:0 "Approve the naval estimates."
 gw_hist.1001.b:0 "Seek limits before the race becomes policy."
 gw_hist_1001_a_tt:0 "#header Effects:#!\n- Gains #bold Naval Estimates#! for #V 12 months#!"
 gw_hist_1001_b_tt:0 "#header Effects:#!\n- Gains #bold Last Conference Spirit#! for #V 9 months#!\n- #V World Tension decreases by 1#!"

 gw_hist.1002.t:0 "A Flashpoint in the Balkans"
 gw_hist.1002.d:0 "Reports from the peninsula carry the same uneasy rhythm: petitions, officers, border patrols, denials. No cabinet wants a general war, but none wishes to look away first."
 gw_hist.1002.f:0 "The map is quiet only from a distance."
 gw_hist.1002.a:0 "Ready the frontier commands."
 gw_hist.1002.b:0 "Send quiet instructions to the embassies."
 gw_hist_1002_a_tt:0 "#header Effects:#!\n- Gains #bold War Entry Preparations#! for #V 9 months#!"
 gw_hist_1002_b_tt:0 "#header Effects:#!\n- Gains #bold Backchannel Diplomacy#! for #V 9 months#!\n- #V World Tension decreases by 1#!"

 gw_hist.1003.t:0 "Belgian Neutrality Discussed"
 gw_hist.1003.d:0 "A small country sits across the shortest road between larger ambitions. Treaties promise neutrality; war plans test how strongly such promises are remembered."
 gw_hist.1003.f:0 "Some guarantees are signed in ink and measured in mobilization timetables."
 gw_hist.1003.a:0 "Reaffirm the guarantee."
 gw_hist.1003.b:0 "Keep every road under study."
 gw_hist_1003_a_tt:0 "#header Effects:#!\n- Gains #bold Neutrality Guarantee#! for #V 12 months#!\n- #V World Tension decreases by 1#!"
 gw_hist_1003_b_tt:0 "#header Effects:#!\n- Gains #bold Secret War Promises#! for #V 9 months#!"

 gw_hist.1004.t:0 "The July Note"
 gw_hist.1004.d:0 "A note is drafted in language meant to be accepted only by the frightened or the isolated. Around it, allies ask for firmness, ministers ask for time, and the press asks for blood."
 gw_hist.1004.f:0 "There are sentences that sound like diplomacy until the guns answer."
 gw_hist.1004.a:0 "Send the hard note."
 gw_hist.1004.b:0 "Leave a door for mediation."
 gw_hist_1004_a_tt:0 "#header Effects:#!\n- Gains #bold Secret War Promises#! for #V 12 months#!"
 gw_hist_1004_b_tt:0 "#header Effects:#!\n- Gains #bold Backchannel Diplomacy#! for #V 12 months#!\n- #V World Tension decreases by 2#!"

 gw_hist.1005.t:0 "Neutral Rights at Sea"
 gw_hist.1005.d:0 "Insurers, shipowners, and consuls crowd the same antechambers. If war comes, neutral flags may protect commerce, or merely mark it for inspection."
 gw_hist.1005.f:0 "A cargo manifest can become a diplomatic incident."
 gw_hist.1005.a:0 "Prepare to defend our rights."
 gw_hist.1005.b:0 "Keep commerce distant from the quarrel."
 gw_hist_1005_a_tt:0 "#header Effects:#!\n- Gains #bold Neutral Pressure#! for #V 9 months#!"
 gw_hist_1005_b_tt:0 "#header Effects:#!\n- Gains #bold Neutrality Guarantee#! for #V 9 months#!\n- #V World Tension decreases by 1#!"

 gw_hist.1006.t:0 "The Last Week of Peace"
 gw_hist.1006.d:0 "Railway offices stay lit after midnight. Telegrams arrive faster than ministers can answer them. Everyone still speaks of peace, but the machinery of war has begun to move."
 gw_hist.1006.f:0 "At the end, the silence is administrative."
 gw_hist.1006.a:0 "Place the armies on notice."
 gw_hist.1006.b:0 "Make one last appeal."
 gw_hist_1006_a_tt:0 "#header Effects:#!\n- Gains #bold War Entry Preparations#! for #V 12 months#!"
 gw_hist_1006_b_tt:0 "#header Effects:#!\n- Gains #bold Last Conference Spirit#! for #V 12 months#!\n- #V World Tension decreases by 2#!"

 gw_hist.2001.t:0 "Belgium Between the Roads"
 gw_hist.2001.d:0 "War plans drawn elsewhere now point toward our frontiers. Neutrality remains our law, but every ambassador asks what we will do when armies stop asking permission."
 gw_hist.2001.f:0 "A treaty is strongest before it is tested."
 gw_hist.2001.a:0 "Stand on our neutrality."
 gw_hist.2001.b:0 "Prepare to resist with the defenders."
 gw_hist_2001_a_tt:0 "#header Effects:#!\n- Gains #bold Neutrality Guarantee#! for #V 12 months#!\n- #V World Tension decreases by 1#!"
 gw_hist_2001_b_tt:0 "#header Effects:#!\n- Shifts alignment toward the #bold Allied Powers#!\n- Gains #bold War Entry Preparations#! for #V 12 months#!"

 gw_hist.2002.t:0 "The Cabinet and the Channel"
 gw_hist.2002.d:0 "The fleet is ready, the cabinet divided, and the newspapers already speak of the balance of Europe. The question is whether the war can remain continental if the Channel is threatened."
 gw_hist.2002.f:0 "An island may still be bound to the fate of the mainland."
 gw_hist.2002.a:0 "Keep the cabinet in reserve."
 gw_hist.2002.b:0 "Stand with the threatened order."
 gw_hist_2002_a_tt:0 "#header Effects:#!\n- Gains #bold Neutral Pressure#! for #V 9 months#!"
 gw_hist_2002_b_tt:0 "#header Effects:#!\n- Shifts alignment toward the #bold Allied Powers#!\n- Gains #bold War Entry Preparations#! for #V 12 months#!"

 gw_hist.2003.t:0 "The Porte Weighs the War"
 gw_hist.2003.d:0 "Envoys speak of loans, guns, railways, and lost provinces. To remain apart may preserve the state; to choose well may restore its place among the powers."
 gw_hist.2003.f:0 "Old empires know the price of waiting."
 gw_hist.2003.a:0 "Preserve our freedom of action."
 gw_hist.2003.b:0 "Seek terms with the Central Powers."
 gw_hist.2003.c:0 "Open channels to the Allied Powers."
 gw_hist_2003_a_tt:0 "#header Effects:#!\n- Gains #bold Neutrality Guarantee#! for #V 9 months#!"
 gw_hist_2003_b_tt:0 "#header Effects:#!\n- Shifts alignment toward the #bold Central Powers#!\n- Gains #bold Secret War Promises#! for #V 12 months#!"
 gw_hist_2003_c_tt:0 "#header Effects:#!\n- Shifts alignment toward the #bold Allied Powers#!\n- Gains #bold War Entry Preparations#! for #V 9 months#!"

 gw_hist.2004.t:0 "Italy Counts the Promises"
 gw_hist.2004.d:0 "Maps are unfolded behind closed doors. Every frontier has an argument, every ally has a memory, and every promise is written to mean more later than it says today."
 gw_hist.2004.f:0 "Neutrality can be a position, or a price."
 gw_hist.2004.a:0 "Wait for firmer offers."
 gw_hist.2004.b:0 "Lean toward the Allied cause."
 gw_hist.2004.c:0 "Honor the Central understanding."
 gw_hist_2004_a_tt:0 "#header Effects:#!\n- Gains #bold Secret War Promises#! for #V 9 months#!"
 gw_hist_2004_b_tt:0 "#header Effects:#!\n- Shifts alignment toward the #bold Allied Powers#!\n- Gains #bold Secret War Promises#! for #V 12 months#!"
 gw_hist_2004_c_tt:0 "#header Effects:#!\n- Shifts alignment toward the #bold Central Powers#!\n- Gains #bold War Entry Preparations#! for #V 12 months#!"

 gw_hist.2005.t:0 "Japan Studies the Sea Lanes"
 gw_hist.2005.d:0 "The conflict may be born in Europe, but coaling stations, leased ports, and sea lanes make it a global calculation. Opportunity wears a naval uniform."
 gw_hist.2005.f:0 "Distance is shorter on a chart."
 gw_hist.2005.a:0 "Watch the situation from port."
 gw_hist.2005.b:0 "Prepare to move with the Allies."
 gw_hist_2005_a_tt:0 "#header Effects:#!\n- Gains #bold Neutrality Guarantee#! for #V 9 months#!"
 gw_hist_2005_b_tt:0 "#header Effects:#!\n- Shifts alignment toward the #bold Allied Powers#!\n- Gains #bold War Entry Preparations#! for #V 12 months#!"

 gw_hist.2006.t:0 "Romania Between Frontiers"
 gw_hist.2006.d:0 "Every frontier points to a different future. The general staff asks which promise will matter when the first campaign is over, not when the first speeches are made."
 gw_hist.2006.f:0 "A small hesitation can decide a large border."
 gw_hist.2006.a:0 "Keep the offers alive."
 gw_hist.2006.b:0 "Prepare with the Allied Powers."
 gw_hist_2006_a_tt:0 "#header Effects:#!\n- Gains #bold Secret War Promises#! for #V 9 months#!"
 gw_hist_2006_b_tt:0 "#header Effects:#!\n- Shifts alignment toward the #bold Allied Powers#!\n- Gains #bold War Entry Preparations#! for #V 12 months#!"

 gw_hist.2007.t:0 "Bulgaria's Reckoning"
 gw_hist.2007.d:0 "The last wars left debts unpaid and borders contested. Ministers know that revenge is a dangerous adviser, but it is also a persuasive one."
 gw_hist.2007.f:0 "The old maps have not been put away."
 gw_hist.2007.a:0 "Wait for the stronger bargain."
 gw_hist.2007.b:0 "Prepare with the Central Powers."
 gw_hist_2007_a_tt:0 "#header Effects:#!\n- Gains #bold Secret War Promises#! for #V 9 months#!"
 gw_hist_2007_b_tt:0 "#header Effects:#!\n- Shifts alignment toward the #bold Central Powers#!\n- Gains #bold War Entry Preparations#! for #V 12 months#!"

 gw_hist.2008.t:0 "Across the Atlantic"
 gw_hist.2008.d:0 "The war is distant in miles and near in finance, shipping, and public opinion. Neutrality is still policy, but events have begun to define it for us."
 gw_hist.2008.f:0 "Oceans delay decisions; they do not remove them."
 gw_hist.2008.a:0 "Defend neutrality in law and trade."
 gw_hist.2008.b:0 "Tilt our diplomacy toward the Allied Powers."
 gw_hist_2008_a_tt:0 "#header Effects:#!\n- Gains #bold Neutrality Guarantee#! for #V 12 months#!\n- #V World Tension decreases by 1#!"
 gw_hist_2008_b_tt:0 "#header Effects:#!\n- Shifts alignment toward the #bold Allied Powers#!\n- Gains #bold Neutral Pressure#! for #V 12 months#!"

 gw_hist.2009.t:0 "Labor Diplomacy"
 gw_hist.2009.d:0 "Foreign missions ask for workers, supplies, and quiet cooperation. The war may be fought elsewhere, but its contracts reach into our ports and ministries."
 gw_hist.2009.f:0 "Even neutrality can be mobilized."
 gw_hist.2009.a:0 "Keep assistance commercial."
 gw_hist.2009.b:0 "Offer help through Allied channels."
 gw_hist_2009_a_tt:0 "#header Effects:#!\n- Gains #bold Neutrality Guarantee#! for #V 9 months#!"
 gw_hist_2009_b_tt:0 "#header Effects:#!\n- Shifts alignment toward the #bold Allied Powers#!\n- Gains #bold Secret War Promises#! for #V 12 months#!"

 gw_hist.2010.t:0 "The Smaller Cabinets Decide"
 gw_hist.2010.d:0 "The great powers have spoken loudly enough that even distant capitals must answer. To join, to wait, or to hedge are all decisions with costs."
 gw_hist.2010.f:0 "History rarely asks only the countries that began it."
 gw_hist.2010.a:0 "Stay out for now."
 gw_hist.2010.b:0 "Prepare for the Central Powers."
 gw_hist.2010.c:0 "Prepare for the Allied Powers."
 gw_hist_2010_a_tt:0 "#header Effects:#!\n- Gains #bold Neutral Pressure#! for #V 9 months#!"
 gw_hist_2010_b_tt:0 "#header Effects:#!\n- Shifts alignment toward the #bold Central Powers#!\n- Gains #bold War Entry Preparations#! for #V 9 months#!"
 gw_hist_2010_c_tt:0 "#header Effects:#!\n- Shifts alignment toward the #bold Allied Powers#!\n- Gains #bold War Entry Preparations#! for #V 9 months#!"

 gw_hist.3001.t:0 "The Victors' Table"
 gw_hist.3001.d:0 "The guns are quiet, but the delegations are not. Victory has brought maps, petitions, debts, and a question no parade can answer: what kind of peace can survive victory?"
 gw_hist.3001.f:0 "Every settlement begins as a room full of exhausted men."
 gw_hist.3001.a:0 "Shape the peace carefully."
 gw_hist_3001_a_tt:0 "#header Effects:#!\n- Gains #bold Last Conference Spirit#! for #V 12 months#!"

 gw_hist.3002.t:0 "The Defeated Delegation"
 gw_hist.3002.d:0 "The delegation arrives without bands or banners. They are expected to sign, to explain, and to carry home a peace their country will study with bitterness."
 gw_hist.3002.f:0 "Defeat has many authors and few volunteers."
 gw_hist.3002.a:0 "Accept the terms and rebuild."
 gw_hist.3002.b:0 "Preserve the claims for another day."
 gw_hist_3002_a_tt:0 "#header Effects:#!\n- Gains #bold Neutral Pressure#! for #V 12 months#!"
 gw_hist_3002_b_tt:0 "#header Effects:#!\n- Gains #bold Secret War Promises#! for #V 12 months#!"

 gw_hist.3003.t:0 "Neutral Observers"
 gw_hist.3003.d:0 "Neutral envoys study the settlement with professional calm. The lesson is not that peace is simple, but that the next war may begin in the clauses written today."
 gw_hist.3003.f:0 "To stand aside is still to take notes."
 gw_hist.3003.a:0 "Support a stable settlement."
 gw_hist.3003.b:0 "Guard our independence from the victors."
 gw_hist_3003_a_tt:0 "#header Effects:#!\n- Gains #bold Neutrality Guarantee#! for #V 12 months#!"
 gw_hist_3003_b_tt:0 "#header Effects:#!\n- Gains #bold Neutral Pressure#! for #V 9 months#!"

 gw_hist.3004.t:0 "The Settlement Debated"
 gw_hist.3004.d:0 "No one can claim a clean triumph. The peace preserves the old order in public, but every chancery knows the old assumptions have been wounded."
 gw_hist.3004.f:0 "A draw can still change the century."
 gw_hist.3004.a:0 "Defend the compromise."
 gw_hist.3004.b:0 "Question the terms openly."
 gw_hist_3004_a_tt:0 "#header Effects:#!\n- Gains #bold Last Conference Spirit#! for #V 12 months#!"
 gw_hist_3004_b_tt:0 "#header Effects:#!\n- Gains #bold Neutral Pressure#! for #V 9 months#!"

