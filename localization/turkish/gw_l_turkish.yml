 concept_gw_tier_crisis_desc:0 "Dünya Gerginliği #N %80'e#! ulaştığında, Büyük Güçler şunları kazanır:\n- #N +50#! diplomatik manevra\n\n[concept_gw_central_powers] lideri [concept_gw_great_war]'ı başlatabilir."

