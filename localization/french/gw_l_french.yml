 je_gw_alignment:0 "Great Power Alignment"
 je_gw_alignment_desc:0 "As world politics harden into rival blocs, our government may declare its diplomatic stance before a Great War begins."
 je_gw_alignment_reason:0 "#bold Current Stance#!\n[ROOT.GetCountry.GetCustom('GetGWAlignmentStatus')]\n\n#bold Hybrid Alignment Probability#!\nThese probabilities combine world-order satisfaction, diplomatic treaties, relations, attitudes, political lobbies, and military security. They are also used as the basis for AI choices during Call to War.\n[concept_gw_allied_powers]: #V [ROOT.GetCountry.MakeScope.ScriptValue('gw_hybrid_alignment_allied_probability')|0]%#!\n[concept_gw_central_powers]: #N [ROOT.GetCountry.MakeScope.ScriptValue('gw_hybrid_alignment_central_probability')|0]%#!\nNeutrality: #bold [ROOT.GetCountry.MakeScope.ScriptValue('gw_hybrid_alignment_neutral_probability')|0]%#!\n\n#bold Bloc Leaders#!\n[concept_gw_allied_powers]: [ROOT.GetCountry.GetCustom('GetGWAlliedLeaderName')]\n[concept_gw_central_powers]: [ROOT.GetCountry.GetCustom('GetGWCentralLeaderName')]\n\n#bold Diplomatic Position#!\nA country will only change its peacetime bloc leaning when one side has a clear advantage. Declaring neutrality removes us from both blocs, but limits our freedom to change course for a time.\n\n#bold Current Blocs#!\nThis list shows up to four leading Great/Major Powers currently written into the mod's global bloc records.\n[concept_gw_allied_powers] (#v [GetGlobalVariable('gw_allied_members_count').GetValue|0]#!): [ROOT.GetCountry.GetCustom('GetGWAlliedList')]\n\n[concept_gw_central_powers] (#v [GetGlobalVariable('gw_central_members_count').GetValue|0]#!): [ROOT.GetCountry.GetCustom('GetGWCentralList')]\n\nNeutral Powers (#v [GetGlobalVariable('gw_neutral_members_count').GetValue|0]#!): [ROOT.GetCountry.GetCustom('GetGWNeutralList')]"
