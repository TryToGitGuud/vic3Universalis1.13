 # --- Material Tension Events ---
 gw_crisis.4101.t:0 "Cephanelik Kontratları"
 gw_crisis.4101.d:0 "Silah firmaları kabine istemeden önce tahminleriyle geliyor. Yedek stoklardan, teslimat pencerelerinden ve kriz dönünce boş depolarla karşılaşma tehlikesinden söz ediyorlar."
 gw_crisis.4101.f:0 "Barışta sipariş edilen tüfek, savaşta da ateşlenir."
 gw_crisis.4101.a:0 "Fiyatlar yükselmeden kontratları verin."
 gw_crisis.4101.b:0 "Siparişleri barış bütçesi içinde tutun."
 gw_crisis_4101_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Cephanelik Kontratları#! kazanır"
 gw_crisis_4101_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Son Barış Bütçesi#! kazanır\n- Bir Büyük Savaş blokuna liderlik ediyorsak, #V Dünya Gerginliği 1 azalır#!"

 gw_crisis.4102.t:0 "Donanma Tahsisatı"
 gw_crisis.4102.d:0 "Donanma henüz kızağa konmamış tekneler, henüz yapılmamış motorlar ve henüz yetiştirilmemiş mürettebatlar istiyor. Her rakip tersane bize karşı verilmiş bir vaat olarak görülüyor."
 gw_crisis.4102.f:0 "Deniz gücü, toplar yerleştirilmeden çok önce çelikle sayılır."
 gw_crisis.4102.a:0 "Genişletilmiş tahsisatı onaylayın."
 gw_crisis.4102.b:0 "Hava yumuşayana kadar filotillayı erteleyin."
 gw_crisis_4102_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Donanma Tahsisatı#! kazanır"
 gw_crisis_4102_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Son Barış Bütçesi#! kazanır\n- Bir Büyük Savaş blokuna liderlik ediyorsak, #V Dünya Gerginliği 1 azalır#!"

 gw_crisis.4103.t:0 "Harp Akademisi Muhtıraları"
 gw_crisis.4103.d:0 "Genelkurmay kırmızı kenarlı, imzasız muhtıralar dolaştırmaya başladı. Savaş çağrısı yapmıyorlar; sadece savaşa geç kalmanın dezavantajlarını anlatıyorlar."
 gw_crisis.4103.f:0 "Bir tarife, bir tartışma olabilir."
 gw_crisis.4103.a:0 "Genelkurmay tatbikatlarını finanse edin."
 gw_crisis.4103.b:0 "Muhtıraları sivil incelemeye yollayın."
 gw_crisis_4103_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Harp Akademisi Muhtıraları#! kazanır"
 gw_crisis_4103_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Gizli Diplomasi#! kazanır\n- Bir Büyük Savaş blokuna liderlik ediyorsak, #V Dünya Gerginliği 1 azalır#!"

 gw_crisis.4104.t:0 "Savaş Sigortası"
 gw_crisis.4104.d:0 "Sigortacılar söylentiyi kargo gibi muamele etmeye başladı. Primler her nutukla yükseliyor ve tüccarlar haritada hâlâ güvenli görünen seferleri devletin garanti edip etmeyeceğini soruyor."
 gw_crisis.4104.f:0 "Pazarlar topları ordulardan önce duyar."
 gw_crisis.4104.a:0 "Uyarı yerinde dursun."
 gw_crisis.4104.b:0 "Armatörleri özel kanallardan teskin edin."
 gw_crisis_4104_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Savaş Sigortası#! kazanır"
 gw_crisis_4104_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Son Konferans Ruhu#! kazanır\n- Bir Büyük Savaş blokuna liderlik ediyorsak, #V Dünya Gerginliği 1 azalır#!"

 gw_crisis.4105.t:0 "Ekmek ve Barut"
 gw_crisis.4105.d:0 "Levazım subayları aynı nefeste barut ve un istiyor. Savaşı haritalarla düşünen nazırlar, şimdi onun somunlar, kömür vagonları ve fabrika vardiyalarıyla ölçüldüğünü görüyor."
 gw_crisis.4105.f:0 "Bir ordu fırıncının ardından, topçunun önünden yürür."
 gw_crisis.4105.a:0 "Tahıl ve patlayıcıyı birlikte yedekleyin."
 gw_crisis.4105.b:0 "Sivil ikmali açıkça öncelikli tutun."
 gw_crisis_4105_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Ekmek ve Barut#! kazanır"
 gw_crisis_4105_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Piyasa Savaş Endişesi#! kazanır\n- Bir Büyük Savaş blokuna liderlik ediyorsak, #V Dünya Gerginliği 1 azalır#!"

 gw_crisis.4106.t:0 "Olağanüstü Krediler"
 gw_crisis.4106.d:0 "Hazine savaştan söz etmeyen bir yasa tasarısı hazırladı, oysa meclisteki herkes ne için olduğunu biliyor. Bir kez açılan kredi, siyaset haline gelmenin bir yolunu bulur."
 gw_crisis.4106.f:0 "Bir bütçe bir alaydan önce seferber olabilir."
 gw_crisis.4106.a:0 "Kredileri açın."
 gw_crisis.4106.b:0 "Bir barış bütçesi daha tutun."
 gw_crisis_4106_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Olağanüstü Krediler#! kazanır"
 gw_crisis_4106_b_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Son Barış Bütçesi#! kazanır\n- Bir Büyük Savaş blokuna liderlik ediyorsak, #V Dünya Gerginliği 2 azalır#!"

 gw_crisis.4107.t:0 "Fabrika Siparişleri"
 gw_crisis.4107.d:0 "Siparişler nezaretlerden fabrika tezgâhlarına mühürlü zarflarla iniyor. Müdürler üretim vaat ediyor; ustabaşılar elleri sayıyor; işçiler hangi vaadin önce kırılacağını merak ediyor."
 gw_crisis.4107.f:0 "Sanayinin kendi seferberliği vardır."
 gw_crisis.4107.a:0 "Kontratları olayların önünden gitsin."
 gw_crisis.4107.b:0 "Siparişleri yavaşlatın ve müzakereye davet edin."
 gw_crisis_4107_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Fabrika Siparişleri#! kazanır"
 gw_crisis_4107_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Silahlanma Sınırlaması Görüşmeleri#! kazanır\n- Bir Büyük Savaş blokuna liderlik ediyorsak, #V Dünya Gerginliği 1 azalır#!"

 gw_crisis.4108.t:0 "Son Barış Bütçesi"
 gw_crisis.4108.d:0 "Kabine masasında iki bütçe duruyor. Biri zaman satın alır. Diğeri hazırlık. Hiçbir nazır gelecekteki tarihçilerin hangisini sorumsuz diye anacağını söylemiyor."
 gw_crisis.4108.f:0 "Barış çoğu zaman fazla küçük görünen rakamlarla savunulur."
 gw_crisis.4108.a:0 "Son barış bütçesini geçirin."
 gw_crisis.4108.b:0 "Cephanelikleri hesaplara katın."
 gw_crisis_4108_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Son Barış Bütçesi#! kazanır\n- Bir Büyük Savaş blokuna liderlik ediyorsak, #V Dünya Gerginliği 2 azalır#!"
 gw_crisis_4108_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Cephanelik Kontratları#! kazanır"

 # --- War Economy and Home Front Events ---
 gw_war.3201.t:0 "Kuyruklara Ekmek"
 gw_war.3201.d:0 "Fırınların önündeki kuyruklar sabah haberlerinden daha uzun. Yerel memurlar tahıl, polis sabır, ordu ise cepheden hiçbir şey alınmamasını istiyor."
 gw_war.3201.f:0 "Cephe gerisinin kendi muharebe hattı vardır."
 gw_war.3201.a:0 "Ekmek arzını koruyun."
 gw_war.3201.b:0 "Ordunun tahsisatına dokunmayın."
 gw_war_3201_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Gıda Güvenliği Tedbirleri#! kazanır\n- #V Ulusal Hoşnutsuzluk 5 azalır#!\n- #N Savaş Desteği 3 azalır#!"
 gw_war_3201_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Ekmek Kuyruğu Huzursuzluğu#! kazanır\n- #N Ulusal Hoşnutsuzluk 4 artar#!\n- #V Savaş Desteği 3 artar#!"

 gw_war.3202.t:0 "Mermi Kontratı"
 gw_war.3202.d:0 "Bir konsorsiyum, devletin olağanüstü fiyatları ve daha az soruyu kabul etmesi halinde tren dolusu mermi vaat ediyor. Cephe imzaları gün batımından önce istiyor."
 gw_war.3202.f:0 "Kıtlık, muhasebecileri stratejiste dönüştürür."
 gw_war.3202.a:0 "Toplar susmadan imzalayın."
 gw_war.3202.b:0 "Önce kontratı denetleyin."
 gw_war_3202_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Mermi Kontratları#! kazanır\n- #N Ulusal Hoşnutsuzluk 3 artar#!\n- #V Savaş Desteği 4 artar#!"
 gw_war_3202_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Uzun Savaş Planlaması#! kazanır\n- #V Ulusal Hoşnutsuzluk 3 azalır#!\n- #N Savaş Desteği 2 azalır#!"

 gw_war.3203.t:0 "Tezgâhlarda Kadınlar"
 gw_war.3203.d:0 "Fabrika kapıları şafaktan önce yeni bir işgücüne açılıyor. Gazeteler onlara vatansever diyor; sendikalar eski kuralların çoktan değiştiğinin kanıtı diyor."
 gw_war.3203.f:0 "Zaruret hızla işe alır."
 gw_war.3203.a:0 "Onları savaş sanayilerine dahil edin."
 gw_war.3203.b:0 "İstisnaları dar ve geçici tutun."
 gw_war_3203_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Savaş Sanayisinde Kadınlar#! kazanır\n- #V Ulusal Hoşnutsuzluk 3 azalır#!\n- #V Savaş Desteği 2 artar#!"
 gw_war_3203_b_tt:0 "#header Etkiler:#!\n- #V Ulusal Hoşnutsuzluk 5 azalır#!\n- #N Savaş Desteği 3 azalır#!"

 gw_war.3204.t:0 "Demiryolları İçin Kömür"
 gw_war.3204.d:0 "Demiryolları asker trenleri, hastaneler, fabrikalar ve şehirler için kömüre ihtiyaç duyuyor. Her tonun bir varış noktası var ve her varış noktası kendini elzem ilan ediyor."
 gw_war.3204.f:0 "Bir demiryolu tarifesi artık bir karne defteridir."
 gw_war.3204.a:0 "Askerî trenlere öncelik verin."
 gw_war.3204.b:0 "Sivil kömürü hareketli tutun."
 gw_war_3204_a_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Demiryolu Önceliği#! kazanır\n- #N Ulusal Hoşnutsuzluk 3 artar#!\n- #V Savaş Desteği 3 artar#!"
 gw_war_3204_b_tt:0 "#header Etkiler:#!\n- #V Ulusal Hoşnutsuzluk 4 azalır#!\n- #N Savaş Desteği 3 azalır#!"

 gw_war.3205.t:0 "Belediye Salonunda Savaş Tahvilleri"
 gw_war.3205.d:0 "Belediye başkanları salonlar, bandolar ve uzun saygın isim listeleri sunuyor. Hazine borç istiyor; ülke ise borç vermenin bir tür hizmet olduğuna inanmak istiyor."
 gw_war.3205.f:0 "Bazı muharebeler küçük paralarla yazılır."
 gw_war.3205.a:0 "Seferberliği medenî bir merasime çevirin."
 gw_war.3205.b:0 "Bankalardan sessizce borçlanın."
 gw_war_3205_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Savaş Tahvili Komiteleri#! kazanır\n- #V Ulusal Hoşnutsuzluk 3 azalır#!\n- #V Savaş Desteği 3 artar#!"
 gw_war_3205_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Olağanüstü Krediler#! kazanır\n- #V Ulusal Hoşnutsuzluk 1 azalır#!"

 gw_war.3206.t:0 "Karaborsa"
 gw_war.3206.d:0 "Karne defterleri ve askerî kontratlar arka odalarda ve tren depolarında ikinci bir ekonomi yarattı. Herkes kınıyor; çok fazlası ise ona bağımlı."
 gw_war.3206.f:0 "Kıtlık kendi kanunlarını yazar."
 gw_war.3206.a:0 "Ağlar sertleşmeden parçalayın."
 gw_war.3206.b:0 "Rafları boş tutmayanı hoşgörün."
 gw_war_3206_a_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Karaborsa Denetimleri#! kazanır\n- #V Ulusal Hoşnutsuzluk 4 azalır#!\n- #N Savaş Desteği 2 azalır#!"
 gw_war_3206_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Karaborsanın Yayılması#! kazanır\n- #N Ulusal Hoşnutsuzluk 4 artar#!"

 gw_war.3207.t:0 "Hastane Trenleri"
 gw_war.3207.d:0 "Yaralılar telgraflardan önce geliyor. Hekimler vagon, hemşire ve cephe ile yurt arasındaki her kavşakta öncelik istiyor."
 gw_war.3207.f:0 "Merhamet de lojistik gerektirir."
 gw_war.3207.a:0 "Hastane trenlerini önceliklendirin."
 gw_war.3207.b:0 "İkmal trenlerini hareketli tutun."
 gw_war_3207_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Hastane Trenleri#! kazanır\n- #V Ulusal Hoşnutsuzluk 6 azalır#!\n- #N Savaş Desteği 3 azalır#!"
 gw_war_3207_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Mühimmat Aşırı Üretimi#! kazanır\n- #N Ulusal Hoşnutsuzluk 2 artar#!\n- #V Savaş Desteği 4 artar#!"

 gw_war.3208.t:0 "Celp Heyetleri"
 gw_war.3208.d:0 "Heyetler portreler ve celp afişleri altında toplanıyor. Her muafiyetin bir adı, her reddedilen başvurunun dışarıda bekleyen bir ailesi var."
 gw_war.3208.f:0 "İnsan gücü kapı kapı sayılır."
 gw_war.3208.a:0 "Kotaları sıkılaştırın."
 gw_war.3208.b:0 "En tartışmalı vakaları erteleyin."
 gw_war_3208_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Celp Heyeti Seferberliği#! kazanır\n- #N Ulusal Hoşnutsuzluk 5 artar#!\n- #V Savaş Desteği 4 artar#!"
 gw_war_3208_b_tt:0 "#header Etkiler:#!\n- #V Ulusal Hoşnutsuzluk 4 azalır#!\n- #N Savaş Desteği 3 azalır#!"

 gw_war.3209.t:0 "Mühimmat Nezareti"
 gw_war.3209.d:0 "Öneri; kontratlar, işgücü, taşımacılık ve fabrika öncelikleri üzerinde yetkili bir nezaret yaratıyor. Bu, topçu gibi bir bürokrasi."
 gw_war.3209.f:0 "Modern savaş yeni nezaretler keşfeder."
 gw_war.3209.a:0 "Nezarete olağanüstü yetki verin."
 gw_war.3209.b:0 "Üretimi yerel ellerde tutun."
 gw_war_3209_a_tt:0 "#header Etkiler:#!\n- #V 18 ay boyunca#! #bold Mühimmat Nezareti#! kazanır\n- #N Ulusal Hoşnutsuzluk 4 artar#!\n- #V Savaş Desteği 4 artar#!"
 gw_war_3209_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Mermi Kontratları#! kazanır\n- #V Ulusal Hoşnutsuzluk 3 azalır#!\n- #N Savaş Desteği 2 azalır#!"

 gw_war.3210.t:0 "Kış Yakıtı"
 gw_war.3210.d:0 "İlk soğuk haftalar her kömür deposunu bir dilekçe muharebesine çeviriyor. Hastaneler, kışlalar, fabrikalar ve apartmanlar — hepsi vazgeçilmez sayılmayı istiyor."
 gw_war.3210.f:0 "Kışın tarafsız bir siyaseti yoktur."
 gw_war.3210.a:0 "Önce orduyu ısıtın."
 gw_war.3210.b:0 "Şehirleri sıcak tutun."
 gw_war_3210_a_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Kış Yakıtı Kıtlığı#! kazanır\n- #N Ulusal Hoşnutsuzluk 5 artar#!\n- #V Savaş Desteği 3 artar#!"
 gw_war_3210_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Gıda Güvenliği Tedbirleri#! kazanır\n- #V Ulusal Hoşnutsuzluk 5 azalır#!\n- #N Savaş Desteği 4 azalır#!"

 gw_war.3211.t:0 "Sansürlü Mektuplar"
 gw_war.3211.d:0 "Sansürcüler mürekkep ve yas dolu odalarda oturuyor. Bir mektuptan kesilen her satır maneviyatı koruyabilir veya sessizliği hakikatten daha ürkütücü hale getirebilir."
 gw_war.3211.f:0 "Boş yer de bir şey söyler."
 gw_war.3211.a:0 "Sansürcünün elini sıkılaştırın."
 gw_war.3211.b:0 "Hakikatin daha fazlasının geçmesine izin verin."
 gw_war_3211_a_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Sansürlü Mektuplar#! kazanır\n- #N Ulusal Hoşnutsuzluk 4 artar#!\n- #V Savaş Desteği 3 artar#!"
 gw_war_3211_b_tt:0 "#header Etkiler:#!\n- #V Ulusal Hoşnutsuzluk 5 azalır#!\n- #N Savaş Desteği 4 azalır#!"

 gw_war.3212.t:0 "Zaferden Önce Gaziler"
 gw_war.3212.d:0 "Gazi birlikler dinlenmeyi, beklemeyi çoktan bıraktıkları sessiz bir resmiyetle istiyor. Karargâh subayları haritalara çizdikleri oklarla cevap veriyor."
 gw_war.3212.f:0 "Tecrübe ile dayanıklılık aynı şey değildir."
 gw_war.3212.a:0 "Gazileri yurda rotasyonla gönderin."
 gw_war.3212.b:0 "Onlardan bir gayret daha isteyin."
 gw_war_3212_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Zaferden Önce Gaziler#! kazanır\n- #V Ulusal Hoşnutsuzluk 7 azalır#!\n- #N Savaş Desteği 3 azalır#!"
 gw_war_3212_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold İlk Savaş Coşkusu#! kazanır\n- #N Ulusal Hoşnutsuzluk 4 artar#!\n- #V Savaş Desteği 4 artar#!"

 gw_war.3213.t:0 "Un Fiyatı"
 gw_war.3213.d:0 "Un fiyatları siyasî habere dönüştü. Fırıncılar değirmenleri, değirmenler nakliyeyi suçluyor; nazırlar ekmeğin bir kalabalığı nutuktan daha hızlı toplayabileceğini öğreniyor."
 gw_war.3213.f:0 "Bir somunun fiyatı, bir hükûmete duyulan güveni ölçebilir."
 gw_war.3213.a:0 "Öfke yayılmadan ekmeği sübvanse edin."
 gw_war.3213.b:0 "Stokları savaş için el koyun."
 gw_war_3213_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Un Yardımı#! kazanır\n- #V Ulusal Hoşnutsuzluk 6 azalır#!\n- #N Savaş Desteği 2 azalır#!"
 gw_war_3213_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Ekmek Kuyruğu Huzursuzluğu#! kazanır\n- #N Ulusal Hoşnutsuzluk 5 artar#!\n- #V Savaş Desteği 4 artar#!"

 gw_war.3214.t:0 "Gece Yarısından Sonra Fabrikalar"
 gw_war.3214.d:0 "Şehir karardıktan çok sonra fabrika lambaları yanmaya devam ediyor. Üretim yükseliyor, sinirler kısalıyor ve gece vardiyası ikinci bir cephe gibi hissediliyor."
 gw_war.3214.f:0 "Savaşın bitiş zili yoktur."
 gw_war.3214.a:0 "Gece vardiyalarını çalıştırmaya devam edin."
 gw_war.3214.b:0 "Disiplin kırılmadan saatleri kısaltın."
 gw_war_3214_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Gece Vardiyası Fabrikaları#! kazanır\n- #N Ulusal Hoşnutsuzluk 5 artar#!\n- #V Savaş Desteği 4 artar#!"
 gw_war_3214_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Cephe Hattı Rahatlatması#! kazanır\n- #V Ulusal Hoşnutsuzluk 5 azalır#!\n- #N Savaş Desteği 3 azalır#!"

