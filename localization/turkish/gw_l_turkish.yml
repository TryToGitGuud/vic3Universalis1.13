 gw_war_propaganda_decision:0 "Savaş Propagandası"
 gw_war_propaganda_decision_desc:0 "Basın, okullar ve umumî alanlar savaş çabasına yöneltilecektir.\n\n#header Etkiler:#!\n- Tüm etkin savaşlarda #V +10#! savaş desteği\n- #bold Savaş Propagandası#! teknolojisi ile bu değer #V +25#!\n- 6 ay boyunca #bold Savaş Propagandası#! uygulanır\n- Modifikatör #V kayıplardan doğan hoşnutsuzluğu mütevazi düzeyde düşürür#!\n- #N Modifikatör süresi dolana kadar tekrar kullanılamaz#!"

 gw_wartime_rationing_decision:0 "Savaş Zamanı Karnesi"
 gw_wartime_rationing_decision_desc:0 "Orduların önce ikmal edilmesi için sivil tüketim kısıtlanacaktır.\n\n#header Etkiler:#!\n- 2 yıl boyunca #bold Savaş Zamanı Karnesi#! uygulanır\n- #V -%20#! askerî maaş ve #V -%20#! seferberlik maliyeti\n- #N Cephe gerisinde hoşnutsuzluğu yükseltir#!\n- Siyasî hareketlerden gelen #N +%20#! radikal ve #N -%20#! sadık\n- #N Modifikatör süresi dolana kadar tekrar kullanılamaz#!"

 gw_suppressing_dissent_decision:0 "Savaş Karşıtı Muhalefeti Bastır"
 gw_suppressing_dissent_decision_desc:0 "Savaş çabasına karşı kışkırtma, polis tedbirleri ve sansür ile dizginlenecektir.\n\n#header Etkiler:#!\n- 2 yıl boyunca #bold Savaş Karşıtı Muhalefeti Bastırma#! uygulanır\n- Derhal #V ulusal hoşnutsuzluğu azaltır#!\n- Aktif olduğu sürece #V hoşnutsuzluğu bastırmaya#! devam eder\n- Cephe gerisinde #N radikalleşmeyi artırır#!\n- #N 2 yıl boyunca tekrar kullanılamaz#!"

 gw_wartime_research_decision:0 "Askerî Araştırmaya Odaklan"
 gw_wartime_research_decision_desc:0 "Bilimsel ve sınaî çaba, ivedi askerî ihtiyaçlara yönlendirilecektir.\n\n#header Etkiler:#!\n- 2 yıl boyunca #bold Savaş Zamanı Araştırma Odağı#! uygulanır\n- #V +25#! haftalık inovasyon\n- #N Modifikatör süresi dolana kadar tekrar kullanılamaz#!"

