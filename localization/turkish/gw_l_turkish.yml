 concept_gw_tier_ultimatum_desc:0 "Dünya Gerginliği #N %70'e#! ulaştığında, bloklar arası diplomatik olaylar ve ültimatomlar tırmanır.\n\nBüyük Güçler taraf seçmek veya hazırlıksız yakalanma riskini göze almak zorundadır."

