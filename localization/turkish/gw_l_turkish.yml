 gw_hist.2006.t:0 "Sınırlar Arasında Romanya"
 gw_hist.2006.d:0 "Her sınır farklı bir geleceğe işaret ediyor. Genelkurmay, ilk seferi bittiğinde hangi vaadin önem taşıyacağını soruyor — ilk nutuklar verildiğinde değil."
 gw_hist.2006.f:0 "Küçük bir tereddüt, büyük bir sınırı tayin edebilir."
 gw_hist.2006.a:0 "Teklifleri canlı tutun."
 gw_hist.2006.b:0 "İtilaf Devletleriyle birlikte hazırlanın."
 gw_hist_2006_a_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Gizli Savaş Vaatleri#! kazanır"
