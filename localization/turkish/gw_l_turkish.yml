 gw_hist.2007.t:0 "Bulgaristan'ın Hesabı"
 gw_hist.2007.d:0 "Son savaşlar ödenmemiş borçlar ve tartışmalı sınırlar bıraktı. Nazırlar intikamın tehlikeli bir danışman olduğunu biliyor, ama aynı zamanda ikna edici bir danışman olduğunu da."
 gw_hist.2007.f:0 "Eski haritalar henüz kaldırılmadı."
 gw_hist.2007.a:0 "Daha güçlü pazarlığı bekleyin."
 gw_hist.2007.b:0 "İttifak Devletleriyle birlikte hazırlanın."
 gw_hist_2007_a_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Gizli Savaş Vaatleri#! kazanır"
 gw_hist_2007_b_tt:0 "#header Etkiler:#!\n- Hizalanma #bold İttifak Devletleri#! yönünde kayar\n- #V 12 ay boyunca#! #bold Savaşa Giriş Hazırlıkları#! kazanır"

 gw_hist.2008.t:0 "Atlantik Ötesinde"
 gw_hist.2008.d:0 "Savaş; millerle uzak, finans, denizcilik ve kamuoyu açısından yakın. Tarafsızlık hâlâ politika, fakat olaylar onu bizim için tanımlamaya başladı."
 gw_hist.2008.f:0 "Okyanuslar kararları erteler; onları ortadan kaldırmaz."
 gw_hist.2008.a:0 "Tarafsızlığı hukukta ve ticarette savunun."
 gw_hist.2008.b:0 "Diplomasimizi İtilaf Devletlerine doğru eğdirin."
 gw_hist_2008_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Tarafsızlık Teminatı#! kazanır\n- #V Dünya Gerginliği 1 azalır#!"
