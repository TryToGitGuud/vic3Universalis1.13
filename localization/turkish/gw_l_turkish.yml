 gw_hist.2005.t:0 "Japonya Deniz Yollarını İnceliyor"
 gw_hist.2005.d:0 "Çatışma Avrupa'da doğmuş olabilir, fakat kömür istasyonları, kiralık limanlar ve deniz yolları onu küresel bir hesaba dönüştürüyor. Fırsat bir donanma üniforması giyiyor."
 gw_hist.2005.f:0 "Bir denizcilik haritasında mesafe daha kısadır."
 gw_hist.2005.a:0 "Durumu limandan izleyin."
 gw_hist.2005.b:0 "İtilaf ile birlikte harekete hazırlanın."
 gw_hist_2005_a_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Tarafsızlık Teminatı#! kazanır"
