 # --- Neutrality ---
 gw_declare_neutrality_decision:0 "Declare Neutrality"
 gw_declare_neutrality_decision_desc:0 "Our nation shall formally declare neutrality in the struggle between the Great Powers.\n\n#header Effects:#!\n- Applies #bold Declared Neutrality#!\n- #V -10%#! war exhaustion from casualties\n- #V +3%#! influence\n- #N -10%#! prestige\n- #N Other powers will regard our stance with suspicion#!\n- #N 1-year cooldown#! before changing stance again"
 gw_neutrality_tooltip:0 "Cannot already be neutral.\nMust not have changed stance in the last year.\nMust be a Great Power.\nNeutrality carries diplomatic and prestige costs."
 gw_revoke_neutrality_decision:0 "Revoke Neutrality"
 gw_revoke_neutrality_decision_desc:0 "Our nation shall abandon its neutral stance and re-enter the arena of Great Power politics.\n\n#header Effects:#!\n- Removes #bold Declared Neutrality#! modifier\n- We may once again align with either the [concept_gw_central_powers] or [concept_gw_allied_powers]\n- #N 1-year cooldown#! before changing stance again"
 gw_revoke_neutrality_tooltip:0 "Must currently be neutral.\nMust not have changed stance in the last year."
