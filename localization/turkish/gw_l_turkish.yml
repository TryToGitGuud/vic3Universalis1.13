 # --- Soft Historical Events ---
 gw_hist.1001.t:0 "Meclis Önündeki Donanma Tahsisatı"
 gw_hist.1001.d:0 "Donanma için yeni tahsisatlar ağır mühür altında geliyor. Amiraller ölçülü rakamlarla konuşuyor, fakat her sütun aynı sonuca işaret ediyor: rakip bir donanma artık uzak bir endişe değildir."
 gw_hist.1001.f:0 "Çelik, kömür ve prestij artık aynı defteri paylaşıyor."
 gw_hist.1001.a:0 "Donanma tahsisatını onaylayın."
 gw_hist.1001.b:0 "Yarış siyasete dönüşmeden sınırlamaları arayın."
 gw_hist_1001_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Donanma Tahsisatı#! kazanır"
 gw_hist_1001_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Son Konferans Ruhu#! kazanır\n- #V Dünya Gerginliği 1 azalır#!"

 gw_hist.1002.t:0 "Balkanlarda Bir Kıvılcım"
 gw_hist.1002.d:0 "Yarımadadan gelen raporlar aynı tedirgin ritmi taşıyor: dilekçeler, subaylar, sınır devriyeleri, inkârlar. Hiçbir kabine genel bir savaş istemiyor, fakat hiçbiri de ilk önce gözünü kaçırmayı arzulamıyor."
 gw_hist.1002.f:0 "Harita yalnızca uzaktan sessizdir."
 gw_hist.1002.a:0 "Sınır komutanlıklarını hazır tutun."
 gw_hist.1002.b:0 "Sefarethanelere sessiz talimatlar gönderin."
 gw_hist_1002_a_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Savaşa Giriş Hazırlıkları#! kazanır"
 gw_hist_1002_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Gizli Diplomasi#! kazanır\n- #V Dünya Gerginliği 1 azalır#!"

 gw_hist.1003.t:0 "Belçika Tarafsızlığı Tartışılıyor"
 gw_hist.1003.d:0 "Küçük bir ülke, büyük emeller arasındaki en kısa yolun üstünde duruyor. Antlaşmalar tarafsızlık vaat ediyor; savaş planları ise bu vaatlerin ne kadar güçlü hatırlanacağını sınıyor."
 gw_hist.1003.f:0 "Bazı teminatlar mürekkeple imzalanır, seferberlik tarifeleriyle ölçülür."
 gw_hist.1003.a:0 "Teminatı yeniden teyit edin."
 gw_hist.1003.b:0 "Her yolu inceleme altında tutun."
 gw_hist_1003_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Tarafsızlık Teminatı#! kazanır\n- #V Dünya Gerginliği 1 azalır#!"
 gw_hist_1003_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Gizli Savaş Vaatleri#! kazanır"

 gw_hist.1004.t:0 "Temmuz Notası"
 gw_hist.1004.d:0 "Yalnızca korkmuş ya da yalıtılmış birinin kabul edebileceği bir dille bir nota kaleme alınıyor. Etrafında müttefikler sertlik, nazırlar zaman, basın ise kan istiyor."
 gw_hist.1004.f:0 "Toplar cevap verene kadar diplomasi gibi gelen cümleler vardır."
 gw_hist.1004.a:0 "Sert notayı gönderin."
 gw_hist.1004.b:0 "Arabuluculuğa bir kapı bırakın."
 gw_hist_1004_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Gizli Savaş Vaatleri#! kazanır"
 gw_hist_1004_b_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Gizli Diplomasi#! kazanır\n- #V Dünya Gerginliği 2 azalır#!"

 gw_hist.1005.t:0 "Denizde Tarafsız Haklar"
 gw_hist.1005.d:0 "Sigortacılar, armatörler ve konsoloslar aynı bekleme odalarına toplanıyor. Savaş gelirse tarafsız bayraklar ticareti koruyabilir veya yalnızca onu denetime işaretleyebilir."
 gw_hist.1005.f:0 "Bir kargo manifestosu diplomatik bir hadiseye dönüşebilir."
 gw_hist.1005.a:0 "Haklarımızı savunmaya hazırlanın."
 gw_hist.1005.b:0 "Ticareti kavgadan uzak tutun."
 gw_hist_1005_a_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Tarafsızlık Baskısı#! kazanır"
 gw_hist_1005_b_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Tarafsızlık Teminatı#! kazanır\n- #V Dünya Gerginliği 1 azalır#!"

 gw_hist.1006.t:0 "Barışın Son Haftası"
 gw_hist.1006.d:0 "Demiryolu daireleri gece yarısından sonra da yanık. Telgraflar nazırların cevap verebileceğinden hızlı geliyor. Herkes hâlâ barıştan söz ediyor, ama savaş çarkı hareket etmeye başladı."
 gw_hist.1006.f:0 "Sonunda sessizlik idarîdir."
 gw_hist.1006.a:0 "Orduları teyakkuza geçirin."
 gw_hist.1006.b:0 "Son bir çağrı yapın."
 gw_hist_1006_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Savaşa Giriş Hazırlıkları#! kazanır"
 gw_hist_1006_b_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Son Konferans Ruhu#! kazanır\n- #V Dünya Gerginliği 2 azalır#!"

 gw_hist.2001.t:0 "Yollar Arasında Belçika"
 gw_hist.2001.d:0 "Başka yerlerde çizilen savaş planları şimdi sınırlarımıza doğru işaret ediyor. Tarafsızlık hâlâ kanunumuz, fakat her sefir, ordular izin sormayı bıraktığında ne yapacağımızı soruyor."
 gw_hist.2001.f:0 "Bir antlaşma sınanmadan önce en güçlüsüdür."
 gw_hist.2001.a:0 "Tarafsızlığımızda durun."
 gw_hist.2001.b:0 "Savunucularla birlikte direnmeye hazırlanın."
 gw_hist_2001_a_tt:0 "#header Etkiler:#!\n- #V 12 ay boyunca#! #bold Tarafsızlık Teminatı#! kazanır\n- #V Dünya Gerginliği 1 azalır#!"
 gw_hist_2001_b_tt:0 "#header Etkiler:#!\n- Hizalanma #bold İtilaf Devletleri#! yönünde kayar\n- #V 12 ay boyunca#! #bold Savaşa Giriş Hazırlıkları#! kazanır"

 gw_hist.2002.t:0 "Kabine ve Manş"
 gw_hist.2002.d:0 "Donanma hazır, kabine bölünmüş ve gazeteler Avrupa'nın dengesinden söz ediyor. Asıl mesele, Manş tehdit altındayken savaşın kıtasal kalıp kalamayacağıdır."
 gw_hist.2002.f:0 "Bir ada hâlâ anakaranın kaderine bağlı olabilir."
 gw_hist.2002.a:0 "Kabineyi ihtiyatta tutun."
 gw_hist.2002.b:0 "Tehdit altındaki düzenle yan yana durun."
 gw_hist_2002_a_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Tarafsızlık Baskısı#! kazanır"
 gw_hist_2002_b_tt:0 "#header Etkiler:#!\n- Hizalanma #bold İtilaf Devletleri#! yönünde kayar\n- #V 12 ay boyunca#! #bold Savaşa Giriş Hazırlıkları#! kazanır"

 gw_hist.2003.t:0 "Bâb-ı Âli Savaşı Tartıyor"
 gw_hist.2003.d:0 "Elçiler borçlardan, toplardan, demiryollarından ve kaybedilen vilayetlerden söz ediyor. Uzak durmak devleti koruyabilir; iyi seçmek ise onun güçler arasındaki yerini geri kazandırabilir."
 gw_hist.2003.f:0 "Eski imparatorluklar bekleyişin bedelini bilir."
 gw_hist.2003.a:0 "Hareket serbestimizi koruyun."
 gw_hist.2003.b:0 "İttifak Devletleriyle şartları arayın."
 gw_hist.2003.c:0 "İtilaf Devletlerine kanal açın."
 gw_hist_2003_a_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Tarafsızlık Teminatı#! kazanır"
 gw_hist_2003_b_tt:0 "#header Etkiler:#!\n- Hizalanma #bold İttifak Devletleri#! yönünde kayar\n- #V 12 ay boyunca#! #bold Gizli Savaş Vaatleri#! kazanır"
 gw_hist_2003_c_tt:0 "#header Etkiler:#!\n- Hizalanma #bold İtilaf Devletleri#! yönünde kayar\n- #V 9 ay boyunca#! #bold Savaşa Giriş Hazırlıkları#! kazanır"

 gw_hist.2004.t:0 "İtalya Vaatleri Sayıyor"
 gw_hist.2004.d:0 "Kapalı kapılar ardında haritalar açılıyor. Her sınırın bir tartışması, her müttefikin bir hatırası ve her vaadin bugün söylediğinden daha fazlasını sonra anlatması beklenir."
 gw_hist.2004.f:0 "Tarafsızlık bir konum olabilir, ya da bir bedel."
 gw_hist.2004.a:0 "Daha sağlam teklifleri bekleyin."
 gw_hist.2004.b:0 "İtilaf davasına meylediniz."
 gw_hist.2004.c:0 "İttifak mutabakatına sadık kalın."
 gw_hist_2004_a_tt:0 "#header Etkiler:#!\n- #V 9 ay boyunca#! #bold Gizli Savaş Vaatleri#! kazanır"
 gw_hist_2004_b_tt:0 "#header Etkiler:#!\n- Hizalanma #bold İtilaf Devletleri#! yönünde kayar\n- #V 12 ay boyunca#! #bold Gizli Savaş Vaatleri#! kazanır"
