 # --- Congress Decisions ---
 gw_congress_call_denounce:0 "Cemiyet Kongresini Topla: Kınama"
 gw_congress_call_denounce_desc:0 "Cemiyet üyesi olarak, saldırgan davranışı için bir milleti resmen kınamak üzere Milletler Cemiyetini toplayacağız. Üye devletler önergeyi uluslararası prestijlerine göre ağırlıklı olarak oylayacak.\n\n#header Gereklilikler:#!\n- Büyük Güç veya Önemli Güç olmalıyız\n- Hedef en az 25 Kötü Nam'a sahip olmalı\n- Kongre 3 ay sürer\n- Geçmesi için %60 ağırlıklı destek gerekir\n\n#header Geçerse:#!\n- Hedef: 5 yıl boyunca #N -%15#! Prestij, #N -%10#! Nüfuz, #N -%25#! Kötü Nam Azalması\n- Hedef: #N +5#! Kötü Nam\n\n#header Geçmezse:#!\n- Hedef 3 yıl boyunca #V +%15#! Prestij ve #V +%25#! Kötü Nam Azalması kazanır"
 gw_congress_call_embargo:0 "Cemiyet Kongresini Topla: Ambargo"
 gw_congress_call_embargo_desc:0 "Asi bir millete karşı kolektif ekonomik yaptırımlar uygulamak üzere Milletler Cemiyetini toplayacağız. Bu, mevcut en ağır ekonomik yaptırımdır ve geniş uluslararası destek gerektirir.\n\n#header Gereklilikler:#!\n- Büyük Güç veya Önemli Güç olmalıyız\n- Hedef en az 50 Kötü Nam'a sahip olmalı\n- Kongre 3 ay sürer\n- Geçmesi için %70 ağırlıklı destek gerekir\n\n#header Geçerse:#!\n- Hedef: 5 yıl boyunca #N -%25#! Ticari Rekabetçilik, #N -%10#! Prestij, #N -%15#! Nüfuz\n\n#header Geçmezse:#!\n- Hedef 3 yıl boyunca #V +%15#! Prestij, #V +%25#! Kötü Nam Azalması kazanır"
